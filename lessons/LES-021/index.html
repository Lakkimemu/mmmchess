<script id="lesson-data" type="application/json">{"lesson_id": "LES-021", "kb_id": "KB-109", "topic_id": "TOP-109", "unit_id": "UNT-001", "sequence": 21, "objective": "**🎯 Today's Goal:**\nYour child will understand that pawns march straight ahead but attack diagonally, and that they can never move backward.", "success_criteria": "**✅ Lesson Success Criteria:**\n- The child moves a pawn exactly one square straight forward.\n- The child uses the two-square jump option correctly on the first move.\n- The child captures an enemy piece diagonally (and refuses to capture straight ahead).", "source_traces": {"objective": "KB-109#1#B2", "success_criteria": "KB-109#1#B3"}, "prerequisites": [], "readiness_checks": [], "parent_notes": [], "parent_reference": [{"ordinal": 1, "section_id": "AT_A_GLANCE", "heading": "1. At a Glance", "source_trace": "KB-109#1", "content": "- **Topic**: Pawn Movement\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 20 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-108 Knight Movement, TOP-013 Pawn Recognition\n\n**🎯 Today's Goal:**\nYour child will understand that pawns march straight ahead but attack diagonally, and that they can never move backward.\n\n**✅ Lesson Success Criteria:**\n- The child moves a pawn exactly one square straight forward.\n- The child uses the two-square jump option correctly on the first move.\n- The child captures an enemy piece diagonally (and refuses to capture straight ahead).\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"ordinal": 2, "section_id": "DEFINITION", "heading": "2. Definition", "source_trace": "KB-109#2", "content": "The Pawn is the infantry of the chess army. It is unique because it is the only piece that moves in one way, but captures in a completely different way. A Pawn moves straight forward one square at a time, but it captures diagonally forward one square. Pawns can never move backward or capture backward. As a special bonus, on its very first move of the game, a Pawn has the choice to jump forward two squares instead of one."}, {"ordinal": 3, "section_id": "WHY_IT_MATTERS", "heading": "3. Why It Matters", "source_trace": "KB-109#3", "content": "Pawns make up half of your chess army! Because they cannot move backward, every time you push a pawn, you leave a permanent hole behind it in your defense. Learning how pawns crash into each other and lock up the board is the foundation of chess strategy."}, {"ordinal": 4, "section_id": "BEFORE_YOU_TEACH", "heading": "4. Before You Teach (Graph)", "source_trace": "KB-109#4", "content": "- **Requires:** TOP-013 (Pawn Recognition), TOP-108 (Knight Movement)\n- **Unlocks:** TOP-024 (En Passant), TOP-088 (Promotion)"}, {"ordinal": 5, "section_id": "PARENT_UNDERSTANDS", "heading": "5. Parent Understands", "source_trace": "KB-109#5", "content": "The Pawn breaks the rules of all the other pieces.\n1. **Movement:** Straight ahead. \n2. **Capturing:** Diagonally ahead. If an enemy piece is sitting directly in front of your pawn, your pawn is blocked. It cannot capture it, and it cannot jump it.\n3. **The First Move:** When a pawn is sitting on its starting rank (the 2nd rank for White, 7th rank for Black), it has the *option* to march two squares forward in a single bound. Once it leaves its starting square, it can only ever take one step at a time.\n4. **No Retreat:** Pawns are the only pieces that cannot move backward. Ever."}, {"ordinal": 6, "section_id": "HOW_TO_TEACH_IT", "heading": "6. How to Teach It", "source_trace": "KB-109#6", "content": "1. **The March:** Place a White pawn on its starting square (e.g., `e2`). Say, \"The pawn is a brave little soldier. He marches straight ahead!\" Move it one square forward. Explain he can never go backwards.\n2. **The Double Sprint:** Put the pawn back on the starting square. \"Because he has a lot of energy at the start of the battle, he can choose to sprint TWO steps on his very first move!\" Show the two-step move.\n3. **The Blockade:** Place a White pawn on `d4` and a Black pawn on `d5` so they are face-to-face. Ask the child to move the White pawn forward. Explain: \"Crash! Their shields hit! They are blocked and cannot move.\"\n4. **The Diagonal Attack:** Keep the blockaded pawns. Add a Black Rook on `e5` (diagonally in front of the White pawn). Say, \"Soldiers hold their shields in front, but they attack with their swords to the side!\" Show the White pawn capturing the Black Rook diagonally."}, {"ordinal": 7, "section_id": "STORY_ANALOGY_MEMORY", "heading": "7. Teaching Story / Analogy / Memory Hint", "source_trace": "KB-109#7", "content": "**The Brave Soldier with a Shield and Sword:** \nImagine the little pawn holding a heavy wooden shield straight in front of his chest, and holding his sword sticking out to the side. When he marches, he walks straight ahead behind his shield. If he bumps into an enemy shield, he is stuck! But if an enemy steps to the side, he can use his sword to capture them diagonally! And because he is so brave, he never runs away—no backward moves allowed!"}, {"ordinal": 8, "section_id": "DID_YOU_KNOW", "heading": "8. Did You Know? 🎓", "source_trace": "KB-109#8", "content": "Because pawns can never move backward, grandmasters think incredibly hard before pushing a pawn. Once a pawn moves forward, you can never put it back to defend the squares it just left behind!"}, {"ordinal": 9, "section_id": "BOARD_DIAGRAM_1", "heading": "9. Board Diagram 1 — Basic Concept", "source_trace": "KB-109#9", "content": "![DGM-109-01: A White Pawn on e2 with arrows showing the choice of moving to e3 or e4.](../../assets/diagrams/TOP-109/DGM-109-01.svg)\n*On its first move, the pawn can choose to march one square or sprint two squares.*"}, {"ordinal": 10, "section_id": "HOW_IT_WORKS", "heading": "10. How It Works", "source_trace": "KB-109#10", "content": "Once a pawn has moved (even if it only moved one square), it loses the power to sprint. From then on, it is one square at a time. It cannot jump over any pieces, even when using its two-square sprint."}, {"ordinal": 11, "section_id": "BOARD_DIAGRAM_2", "heading": "11. Board Diagram 2 — Practical Example", "source_trace": "KB-109#11", "content": "![DGM-109-02: A White Pawn blocked by a Black Pawn directly in front, with green arrows pointing to capture options diagonally.](../../assets/diagrams/TOP-109/DGM-109-02.svg)\n*The pawn is blocked from moving straight, but it can capture diagonally.*"}, {"ordinal": 12, "section_id": "REAL_GAME_EXAMPLE", "heading": "12. Real Game Example", "source_trace": "KB-109#12", "content": "![DGM-109-03: A chain of White pawns protecting each other diagonally.](../../assets/diagrams/TOP-109/DGM-109-03.svg)\n*Because pawns attack diagonally, they are very good at standing in diagonal lines to protect each other. This is called a \"Pawn Chain\"!*"}, {"ordinal": 13, "section_id": "COMMON_MISTAKES", "heading": "13. Common Mistakes", "source_trace": "KB-109#13", "content": "- **Capturing Straight:** Because all the other pieces capture the exact same way they move, children will naturally try to capture pieces straight ahead with the pawn.\n- **Moving two squares later in the game:** They might try to use the two-square sprint when the pawn is already in the middle of the board.\n- **Moving backwards:** In a panic, a child might try to retreat a pawn.\n\n> **🧑‍🏫 Coach Tip:**\n> If they try to capture straight ahead, make a wooden \"bonk!\" sound. \"Bonk! The shields hit! The soldier can't attack through his own shield!\""}, {"ordinal": 14, "section_id": "TEACHING_NOTES", "heading": "14. Teaching Notes", "source_trace": "KB-109#14", "content": "You are introducing a massive cognitive leap here: separating *movement* from *capturing*. Spend almost all of your practice time reinforcing the diagonal capture. \n\n> **🧑‍🏫 Coach Tip:**\n> To help them remember the diagonal capture, have them hold their hands up like holding a shield, and poke their elbows out to the side to represent the swords."}, {"ordinal": 15, "section_id": "PARENT_FAQ", "heading": "15. Parent FAQ", "source_trace": "KB-109#15", "content": "**Q: What happens when the pawn reaches the very end of the board?**\nA: Magic happens! The pawn gets \"promoted\" and turns into a Queen! We will learn all about the rules of Promotion in a later lesson. \n\n**Q: Can a pawn capture backwards diagonally?**\nA: No. Pawns can NEVER do anything backwards. All moves and all captures must be going forward toward the enemy's side of the board."}, {"ordinal": 16, "section_id": "PRACTICE_TOGETHER", "heading": "16. Practice Together", "source_trace": "KB-109#16", "content": "**The Pawn Wars Game:**\nTake all the big pieces off the board. Set up just the 8 White pawns on the 2nd rank, and the 8 Black pawns on the 7th rank. Play a mini-game where you only move pawns! Whoever gets one pawn to the other side of the board first wins. This is the absolute best way to teach the two-square sprint, blockades, and diagonal captures."}, {"ordinal": 17, "section_id": "COACH_CHALLENGE", "heading": "17. Coach Challenge ⭐", "source_trace": "KB-109#17", "content": "**The Trapped Soldier:**\nPlace a White pawn on `d4`. Place Black pawns on `c5`, `d5`, and `e5` (surrounding the front of the White pawn). \nAsk your child: \"Can your brave soldier move straight forward?\" (No, blocked by `d5`).\n\"Can your brave soldier capture?\" (Yes, he can capture either `c5` or `e5` diagonally!). \nLet them choose a capture. This solidifies that being blocked straight ahead does not mean the pawn is useless."}, {"ordinal": 18, "section_id": "TRY_IT_YOURSELF", "heading": "18. Try It Yourself", "source_trace": "KB-109#18", "content": "### 🟢 Recognition (Easy)\n![DGM-109-04: White pawn on e4. Highlight a legal straight move and an illegal backward move.](../../assets/diagrams/TOP-109/DGM-109-04.svg)\n**Question:** Which way is the pawn allowed to march? Up the board, or down the board?\n**Answer:** Up the board! Pawns never retreat.\n\n### 🟡 Application (Medium)\n![DGM-109-05: White Pawn on h2 (starting square). Black Knight on h4.](../../assets/diagrams/TOP-109/DGM-109-05.svg)\n**Question:** The White pawn is on its starting square. Can it sprint two squares to h4?\n**Answer:** No! Even though it has the two-square sprint power, it cannot jump or land on the Black Knight. The Knight is blocking the road.\n\n### 🔴 Challenge (Hard)\n![DGM-109-06: White Pawn on c4. Black Rook on c5. Black Bishop on d5.](../../assets/diagrams/TOP-109/DGM-109-06.svg)\n**Question:** The White pawn is blocked by the Black Rook straight ahead. Which piece is the White pawn allowed to capture?\n**Answer:** The Black Bishop on d5! Pawns capture diagonally."}, {"ordinal": 19, "section_id": "CONTINUE_LEARNING", "heading": "19. Continue Learning", "source_trace": "KB-109#19", "content": "- **Lichess Practice:** [The Pieces - Pawn](https://lichess.org/learn#/6) (Interactive drills for kids)."}, {"ordinal": 20, "section_id": "RELATED_TOPICS", "heading": "20. Related Topics", "source_trace": "KB-109#20", "content": "- **Prerequisites:** TOP-108 Knight Movement, TOP-013 Pawn (Recognition)\n- **Next Steps:** TOP-088 Promotion, TOP-019 Check"}, {"ordinal": 21, "section_id": "PARENT_CONFIDENCE_CHECK", "heading": "21. Parent Confidence Check ✅", "source_trace": "KB-109#21", "content": "- [ ] Do I understand the pawn's two-square option on the first move?\n- [ ] Do I understand that pawns move straight, but capture diagonally?\n- [ ] Do I understand that pawns can never move backward?\n- [ ] Did we play the \"Pawn Wars\" mini-game?\n- [ ] Can my child explain why a pawn cannot capture straight ahead?\n\n---\n\n```yaml\nkb_quality:\n  reviewed: true\n  diagrams: 6\n  mini_puzzles: 3\n  external_resources: 1\n  coach_challenges: 1\n  practice_activities: 1\n  coach_tips: 2\n  parent_faq: 2\n  estimated_read_time: 20 min\n```"}], "slides": [{"id": "LES-021-S001", "role": "KB_CONTENT", mini-game where you only move pawns! Whoever gets one pawn to the other side of the board first wins. This is the absolute best way to teach the two-square sprint, blockades, and diagonal captures."}, {"id": "LES-021-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-109#17#B1", "parent_prompt_trace": "KB-109#17#B1", "text": "**The Trapped Soldier:**\nPlace a White pawn on `d4`. Place Black pawns on `c5`, `d5`, and `e5` (surrounding the front of the White pawn). \nAsk your child: \"Can your brave soldier move straight forward?\" (No, blocked by `d5`).\n\"Can your brave soldier capture?\" (Yes, he can capture either `c5` or `e5` diagonally!). \nLet them choose a capture. This solidifies that being blocked straight ahead does not mean the pawn is useless."}, {"id": "LES-021-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-109#18#B1", "parent_prompt_trace": "KB-109#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which way is the pawn allowed to march? Up the board, or down the board?\n**Answer:** Up the board! Pawns never retreat.\n\n### 🟡 Application (Medium)\n\n**Question:** The White pawn is on its starting square. Can it sprint two squares to h4?\n**Answer:** No! Even though it has the two-square sprint power, it cannot jump or land on the Black Knight. The Knight is blocking the road.\n\n### 🔴 Challenge (Hard)\n\n**Question:** The White pawn is blocked by the Black Rook straight ahead. Which piece is the White pawn allowed to capture?\n**Answer:** The Black Bishop on d5! Pawns capture diagonally.", "diagram_id": "DGM-109-06", "diagram_url": "assets/DGM-109-06.svg", "position_id": "POS-PAWN-MOVEMENT-006", "position_version": 1, "position_title": "Blocked pawn captures the diagonal bishop", "diagram_alt": "Blocked pawn captures the diagonal bishop"}, {"id": "LES-021-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-109#19#B1", "parent_prompt_trace": "KB-109#19#B1", "text": "- **Lichess Practice:** [The Pieces - Pawn](https://lichess.org/learn#/6) (Interactive drills for kids)."}, {"id": "LES-021-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-109#20#B1", "parent_prompt_trace": "KB-109#20#B1", "text": "- **Prerequisites:** TOP-108 Knight Movement, TOP-013 Pawn (Recognition)\n- **Next Steps:** TOP-088 Promotion, TOP-019 Check"}, {"id": "LES-021-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-109#21#B1", "parent_prompt_trace": "KB-109#21#B1", "text": "- [ ] Do I understand the pawn's two-square option on the first move?\n- [ ] Do I understand that pawns move straight, but capture diagonally?\n- [ ] Do I understand that pawns can never move backward?\n- [ ] Did we play the \"Pawn Wars\" mini-game?\n- [ ] Can my child explain why a pawn cannot capture straight ahead?"}], "task_references": ["PZL-021-01", "PZL-021-02", "PZL-021-03", "PZL-021-04"], "diagram_references": ["DGM-109-01", "DGM-109-02", "DGM-109-03", "DGM-109-04", "DGM-109-05", "DGM-109-06"], "diagram_deferrals": [], "assessment_reference": "ASM-021", "deferred_topics": [], "teach_slides": [{"id": "LES-021-S01", "type": "INTRO", "title": "Pawn Movement", "text": "Pawns march straight", "parent_prompt": "Introduce the pawn's two different jobs.", "diagram_id": "DGM-109-01", "diagram_url": "assets/DGM-109-01.svg", "visual": {"diagram_id": "DGM-109-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-001", "position_version": 1, "position_title": "White pawn first-move choices from e2", "diagram_alt": "White pawn first-move choices from e2"}, {"id": "LES-021-S02", "type": "DIAGRAM", "title": "First move choices", "text": "From its starting square a pawn may move one or two clear squares.", "parent_prompt": "Show both starting-square choices.", "diagram_id": "DGM-109-01", "diagram_url": "assets/DGM-109-01.svg", "visual": {"diagram_id": "DGM-109-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-001", "position_version": 1, "position_title": "White pawn first-move choices from e2", "diagram_alt": "White pawn first-move choices from e2"}, {"id": "LES-021-S03", "type": "DIAGRAM", "title": "Blocked but attacking", "text": "A pawn cannot move through the piece ahead but attacks diagonally.", "parent_prompt": "Contrast the blocker with the diagonal target.", "diagram_id": "DGM-109-02", "diagram_url": "assets/DGM-109-02.svg", "visual": {"diagram_id": "DGM-109-02", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-002", "position_version": 1, "position_title": "Blocked pawn with diagonal capture", "diagram_alt": "Blocked pawn with diagonal capture"}, {"id": "LES-021-S04", "type": "DIAGRAM", "title": "Pawn chain", "text": "Pawns protect friendly pawns one diagonal step ahead.", "parent_prompt": "Trace how the pawns protect one another.", "diagram_id": "DGM-109-03", "diagram_url": "assets/DGM-109-03.svg", "visual": {"diagram_id": "DGM-109-03", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-003", "position_version": 1, "position_title": "White pawn chain protects diagonally", "diagram_alt": "White pawn chain protects diagonally"}, {"id": "LES-021-S05", "type": "QUESTION", "title": "No retreat", "text": "Choose the legal forward move.", "parent_prompt": "Ask which direction is legal before revealing.", "diagram_id": "DGM-109-04", "diagram_url": "assets/DGM-109-04.svg", "visual": {"diagram_id": "DGM-109-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-004", "position_version": 1, "position_title": "White pawn moves forward and never backward", "diagram_alt": "White pawn moves forward and never backward"}, {"id": "LES-021-S06", "type": "QUESTION", "title": "No jumping", "text": "A pawn cannot sprint onto an occupied square.", "parent_prompt": "Ask whether the pawn may land on the Knight.", "diagram_id": "DGM-109-05", "diagram_url": "assets/DGM-109-05.svg", "visual": {"diagram_id": "DGM-109-05", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-005", "position_version": 1, "position_title": "Occupied destination blocks the two-square move", "diagram_alt": "Occupied destination blocks the two-square move"}, {"id": "LES-021-S07", "type": "QUESTION", "title": "Capture diagonally", "text": "Find the diagonal capture when the pawn is blocked.", "parent_prompt": "Ask which enemy can be captured.", "diagram_id": "DGM-109-06", "diagram_url": "assets/DGM-109-06.svg", "visual": {"diagram_id": "DGM-109-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-006", "position_version": 1, "position_title": "Blocked pawn captures the diagonal bishop", "diagram_alt": "Blocked pawn captures the diagonal bishop"}, {"id": "LES-021-S08", "type": "ASSESSMENT", "title": "Check your progress", "text": "Show every pawn movement rule.", "parent_prompt": "Check each success criterion on the board.", "diagram_id": "DGM-109-06", "diagram_url": "assets/DGM-109-06.svg", "visual": {"diagram_id": "DGM-109-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-006", "position_version": 1, "position_title": "Blocked pawn captures the diagonal bishop", "diagram_alt": "Blocked pawn captures the diagonal bishop"}], "guide_sections": [{"id": "LES-021-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-109#1#B1", "parent_prompt_trace": "KB-109#1#B1", "text": "- **Topic**: Pawn Movement\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 20 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-108 Knight Movement, TOP-013 Pawn Recognition\n\n**🎯 Today's Goal:**\nYour child will understand that pawns march straight ahead but attack diagonally, and that they can never move backward.\n\n**✅ Lesson Success Criteria:**\n- The child moves a pawn exactly one square straight forward.\n- The child uses the two-square jump option correctly on the first move.\n- The child captures an enemy piece diagonally (and refuses to capture straight ahead).\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-021-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-109#2#B1", "parent_prompt_trace": "KB-109#2#B1", "text": "The Pawn is the infantry of the chess army. It is unique because it is the only piece that moves in one way, but captures in a completely different way. A Pawn moves straight forward one square at a time, but it captures diagonally forward one square. Pawns can never move backward or capture backward. As a special bonus, on its very first move of the game, a Pawn has the choice to jump forward two squares instead of one."}, {"id": "LES-021-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-109#3#B1", "parent_prompt_trace": "KB-109#3#B1", "text": "Pawns make up half of your chess army! Because they cannot move backward, every time you push a pawn, you leave a permanent hole behind it in your defense. Learning how pawns crash into each other and lock up the board is the foundation of chess strategy."}, {"id": "LES-021-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-109#4#B1", "parent_prompt_trace": "KB-109#4#B1", "text": "- **Requires:** TOP-013 (Pawn Recognition), TOP-108 (Knight Movement)\n- **Unlocks:** TOP-024 (En Passant), TOP-088 (Promotion)"}, {"id": "LES-021-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-109#5#B1", "parent_prompt_trace": "KB-109#5#B1", "text": "The Pawn breaks the rules of all the other pieces.\n1. **Movement:** Straight ahead. \n2. **Capturing:** Diagonally ahead. If an enemy piece is sitting directly in front of your pawn, your pawn is blocked. It cannot capture it, and it cannot jump it.\n3. **The First Move:** When a pawn is sitting on its starting rank (the 2nd rank for White, 7th rank for Black), it has the *option* to march two squares forward in a single bound. Once it leaves its starting square, it can only ever take one step at a time.\n4. **No Retreat:** Pawns are the only pieces that cannot move backward. Ever."}, {"id": "LES-021-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-109#6#B1", "parent_prompt_trace": "KB-109#6#B1", "text": "1. **The March:** Place a White pawn on its starting square (e.g., `e2`). Say, \"The pawn is a brave little soldier. He marches straight ahead!\" Move it one square forward. Explain he can never go backwards.\n2. **The Double Sprint:** Put the pawn back on the starting square. \"Because he has a lot of energy at the start of the battle, he can choose to sprint TWO steps on his very first move!\" Show the two-step move.\n3. **The Blockade:** Place a White pawn on `d4` and a Black pawn on `d5` so they are face-to-face. Ask the child to move the White pawn forward. Explain: \"Crash! Their shields hit! They are blocked and cannot move.\"\n4. **The Diagonal Attack:** Keep the blockaded pawns. Add a Black Rook on `e5` (diagonally in front of the White pawn). Say, \"Soldiers hold their shields in front, but they attack with their swords to the side!\" Show the White pawn capturing the Black Rook diagonally."}, {"id": "LES-021-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-109#7#B1", "parent_prompt_trace": "KB-109#7#B1", "text": "**The Brave Soldier with a Shield and Sword:** \nImagine the little pawn holding a heavy wooden shield straight in front of his chest, and holding his sword sticking out to the side. When he marches, he walks straight ahead behind his shield. If he bumps into an enemy shield, he is stuck! But if an enemy steps to the side, he can use his sword to capture them diagonally! And because he is so brave, he never runs away—no backward moves allowed!"}, {"id": "LES-021-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-109#8#B1", "parent_prompt_trace": "KB-109#8#B1", "text": "Because pawns can never move backward, grandmasters think incredibly hard before pushing a pawn. Once a pawn moves forward, you can never put it back to defend the squares it just left behind!"}, {"id": "LES-021-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1 — Basic Concept", "source_trace": "KB-109#9#B1", "parent_prompt_trace": "KB-109#9#B1", "text": "*On its first move, the pawn can choose to march one square or sprint two squares.*", "diagram_id": "DGM-109-01", "diagram_url": "assets/DGM-109-01.svg", "position_id": "POS-PAWN-MOVEMENT-001", "position_version": 1, "position_title": "White pawn first-move choices from e2", "diagram_alt": "White pawn first-move choices from e2"}, {"id": "LES-021-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-109#10#B1", "parent_prompt_trace": "KB-109#10#B1", "text": "Once a pawn has moved (even if it only moved one square), it loses the power to sprint. From then on, it is one square at a time. It cannot jump over any pieces, even when using its two-square sprint."}, {"id": "LES-021-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-109#11#B1", "parent_prompt_trace": "KB-109#11#B1", "text": "*The pawn is blocked from moving straight, but it can capture diagonally.*", "diagram_id": "DGM-109-02", "diagram_url": "assets/DGM-109-02.svg", "position_id": "POS-PAWN-MOVEMENT-002", "position_version": 1, "position_title": "Blocked pawn with diagonal capture", "diagram_alt": "Blocked pawn with diagonal capture"}, {"id": "LES-021-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-109#12#B1", "parent_prompt_trace": "KB-109#12#B1", "text": "*Because pawns attack diagonally, they are very good at standing in diagonal lines to protect each other. This is called a \"Pawn Chain\"!*", "diagram_id": "DGM-109-03", "diagram_url": "assets/DGM-109-03.svg", "position_id": "POS-PAWN-MOVEMENT-003", "position_version": 1, "position_title": "White pawn chain protects diagonally", "diagram_alt": "White pawn chain protects diagonally"}, {"id": "LES-021-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-109#13#B1", "parent_prompt_trace": "KB-109#13#B1", "text": "- **Capturing Straight:** Because all the other pieces capture the exact same way they move, children will naturally try to capture pieces straight ahead with the pawn.\n- **Moving two squares later in the game:** They might try to use the two-square sprint when the pawn is already in the middle of the board.\n- **Moving backwards:** In a panic, a child might try to retreat a pawn.\n\n> **🧑‍🏫 Coach Tip:**\n> If they try to capture straight ahead, make a wooden \"bonk!\" sound. \"Bonk! The shields hit! The soldier can't attack through his own shield!\""}, {"id": "LES-021-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-109#14#B1", "parent_prompt_trace": "KB-109#14#B1", "text": "You are introducing a massive cognitive leap here: separating *movement* from *capturing*. Spend almost all of your practice time reinforcing the diagonal capture.\n\n> **🧑‍🏫 Coach Tip:**\n> To help them remember the diagonal capture, have them hold their hands up like holding a shield, and poke their elbows out to the side to represent the swords."}, {"id": "LES-021-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-109#15#B1", "parent_prompt_trace": "KB-109#15#B1", "text": "**Q: What happens when the pawn reaches the very end of the board?**\nA: Magic happens! The pawn gets \"promoted\" and turns into a Queen! We will learn all about the rules of Promotion in a later lesson.\n\n**Q: Can a pawn capture backwards diagonally?**\nA: No. Pawns can NEVER do anything backwards. All moves and all captures must be going forward toward the enemy's side of the board."}, {"id": "LES-021-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-109#16#B1", "parent_prompt_trace": "KB-109#16#B1", "text": "**The Pawn Wars Game:**\nTake all the big pieces off the board. Set up just the 8 White pawns on the 2nd rank, and the 8 Black pawns on the 7th rank. Play a mini-game where you only move pawns! Whoever gets one pawn to the other side of the board first wins. This is the absolute best way to teach the two-square sprint, blockades, and diagonal captures."}, { land on the Knight.", "diagram_id": "DGM-109-05", "diagram_url": "assets/DGM-109-05.svg", "visual": {"diagram_id": "DGM-109-05", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-005", "position_version": 1, "position_title": "Occupied destination blocks the two-square move", "diagram_alt": "Occupied destination blocks the two-square move"}, {"id": "LES-021-S07", "type": "QUESTION", "title": "Capture diagonally", "text": "Find the diagonal capture when the pawn is blocked.", "parent_prompt": "Ask which enemy can be captured.", "diagram_id": "DGM-109-06", "diagram_url": "assets/DGM-109-06.svg", "visual": {"diagram_id": "DGM-109-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-006", "position_version": 1, "position_title": "Blocked pawn captures the diagonal bishop", "diagram_alt": "Blocked pawn captures the diagonal bishop"}, {"id": "LES-021-S08", "type": "ASSESSMENT", "title": "Check your progress", "text": "Show every pawn movement rule.", "parent_prompt": "Check each success criterion on the board.", "diagram_id": "DGM-109-06", "diagram_url": "assets/DGM-109-06.svg", "visual": {"diagram_id": "DGM-109-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-PAWN-MOVEMENT-006", "position_version": 1, "position_title": "Blocked pawn captures the diagonal bishop", "diagram_alt": "Blocked pawn captures the diagonal bishop"}]}, "continue_teaching": {"title": "Continue Teaching", "estimated_minutes": 0, "groups": []}, "full_guide": {"title": "Parent Full Guide", "sections": [{"id": "LES-021-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-109#1#B1", "parent_prompt_trace": "KB-109#1#B1", "text": "- **Topic**: Pawn Movement\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 20 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-108 Knight Movement, TOP-013 Pawn Recognition\n\n**🎯 Today's Goal:**\nYour child will understand that pawns march straight ahead but attack diagonally, and that they can never move backward.\n\n**✅ Lesson Success Criteria:**\n- The child moves a pawn exactly one square straight forward.\n- The child uses the two-square jump option correctly on the first move.\n- The child captures an enemy piece diagonally (and refuses to capture straight ahead).\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-021-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-109#2#B1", "parent_prompt_trace": "KB-109#2#B1", "text": "The Pawn is the infantry of the chess army. It is unique because it is the only piece that moves in one way, but captures in a completely different way. A Pawn moves straight forward one square at a time, but it captures diagonally forward one square. Pawns can never move backward or capture backward. As a special bonus, on its very first move of the game, a Pawn has the choice to jump forward two squares instead of one."}, {"id": "LES-021-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-109#3#B1", "parent_prompt_trace": "KB-109#3#B1", "text": "Pawns make up half of your chess army! Because they cannot move backward, every time you push a pawn, you leave a permanent hole behind it in your defense. Learning how pawns crash into each other and lock up the board is the foundation of chess strategy."}, {"id": "LES-021-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-109#4#B1", "parent_prompt_trace": "KB-109#4#B1", "text": "- **Requires:** TOP-013 (Pawn Recognition), TOP-108 (Knight Movement)\n- **Unlocks:** TOP-024 (En Passant), TOP-088 (Promotion)"}, {"id": "LES-021-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-109#5#B1", "parent_prompt_trace": "KB-109#5#B1", "text": "The Pawn breaks the rules of all the other pieces.\n1. **Movement:** Straight ahead. \n2. **Capturing:** Diagonally ahead. If an enemy piece is sitting directly in front of your pawn, your pawn is blocked. It cannot capture it, and it cannot jump it.\n3. **The First Move:** When a pawn is sitting on its starting rank (the 2nd rank for White, 7th rank for Black), it has the *option* to march two squares forward in a single bound. Once it leaves its starting square, it can only ever take one step at a time.\n4. **No Retreat:** Pawns are the only pieces that cannot move backward. Ever."}, {"id": "LES-021-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-109#6#B1", "parent_prompt_trace": "KB-109#6#B1", "text": "1. **The March:** Place a White pawn on its starting square (e.g., `e2`). Say, \"The pawn is a brave little soldier. He marches straight ahead!\" Move it one square forward. Explain he can never go backwards.\n2. **The Double Sprint:** Put the pawn back on the starting square. \"Because he has a lot of energy at the start of the battle, he can choose to sprint TWO steps on his very first move!\" Show the two-step move.\n3. **The Blockade:** Place a White pawn on `d4` and a Black pawn on `d5` so they are face-to-face. Ask the child to move the White pawn forward. Explain: \"Crash! Their shields hit! They are blocked and cannot move.\"\n4. **The Diagonal Attack:** Keep the blockaded pawns. Add a Black Rook on `e5` (diagonally in front of the White pawn). Say, \"Soldiers hold their shields in front, but they attack with their swords to the side!\" Show the White pawn capturing the Black Rook diagonally."}, {"id": "LES-021-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-109#7#B1", "parent_prompt_trace": "KB-109#7#B1", "text": "**The Brave Soldier with a Shield and Sword:** \nImagine the little pawn holding a heavy wooden shield straight in front of his chest, and holding his sword sticking out to the side. When he marches, he walks straight ahead behind his shield. If he bumps into an enemy shield, he is stuck! But if an enemy steps to the side, he can use his sword to capture them diagonally! And because he is so brave, he never runs away—no backward moves allowed!"}, {"id": "LES-021-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-109#8#B1", "parent_prompt_trace": "KB-109#8#B1", "text": "Because pawns can never move backward, grandmasters think incredibly hard before pushing a pawn. Once a pawn moves forward, you can never put it back to defend the squares it just left behind!"}, {"id": "LES-021-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1 — Basic Concept", "source_trace": "KB-109#9#B1", "parent_prompt_trace": "KB-109#9#B1", "text": "*On its first move, the pawn can choose to march one square or sprint two squares.*", "diagram_id": "DGM-109-01", "diagram_url": "assets/DGM-109-01.svg", "position_id": "POS-PAWN-MOVEMENT-001", "position_version": 1, "position_title": "White pawn first-move choices from e2", "diagram_alt": "White pawn first-move choices from e2"}, {"id": "LES-021-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-109#10#B1", "parent_prompt_trace": "KB-109#10#B1", "text": "Once a pawn has moved (even if it only moved one square), it loses the power to sprint. From then on, it is one square at a time. It cannot jump over any pieces, even when using its two-square sprint."}, {"id": "LES-021-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-109#11#B1", "parent_prompt_trace": "KB-109#11#B1", "text": "*The pawn is blocked from moving straight, but it can capture diagonally.*", "diagram_id": "DGM-109-02", "diagram_url": "assets/DGM-109-02.svg", "position_id": "POS-PAWN-MOVEMENT-002", "position_version": 1, "position_title": "Blocked pawn with diagonal capture", "diagram_alt": "Blocked pawn with diagonal capture"}, {"id": "LES-021-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-109#12#B1", "parent_prompt_trace": "KB-109#12#B1", "text": "*Because pawns attack diagonally, they are very good at standing in diagonal lines to protect each other. This is called a \"Pawn Chain\"!*", "diagram_id": "DGM-109-03", "diagram_url": "assets/DGM-109-03.svg", "position_id": "POS-PAWN-MOVEMENT-003", "position_version": 1, "position_title": "White pawn chain protects diagonally", "diagram_alt": "White pawn chain protects diagonally"}, {"id": "LES-021-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-109#13#B1", "parent_prompt_trace": "KB-109#13#B1", "text": "- **Capturing Straight:** Because all the other pieces capture the exact same way they move, children will naturally try to capture pieces straight ahead with the pawn.\n- **Moving two squares later in the game:** They might try to use the two-square sprint when the pawn is already in the middle of the board.\n- **Moving backwards:** In a panic, a child might try to retreat a pawn.\n\n> **🧑‍🏫 Coach Tip:**\n> If they try to capture straight ahead, make a wooden \"bonk!\" sound. \"Bonk! The shields hit! The soldier can't attack through his own shield!\""}, {"id": "LES-021-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-109#14#B1", "parent_prompt_trace": "KB-109#14#B1", "text": "You are introducing a massive cognitive leap here: separating *movement* from *capturing*. Spend almost all of your practice time reinforcing the diagonal capture.\n\n> **🧑‍🏫 Coach Tip:**\n> To help them remember the diagonal capture, have them hold their hands up like holding a shield, and poke their elbows out to the side to represent the swords."}, {"id": "LES-021-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-109#15#B1", "parent_prompt_trace": "KB-109#15#B1", "text": "**Q: What happens when the pawn reaches the very end of the board?**\nA: Magic happens! The pawn gets \"promoted\" and turns into a Queen! We will learn all about the rules of Promotion in a later lesson.\n\n**Q: Can a pawn capture backwards diagonally?**\nA: No. Pawns can NEVER do anything backwards. All moves and all captures must be going forward toward the enemy's side of the board."}, {"id": "LES-021-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-109#16#B1", "parent_prompt_trace": "KB-109#16#B1", "text": "**The Pawn Wars Game:**\nTake all the big pieces off the board. Set up just the 8 White pawns on the 2nd rank, and the 8 Black pawns on the 7th rank. Play a mini-game where you only move pawns! Whoever gets one pawn to the other side of the board first wins. This is the absolute best way to teach the two-square sprint, blockades, and diagonal captures."}, {"id": "LES-021-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-109#17#B1", "parent_prompt_trace": "KB-109#17#B1", "text": "**The Trapped Soldier:**\nPlace a White pawn on `d4`. Place Black pawns on `c5`, `d5`, and `e5` (surrounding the front of the White pawn). \nAsk your child: \"Can your brave soldier move straight forward?\" (No, blocked by `d5`).\n\"Can your brave soldier capture?\" (Yes, he can capture either `c5` or `e5` diagonally!). \nLet them choose a capture. This solidifies that being blocked straight ahead does not mean the pawn is useless."}, {"id": "LES-021-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-109#18#B1", "parent_prompt_trace": "KB-109#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which way is the pawn allowed to march? Up the board, or down the board?\n**Answer:** Up the board! Pawns never retreat.\n\n### 🟡 Application (Medium)\n\n**Question:** The White pawn is on its starting square. Can it sprint two squares to h4?\n**Answer:** No! Even though it has the two-square sprint power, it cannot jump or land on the Black Knight. The Knight is blocking the road.\n\n### 🔴 Challenge (Hard)\n\n**Question:** The White pawn is blocked by the Black Rook straight ahead. Which piece is the White pawn allowed to capture?\n**Answer:** The Black Bishop on d5! Pawns capture diagonally.", "diagram_id": "DGM-109-06", "diagram_url": "assets/DGM-109-06.svg", "position_id": "POS-PAWN-MOVEMENT-006", "position_version": 1, "position_title": "Blocked pawn captures the diagonal bishop", "diagram_alt": "Blocked pawn captures the diagonal bishop"}, {"id": "LES-021-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-109#19#B1", "parent_prompt_trace": "KB-109#19#B1", "text": "- **Lichess Practice:** [The Pieces - Pawn](https://lichess.org/learn#/6) (Interactive drills for kids)."}, {"id": "LES-021-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-109#20#B1", "parent_prompt_trace": "KB-109#20#B1", "text": "- **Prerequisites:** TOP-108 Knight Movement, TOP-013 Pawn (Recognition)\n- **Next Steps:** TOP-088 Promotion, TOP-019 Check"}, {"id": "LES-021-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-109#21#B1", "parent_prompt_trace": "KB-109#21#B1", "text": "- [ ] Do I understand the pawn's two-square option on the first move?\n- [ ] Do I understand that pawns move straight, but capture diagonally?\n- [ ] Do I understand that pawns can never move backward?\n- [ ] Did we play the \"Pawn Wars\" mini-game?\n- [ ] Can my child explain why a pawn cannot capture straight ahead?"}]}}</script><script id="task-data" type="application/json">{"schema_version": 1, "lesson_id": "LES-021", "tasks": [{"schema_version": 1, "task_id": "PZL-021-01", "kb_id": "KB-109", "lesson_id": "LES-021", "task_type": "PLACE_PIECE", "source_type": "PCA_CURRICULUM", "prompt": "Move a pawn one square forward.", "hint": "March behind the shield.", "answer": {"kind": "TEXT_RUBRIC", "text": "One unobstructed square straight ahead."}, "difficulty": "FOUNDATION", "source_trace": {"source_path": "curriculum/lessons/LES-021.yaml", "source_sha256": "d527f058d024927926ffb6cdfe5cc1b2766bcb103e6f2cdcfe819f771bf8dd91", "field": "exercises", "anchor": "EX-021-01"}, "validation": {"status": "VALID", "validator_version": 1}}, {"schema_version": 1, "task_id": "PZL-021-02", "kb_id": "KB-109", "lesson_id": "LES-021", "task_type": "PHYSICAL_BOARD_ACTION", "source_type": "PCA_CURRICULUM", "prompt": "Demonstrate when a pawn may move two squares.", "hint": "The sprint is a first-move choice.", "answer": {"kind": "TEXT_RUBRIC", "text": "Only from its starting rank when both squares are clear."}, "difficulty": "FOUNDATION", "source_trace"
