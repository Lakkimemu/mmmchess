<script id="lesson-data" type="application/json">{"lesson_id": "LES-011", "kb_id": "KB-010", "topic_id": "TOP-010", "unit_id": "UNT-001", "sequence": 11, "objective": "**🎯 Today's Goal:**\nYour child can identify the Rook, call it by its proper name (not a Castle!), and place the two Rooks in the corners of the board.", "success_criteria": "**✅ Lesson Success Criteria:**\n- Child can pick the Rook out of a pile of pieces.\n- Child calls the piece a \"Rook\" without prompting.\n- Child can place all 4 Rooks (White and Black) in the four corners of the board.", "source_traces": {"objective": "KB-010#1#B2", "success_criteria": "KB-010#1#B3"}, "prerequisites": [], "readiness_checks": [], "parent_notes": [], "parent_reference": [{"ordinal": 1, "section_id": "AT_A_GLANCE", "heading": "1. At a Glance", "source_trace": "KB-010#1", "content": "- **Topic**: Rook (Recognition)\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 10 min\n- **Piece/concept type**: Piece\n- **Prerequisites**: Files (TOP-003), Ranks (TOP-004), Chess Pieces (TOP-007)\n\n**🎯 Today's Goal:**\nYour child can identify the Rook, call it by its proper name (not a Castle!), and place the two Rooks in the corners of the board.\n\n**✅ Lesson Success Criteria:**\n- Child can pick the Rook out of a pile of pieces.\n- Child calls the piece a \"Rook\" without prompting.\n- Child can place all 4 Rooks (White and Black) in the four corners of the board.\n\n*(Purpose: \"Can I teach this today?\" Yes. This is one of the easiest pieces to recognize and set up!)*\n\n---"}, {"ordinal": 2, "section_id": "DEFINITION", "heading": "2. Definition", "source_trace": "KB-010#2", "content": "The Rook is a major piece that looks like a castle tower. Each player starts with two Rooks. They are placed on the outside corners of the board (a1, h1 for White; a8, h8 for Black). The Rook is a very powerful piece, second only to the Queen.\n\n---"}, {"ordinal": 3, "section_id": "WHY_IT_MATTERS", "heading": "3. Why It Matters", "source_trace": "KB-010#3", "content": "Because the Rooks start in the corners, they are the \"anchors\" of the chess board setup. Teaching a child to set up the board always begins by putting the Rooks in the corners to build the walls of the army.\n\n---"}, {"ordinal": 4, "section_id": "BEFORE_YOU_TEACH", "heading": "4. Before You Teach (Graph)", "source_trace": "KB-010#4", "content": "**Prerequisites:**\n- ✓ Files (TOP-003)\n- ✓ Ranks (TOP-004)\n- ✓ Chess Pieces (TOP-007)\n\n**What this unlocks:**\n- ✓ Rook Movement (TOP-106)\n- ✓ Piece Values (TOP-014)\n\n---"}, {"ordinal": 5, "section_id": "PARENT_UNDERSTANDS", "heading": "5. Parent Understands", "source_trace": "KB-010#5", "content": "*This section is for YOUR understanding. Read it, absorb it.*\n\n**Appearance:** The Rook looks like a castle tower with battlements (the square notches) on top. It is thick and sturdy.\n**Name:** Its real name is the ROOK. Beginners often call it a Castle. You must gently correct this every time. \n**Starting Position:** The Rooks go in the absolute corners of the board. a1 and h1 for White. a8 and h8 for Black.\n\n**What NOT to teach today:** Do NOT teach how the Rook moves (straight lines). Do not teach \"Castling.\" We are only focusing on its name and where it starts.\n\n---"}, {"ordinal": 6, "section_id": "HOW_TO_TEACH_IT", "heading": "6. How to Teach It", "source_trace": "KB-010#6", "content": "*Now that you understand the concept, here is exactly how to explain it to your child.*\n\n### Step 1 — Meet the Rook (2 mins)\nHold up the Rook.\n> *\"Look at this piece! It looks like a strong castle tower. But in chess, it has a special superhero name. It is called a ROOK. Can you say Rook?\"*\n\n### Step 2 — The Flat Top (2 mins)\n> *\"Feel the top of the Rook. It is flat with little square bumps. That's where the archers would stand to protect the King! If a piece has a flat top, it's the Rook.\"*\n\n### Step 3 — The Corners (3 mins)\nGive your child the two White Rooks.\n> *\"The Rooks are the big, heavy walls that protect the whole army. So where do walls go? In the corners! Put one Rook in this corner, and the other Rook in the far corner.\"*\n\n---"}, {"ordinal": 7, "section_id": "STORY_ANALOGY_MEMORY", "heading": "7. Teaching Story / Analogy / Memory Hint", "source_trace": "KB-010#7", "content": "> **🏰 The Castle Towers Analogy**\n> \n> The chess army is like a giant fort. To protect the King and Queen in the middle, they build two giant, heavy Castle Towers right on the edges of the kingdom. The towers are thick and strong, and they always stay in the corners to hold up the walls of the army.\n>\n> **Memory Trick for Starting Position:**\n> **\"Rooks in the corners!\"**\n\n---"}, {"ordinal": 8, "section_id": "DID_YOU_KNOW", "heading": "8. Did You Know? 🎓", "source_trace": "KB-010#8", "content": "The word \"Rook\" actually comes from the ancient Persian word *Rukh*, which meant \"Chariot\"! A long time ago, this piece was a horse-drawn chariot that would crash through the enemy lines. When chess came to Europe, people thought it looked like Italian siege towers, so the design changed into a castle, but the old name stuck!\n\n---"}, {"ordinal": 9, "section_id": "BOARD_DIAGRAM_1", "heading": "9. Board Diagram 1", "source_trace": "KB-010#9", "content": "**Recognizing the Rook**\n\n![DGM-001 Rook Shape](../../assets/diagrams/TOP-010/DGM-001_Rook_Shape.svg)\n*The Rook looks like a tower with a flat, notched top.*\n\n---"}, {"ordinal": 10, "section_id": "HOW_IT_WORKS", "heading": "10. How It Works", "source_trace": "KB-010#10", "content": "Setting up the Rooks is incredibly simple. They take the four extreme corners of the board: `a1`, `h1`, `a8`, and `h8`. \n\n---"}, {"ordinal": 11, "section_id": "BOARD_DIAGRAM_2", "heading": "11. Board Diagram 2", "source_trace": "KB-010#11", "content": "**Rooks in the Corners**\n\n![DGM-002 Rook Start](../../assets/diagrams/TOP-010/DGM-002_Rook_Start.svg)\n*White Rooks on a1 and h1. Black Rooks on a8 and h8.*\n\n---"}, {"ordinal": 12, "section_id": "REAL_GAME_EXAMPLE", "heading": "12. Real Game Example", "source_trace": "KB-010#12", "content": "![DGM-003 Rooks in Game](../../assets/diagrams/TOP-010/DGM-003_Rook_Blocked.svg)\nIn this game, the Rooks have moved out of the corners, but they are easy to spot because of their flat, solid shape.\n\n---"}, {"ordinal": 13, "section_id": "COMMON_MISTAKES", "heading": "13. Common Mistakes", "source_trace": "KB-010#13", "content": "### Chess Mistakes\n- ❌ **Calling it a Castle** — This is the #1 mistake. If they play in a real tournament and write down \"C\" for Castle, they will get confused because \"C\" isn't a piece letter. It is \"R\" for Rook.\n\n### Teaching Mistakes\n- ❌ **Teaching Castling early** — Because the piece looks like a castle, parents often immediately try to teach the special \"Castling\" move where the King and Rook jump over each other. Do NOT do this. It is one of the most advanced rules in chess.\n\n---"}, {"ordinal": 14, "section_id": "TEACHING_NOTES", "heading": "14. Teaching Notes", "source_trace": "KB-010#14", "content": "- **Correct gently:** Every time they say \"Castle\", smile and say, \"It looks like a castle, but what's its special chess name? Rooooook.\"\n\n> **🧑‍🏫 Coach Tip:**\n> When building the habit of setting up the board, always teach them to put the Rooks down *first*. Placing the corner pieces creates a physical boundary that makes setting up the rest of the pieces much easier for small hands.\n\n---"}, {"ordinal": 15, "section_id": "PARENT_FAQ", "heading": "15. Parent FAQ", "source_trace": "KB-010#15", "content": "**Q: Why do they have two Rooks but only one King?**\nA: Because you need two towers to protect the edges of the kingdom (one on the left, one on the right). \n\n**Q: Is the Rook stronger than the Knight?**\nA: Yes! The Rook is very heavy and powerful. We will learn about points later, but the Rook is worth more than the Knight or Bishop.\n\n---"}, {"ordinal": 16, "section_id": "PRACTICE_TOGETHER", "heading": "16. Practice Together", "source_trace": "KB-010#16", "content": "### 🧱 Build the Walls\nClear the board. Give your child all 4 Rooks (White and Black). Say, \"Quick! Build the 4 corners of the kingdom!\" See how fast they can place them on a1, h1, a8, and h8.\n\n### 🗣️ The Name Game\nHold a King in one hand and a Rook in the other behind your back. Bring one out quickly. If they yell \"King!\" they get a point. If they yell \"Rook!\" they get a point. If they yell \"Castle!\", you get a point!\n\n---"}, {"ordinal": 17, "section_id": "COACH_CHALLENGE", "heading": "17. Coach Challenge ⭐", "source_trace": "KB-010#17", "content": "### 🏆 Corner Coordinates\n**Challenge your child:**\n> \"The Rooks live in the corners, but do you remember the secret code names for those corners?\"\n\n**Rules:**\n1. Point to the bottom-left corner (a1). Ask: \"What is this square's name?\"\n2. Do this for all 4 corners (a1, h1, a8, h8). \n3. This combines Rook setup with their previous Coordinate training!\n\n---"}, {"ordinal": 18, "section_id": "TRY_IT_YOURSELF", "heading": "18. Try It Yourself", "source_trace": "KB-010#18", "content": "### 🟢 Recognition (Easy)\nWhat is the proper chess name for the piece that looks like a castle tower?\n*Answer: The Rook.*\n\n### 🟡 Application (Medium)\nHow many Rooks are on the board at the very beginning of the game in total?\n*Answer: 4! (Two White Rooks, Two Black Rooks).*\n\n### 🔴 Challenge (Hard)\n![DGM-004 Puzzle](../../assets/diagrams/TOP-010/DGM-004_Puzzle.svg)\nLook at this setup. Are the Rooks in the correct starting squares?\n*Answer: No! The White Rooks are on the b and g files. They need to be pushed all the way out to the a and h files (the true corners).*\n\n---"}, {"ordinal": 19, "section_id": "CONTINUE_LEARNING", "heading": "19. Continue Learning", "source_trace": "KB-010#19", "content": "*(No specific external resources required for this micro-concept.)*\n\n---"}, {"ordinal": 20, "section_id": "RELATED_TOPICS", "heading": "20. Related Topics", "source_trace": "KB-010#20", "content": "### Prerequisites\n- **Files** (TOP-003)\n- **Ranks** (TOP-004)\n- **Chess Pieces** (TOP-007)\n\n### Next Topics\n- **Rook Movement** (TOP-106) — How the Rook actually moves.\n- **Bishop** (TOP-011) — Meeting the Wise Wizard.\n\n---"}, {"ordinal": 21, "section_id": "PARENT_CONFIDENCE_CHECK", "heading": "21. Parent Confidence Check ✅", "source_trace": "KB-010#21", "content": "- [ ] Do I call it a Rook instead of a Castle?\n- [ ] Did my child practice calling it a Rook?\n- [ ] Did my child successfully place all 4 Rooks in the corners?\n- [ ] Did I successfully avoid teaching Castling or movement?\n\n**✅ If most answers are \"Yes\":** Congratulations — move on to the **Bishop (TOP-011)**.\n**🔄 If several answers are \"No\":** Play the \"Name Game\" again to reinforce the word \"Rook.\"\n\n---\n\n\n**Explicitly NOT covered in this lesson:**\n- How the Rook moves (straight lines).\n- How the Rook captures.\n- The Castling rule.\n- Piece values.\n*(These will be taught in later lessons to prevent cognitive overload).*\n\n---\n\n```yaml\nkb_quality:\n  reviewed: false\n  diagrams: 4\n  mini_puzzles: 3\n  external_resources: 0\n  coach_challenges: 1\n  practice_activities: 2\n  coach_tips: 1\n  parent_faq: 2\n  estimated_read_time: 10 min\n```"}], "slides": [{"id": "LES-011-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-010#1#B1", "parent_prompt_trace": "KB-010#1#B1", "text": "- **Topic**: Rook (Recognition)\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 10 min\n- **Piece/concept type**: Piece\n- **Prerequisites**: Files (TOP-003), Ranks (TOP-004), Chess Pieces (TOP-007)\n\n**🎯 Today's Goal:**\nYour child can identify the Rook, call it by its proper name (not a Castle!), and place the two Rooks in the corners of the board.\n\n**✅ Le am_alt": "Starting squares for the Rooks"}, {"id": "LES-011-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-010#12#B1", "parent_prompt_trace": "KB-010#12#B1", "text": "In this game, the Rooks have moved out of the corners, but they are easy to spot because of their flat, solid shape.", "diagram_id": "DGM-010-03", "diagram_url": "assets/DGM-010-03.svg", "position_id": "POS-ROOK-MIDGAME-001", "position_version": 1, "position_title": "Find the Rooks in a midgame", "diagram_alt": "Find the Rooks in a midgame"}, {"id": "LES-011-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-010#13#B1", "parent_prompt_trace": "KB-010#13#B1", "text": "### Chess Mistakes\n- ❌ **Calling it a Castle** — This is the #1 mistake. If they play in a real tournament and write down \"C\" for Castle, they will get confused because \"C\" isn't a piece letter. It is \"R\" for Rook.\n\n### Teaching Mistakes\n- ❌ **Teaching Castling early** — Because the piece looks like a castle, parents often immediately try to teach the special \"Castling\" move where the King and Rook jump over each other. Do NOT do this. It is one of the most advanced rules in chess."}, {"id": "LES-011-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-010#14#B1", "parent_prompt_trace": "KB-010#14#B1", "text": "- **Correct gently:** Every time they say \"Castle\", smile and say, \"It looks like a castle, but what's its special chess name? Rooooook.\"\n\n> **🧑‍🏫 Coach Tip:**\n> When building the habit of setting up the board, always teach them to put the Rooks down *first*. Placing the corner pieces creates a physical boundary that makes setting up the rest of the pieces much easier for small hands."}, {"id": "LES-011-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-010#15#B1", "parent_prompt_trace": "KB-010#15#B1", "text": "**Q: Why do they have two Rooks but only one King?**\nA: Because you need two towers to protect the edges of the kingdom (one on the left, one on the right).\n\n**Q: Is the Rook stronger than the Knight?**\nA: Yes! The Rook is very heavy and powerful. We will learn about points later, but the Rook is worth more than the Knight or Bishop."}, {"id": "LES-011-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-010#16#B1", "parent_prompt_trace": "KB-010#16#B1", "text": "### 🧱 Build the Walls\nClear the board. Give your child all 4 Rooks (White and Black). Say, \"Quick! Build the 4 corners of the kingdom!\" See how fast they can place them on a1, h1, a8, and h8.\n\n### 🗣️ The Name Game\nHold a King in one hand and a Rook in the other behind your back. Bring one out quickly. If they yell \"King!\" they get a point. If they yell \"Rook!\" they get a point. If they yell \"Castle!\", you get a point!"}, {"id": "LES-011-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-010#17#B1", "parent_prompt_trace": "KB-010#17#B1", "text": "### 🏆 Corner Coordinates\n**Challenge your child:**\n> \"The Rooks live in the corners, but do you remember the secret code names for those corners?\"\n\n**Rules:**\n1. Point to the bottom-left corner (a1). Ask: \"What is this square's name?\"\n2. Do this for all 4 corners (a1, h1, a8, h8). \n3. This combines Rook setup with their previous Coordinate training!"}, {"id": "LES-011-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-010#18#B1", "parent_prompt_trace": "KB-010#18#B1", "text": "### 🟢 Recognition (Easy)\nWhat is the proper chess name for the piece that looks like a castle tower?\n*Answer: The Rook.*\n\n### 🟡 Application (Medium)\nHow many Rooks are on the board at the very beginning of the game in total?\n*Answer: 4! (Two White Rooks, Two Black Rooks).*\n\n### 🔴 Challenge (Hard)\n\nLook at this setup. Are the Rooks in the correct starting squares?\n*Answer: No! The White Rooks are on the b and g files. They need to be pushed all the way out to the a and h files (the true corners).*", "diagram_id": "DGM-010-04", "diagram_url": "assets/DGM-010-04.svg", "position_id": "POS-ROOK-PUZZLE-001", "position_version": 1, "position_title": "Incorrect starting squares for Rooks", "diagram_alt": "Incorrect starting squares for Rooks"}, {"id": "LES-011-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-010#19#B1", "parent_prompt_trace": "KB-010#19#B1", "text": "*(No specific external resources required for this micro-concept.)*"}, {"id": "LES-011-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-010#20#B1", "parent_prompt_trace": "KB-010#20#B1", "text": "### Prerequisites\n- **Files** (TOP-003)\n- **Ranks** (TOP-004)\n- **Chess Pieces** (TOP-007)\n\n### Next Topics\n- **Rook Movement** (TOP-106) — How the Rook actually moves.\n- **Bishop** (TOP-011) — Meeting the Wise Wizard."}, {"id": "LES-011-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-010#21#B1", "parent_prompt_trace": "KB-010#21#B1", "text": "- [ ] Do I call it a Rook instead of a Castle?\n- [ ] Did my child practice calling it a Rook?\n- [ ] Did my child successfully place all 4 Rooks in the corners?\n- [ ] Did I successfully avoid teaching Castling or movement?\n\n**✅ If most answers are \"Yes\":** Congratulations — move on to the **Bishop (TOP-011)**.\n**🔄 If several answers are \"No\":** Play the \"Name Game\" again to reinforce the word \"Rook.\"\n\n**Explicitly NOT covered in this lesson:**\n- How the Rook moves (straight lines).\n- How the Rook captures.\n- The Castling rule.\n- Piece values.\n*(These will be taught in later lessons to prevent cognitive overload).*"}], "task_references": ["PZL-011-01", "PZL-011-02", "PZL-011-03", "PZL-011-04"], "diagram_references": ["DGM-010-01", "DGM-010-02", "DGM-010-03", "DGM-010-04"], "diagram_deferrals": [], "assessment_reference": "ASM-011", "deferred_topics": [], "teach_slides": [{"id": "LES-011-S01", "type": "INTRO", "title": "Meet the Rook", "text": "This is the Rook! It looks like a strong castle tower.", "parent_prompt": "Meet the Rook.", "diagram_id": "DGM-010-01", "diagram_url": "assets/DGM-010-01.svg", "visual": {"diagram_id": "DGM-010-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-SHAPE-001", "position_version": 1, "position_title": "The Rook shape and flat top", "diagram_alt": "The Rook shape and flat top"}, {"id": "LES-011-S02", "type": "DIAGRAM", "title": "The Flat Top", "text": "Feel the top of the Rook. It is flat with little square bumps.", "parent_prompt": "Spot the Flat Top.", "diagram_id": "DGM-010-01", "diagram_url": "assets/DGM-010-01.svg", "visual": {"diagram_id": "DGM-010-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-SHAPE-001", "position_version": 1, "position_title": "The Rook shape and flat top", "diagram_alt": "The Rook shape and flat top"}, {"id": "LES-011-S03", "type": "DIAGRAM", "title": "Rooks in the Corners", "text": "The Rooks are the heavy walls. They go in the four corners!", "parent_prompt": "Explain the Corners.", "diagram_id": "DGM-010-02", "diagram_url": "assets/DGM-010-02.svg", "visual": {"diagram_id": "DGM-010-02", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-START-001", "position_version": 1, "position_title": "Starting squares for the Rooks", "diagram_alt": "Starting squares for the Rooks"}, {"id": "LES-011-S04", "type": "DIAGRAM", "title": "Find the Rooks", "text": "Even in a messy game, can you spot the Rooks?", "parent_prompt": "Spot the Rooks.", "diagram_id": "DGM-010-03", "diagram_url": "assets/DGM-010-03.svg", "visual": {"diagram_id": "DGM-010-03", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-MIDGAME-001", "position_version": 1, "position_title": "Find the Rooks in a midgame", "diagram_alt": "Find the Rooks in a midgame"}, {"id": "LES-011-S05", "type": "DIAGRAM", "title": "Fix the Board", "text": "Oh no! The walls are not in the corners!", "parent_prompt": "Find the mistake.", "diagram_id": "DGM-010-04", "diagram_url": "assets/DGM-010-04.svg", "visual": {"diagram_id": "DGM-010-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-PUZZLE-001", "position_version": 1, "position_title": "Incorrect starting squares for Rooks", "diagram_alt": "Incorrect starting squares for Rooks"}, {"id": "LES-011-S06", "type": "ASSESSMENT", "title": "Check your progress", "text": "Can you name all 4 corner squares where the Rooks start?", "parent_prompt": "Check your progress.", "diagram_id": "DGM-010-04", "diagram_url": "assets/DGM-010-04.svg", "visual": {"diagram_id": "DGM-010-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-PUZZLE-001", "position_version": 1, "position_title": "Incorrect starting squares for Rooks", "diagram_alt": "Incorrect starting squares for Rooks"}], "guide_sections": [{"id": "LES-011-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-010#1#B1", "parent_prompt_trace": "KB-010#1#B1", "text": "- **Topic**: Rook (Recognition)\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 10 min\n- **Piece/concept type**: Piece\n- **Prerequisites**: Files (TOP-003), Ranks (TOP-004), Chess Pieces (TOP-007)\n\n**🎯 Today's Goal:**\nYour child can identify the Rook, call it by its proper name (not a Castle!), and place the two Rooks in the corners of the board.\n\n**✅ Lesson Success Criteria:**\n- Child can pick the Rook out of a pile of pieces.\n- Child calls the piece a \"Rook\" without prompting.\n- Child can place all 4 Rooks (White and Black) in the four corners of the board.\n\n*(Purpose: \"Can I teach this today?\" Yes. This is one of the easiest pieces to recognize and set up!)*"}, {"id": "LES-011-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-010#2#B1", "parent_prompt_trace": "KB-010#2#B1", "text": "The Rook is a major piece that looks like a castle tower. Each player starts with two Rooks. They are placed on the outside corners of the board (a1, h1 for White; a8, h8 for Black). The Rook is a very powerful piece, second only to the Queen."}, {"id": "LES-011-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-010#3#B1", "parent_prompt_trace": "KB-010#3#B1", "text": "Because the Rooks start in the corners, they are the \"anchors\" of the chess board setup. Teaching a child to set up the board always begins by putting the Rooks in the corners to build the walls of the army."}, {"id": "LES-011-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-010#4#B1", "parent_prompt_trace": "KB-010#4#B1", "text": "**Prerequisites:**\n- ✓ Files (TOP-003)\n- ✓ Ranks (TOP-004)\n- ✓ Chess Pieces (TOP-007)\n\n**What this unlocks:**\n- ✓ Rook Movement (TOP-106)\n- ✓ Piece Values (TOP-014)"}, {"id": "LES-011-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-010#5#B1", "parent_prompt_trace": "KB-010#5#B1", "text": "*This section is for YOUR understanding. Read it, absorb it.*\n\n**Appearance:** The Rook looks like a castle tower with battlements (the square notches) on top. It is thick and sturdy.\n**Name:** Its real name is the ROOK. Beginners often call it a Castle. You must gently correct this every time. \n**Starting Position:** The Rooks go in the absolute corners of the board. a1 and h1 for White. a8 and h8 for Black.\n\n**What NOT to teach today:** Do NOT teach how the Rook moves (straight lines). Do not teach \"Castling.\" We are only focusing on its name and where it starts."}, {"id": "LES-011-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-010#6#B1", "parent_prompt_trace": "KB-010#6#B1", "text": "*Now that you understand the concept, here is exactly how to explain it to your child.*\n\n### Step 1 — Meet the Rook (2 mins)\nHold up the Rook.\n> *\"Look at this piece! It looks like a strong castle tower. But in chess, it has a special superhero name. It is called a ROOK. Can you say Rook?\"*\n\n### Step 2 — The Flat Top (2 mins)\n> *\"Feel the top of the Rook. It is flat with little square bumps. That's where the archers would stand to protect the King! If a piece has a flat top, it's the Rook.\"*\n\n### Step 3 — The Corners (3 mins)\nGive your child the two White Rooks.\n> *\"The Rooks are the big, heavy walls that protect the whole army. So where do walls go? In the corners! Put one Rook in this corner, and the other Rook in the far corner.\"*"}, {"id": "LES-011-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-010#7#B1", "parent_prompt_trace": "KB-010#7#B1", "text": "> **🏰 The Castle Towers Analogy**\n> \n> The chess army is like a giant fort. To protect the King and Queen in the middle, they build two giant, heavy Castle Towers right on the edges of the kingdom. The towers are thick and strong, and they always stay in the corners to hold up the walls of the army.\n>\n> **Memory Trick for Starting Position:**\n> **\"Rooks in the corners!\"**"}, {"id": "LES-011-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-010#8#B1", "parent_prompt_trace": "KB-010#8#B1", "text": "The word \"Rook\" actually comes from the ancient Persian word *Rukh*, which meant \"Chariot\"! A long time ago, this piece was a horse-drawn chariot that would crash through the enemy lines. When chess came to Europe, people thought it looked like Italian siege towers, so the design changed into a castle, but the old name stuck!"}, {"id": "LES-011-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1", "source_trace": "KB-010#9#B1", "parent_prompt_trace": "KB-010#9#B1", "text": "**Recognizing the Rook**\n\n*The Rook looks like a tower with a flat, notched top.*", "diagram_id": "DGM-010-01", "diagram_url": "assets/DGM-010-01.svg", "position_id": "POS-ROOK-SHAPE-001", "position_version": 1, "position_title": "The Rook shape and flat top", "diagram_alt": "The Rook shape and flat top"}, {"id": "LES-011-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-010#10#B1", "parent_prompt_trace": "KB-010#10#B1", "text": "Setting up the Rooks is incredibly simple. They take the four extreme corners of the board: `a1`, `h1`, `a8`, and `h8`."}, {"id": "LES-011-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2", "source_trace": "KB-010#11#B1", "parent_prompt_trace": "KB-010#11#B1", "text": "**Rooks in the Corners**\n\n*White Rooks on a1 and h1. Black Rooks on a8 and h8.*", "diagram_id": "DGM-010-02", "diagram_url": "assets/DGM-010-02.svg", "position_id": "POS-ROOK-START-001", "position_version": 1, "position_title": "Starting squares for the Rooks", "diagram_alt": "Starting squares for the Rooks"}, {"id": "LES-011-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-010#12#B1", "parent_prompt_trace": "KB-010#12#B1", "text": "In this game, the Rooks have moved out of the corners, but they are easy to spot because of their flat, solid shape.", "diagram_id": "DGM-010-03", "diagram_url": "assets/DGM-010-03.svg", "position_id": "POS-ROOK-MIDGAME-001", "position_version": 1, "position_title": "Find the Rooks in a midgame", "diagram_alt": "Find the Rooks in a midgame"}, {"id": "LES-011-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-010#13#B1", "parent_prompt_trace": "KB-010#13#B1", "text": "### Chess Mistakes\n- ❌ **Calling it a Castle** — This is the #1 mistake. If they play in a real tournament and write down \"C\" for Castle, they will get confused because \"C\" isn't a piece letter. It is \"R\" for Rook.\n\n### Teaching Mistakes\n- ❌ **Teaching Castling early** — Because the piece looks like a castle, parents often immediately try to teach the special \"Castling\" move where the King and Rook jump over each other. Do NOT do this. It is one of the most advanced rules in chess."}, {"id": "LES-011-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-010#14#B1", "parent_prompt_trace": "KB-010#14#B1", "text": "- **Correct gently:** Every time they say \"Castle\", smile and say, \"It looks like a castle, but what's its special chess name? Rooooook.\"\n\n> **🧑‍🏫 Coach Tip:**\n> When building the habit of setting up the board, always teach them to put the Rooks down *first*. Placing the corner pieces creates a physical boundary that makes setting up the rest of the pieces much easier for small hands."}, {"id": "LES-011-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-010#15#B1", "parent_prompt_trace": "KB-010#15#B1", "text": "**Q: Why do they have two Rooks but only one King?**\nA: Because you need two towers to protect the edges of the kingdom (one on the left, one on the right).\n\n**Q: Is the Rook stronger than the Knight?**\nA: Yes! The Rook is very heavy and powerful. We will learn about points later, but the Rook is worth more than the Knight or Bishop."}, {"id": "LES-011-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-010#16#B1", "parent_prompt_trace": "KB-010#16#B1", "text": "### 🧱 Build the Walls\nClear the board. Give your child all 4 Rooks (White and Black). Say, \"Quick! Build the 4 corners of the kingdom!\" See how fast they can place them on a1, h1, a8, and h8.\n\n### 🗣️ The Name Game\nHold a King in one hand and a Rook in the other behind your back. Bring one out quickly. If they yell \"King!\" they get a point. If they yell \"Rook!\" they get a point. If they yell \"Castle!\", you get a point!"}, {"id": "LES-011-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-010#17#B1", "parent_prompt_trace": "KB-010#17#B1", "text": "### 🏆 Corner Coordinates\n**Challenge your child:**\n> \"The Rooks live in the corners, but do you remember the secret code names for those corners?\"\n\n**Rules:**\n1. Point to the bottom-left corner (a1). Ask: \"What is this square's name?\"\n2. Do this for all 4 corners (a1, h1, a8, h8). \n3. This combines Rook setup with their previous Coordinate training!"}, {"id": "LES-011-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-010#18#B1", "parent_prompt_trace": "KB-010#18#B1", "text": "### 🟢 Recognition (Easy)\nWhat is the proper chess name for the piece that looks like a castle tower?\n*Answer: The Rook.*\n\n### 🟡 Application (Medium)\nHow many Rooks are on the board at the very beginning of the game in total?\n*Answer: 4! (Two White Rooks, Two Black Rooks).*\n\n### 🔴 Challenge (Hard)\n\nLook at this setup. Are the Rooks in the correct starting squares?\n*Answer: No! The White Rooks are on the b and g files. They need to be pushed all the way out to the a and h files (the true corners).*", "diagram_id": "DGM-010-04", "diagram_url": "assets/DGM-010-04.svg", "position_id": "POS-ROOK-PUZZLE-001", "position_version": 1, "position_title": "Incorrect starting squares for Rooks", "diagram_alt": "Incorrect starting squares for Rooks"}, {"id": "LES-011-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-010#19#B1", "parent_prompt_trace": "KB-010#19#B1", "text": "*(No specific external resources required for this micro-concept.)*"}, {"id": "LES-011-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-010#20#B1", "parent_prompt_trace": "KB-010#20#B1", "text": "### Prerequisites\n- **Files** (TOP-003)\n- **Ranks** (TOP-004)\n- **Chess Pieces** (TOP-007)\n\n### Next Topics\n- **Rook Movement** (TOP-106) — How the Rook actually moves.\n- **Bishop** (TOP-011) — Meeting the Wise Wizard."}, {"id": "LES-011-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-010#21#B1", "parent_prompt_trace": "KB-010#21#B1", "text": "- [ ] Do I call it a Rook instead of a Castle?\n- [ ] Did my child practice calling it a Rook?\n- [ ] Did my child successfully place all 4 Rooks in the corners?\n- [ ] Did I successfully avoid teaching Castling or movement?\n\n**✅ If most answers are \"Yes\":** Congratulations — move on to the **Bishop (TOP-011)**.\n**🔄 If several answers are \"No\":** Play the \"Name Game\" again to reinforce the word \"Rook.\"\n\n**Explicitly NOT covered in this lesson:**\n- How the Rook moves (straight lines).\n- How the Rook captures.\n- The Castling rule.\n- Piece values.\n*(These will be taught in later lessons to prevent cognitive overload).*"}], "title": "Rook", "duration_minutes": 10, "memory_phrase": "Rooks in the corners!", "teach": {"title": "Core Lesson", "estimated_minutes": 10, "slides": [{"id": "LES-011-S01", "type": "INTRO", "title": "Meet the Rook", "text": "This is the Rook! It looks like a strong castle tower.", "parent_prompt": "Meet the Rook.", "diagram_id": "DGM-010-01", "diagram_url": "assets/DGM-010-01.svg", "visual": {"diagram_id": "DGM-010-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-SHAPE-001", "position_version": 1, "position_title": "The Rook shape and flat top", "diagram_alt": "The Rook shape and flat top"}, {"id": "LES-011-S02", "type": "DIAGRAM", "title": "The Flat Top", "text": "Feel the top of the Rook. It is flat with little square bumps.", "parent_prompt": "Spot the Flat Top.", "diagram_id": "DGM-010-01", "diagram_url": "assets/DGM-010-01.svg", "visual": {"diagram_id": "DGM-010-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-SHAPE-001", "position_version": 1, "position_title": "The Rook shape and flat top", "diagram_alt": "The Rook shape and flat top"}, {"id": "LES-011-S03", "type": "DIAGRAM", "title": "Rooks in the Corners", "text": "The Rooks are the heavy walls. They go in the four corners!", "parent_prompt": "Explain the Corners.", "diagram_id": "DGM-010-02", "diagram_url": "assets/DGM-010-02.svg", "visual": {"diagram_id": "DGM-010-02", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-START-001", "position_version": 1, "position_title": "Starting squares for the Rooks", "diagram_alt": "Starting squares for the Rooks"}, {"id": "LES-011-S04", "type": "DIAGRAM", "title": "Find the Rooks", "text": "Even in a messy game, can you spot the Rooks?", "parent_prompt": "Spot the Rooks.", "diagram_id": "DGM-010-03", "diagram_url": "assets/DGM-010-03.svg", "visual": {"diagram_id": "DGM-010-03", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-MIDGAME-001", "position_version": 1, "position_title": "Find the Rooks in a midgame", "diagram_alt": "Find the Rooks in a midgame"}, {"id": "LES-011-S05", "type": "DIAGRAM", "title": "Fix the Board", "text": "Oh no! The walls are not in the corners!", "parent_prompt": "Find the mistake.", "diagram_id": "DGM-010-04", "diagram_url": "assets/DGM-010-04.svg", "visual": {"diagram_id": "DGM-010-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-PUZZLE-001", "position_version": 1, "position_title": "Incorrect starting squares for Rooks", "diagram_alt": "Incorrect starting squares for Rooks"}, {"id": "LES-011-S06", "type": "ASSESSMENT", "title": "Check your progress", "text": "Can you name all 4 corner squares where the Rooks start?", "parent_prompt": "Check your progress.", "diagram_id": "DGM-010-04", "diagram_url": "assets/DGM-010-04.svg", "visual": {"diagram_id": "DGM-010-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-ROOK-PUZZLE-001", "position_version": 1, "position_title": "Incorrect starting squares for Rooks", "diagram_alt": "Incorrect starting squares for Rooks"}]}, "continue_teaching": {"title": "Continue Teaching", "estimated_minutes": 0, "groups": []}, "full_guide": {"title": "Parent Full Guide", "sections": [{"id": "LES-011-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-010#1#B1", "parent_prompt_trace": "KB-010#1#B1", "text": "- **Topic**: Rook (Recognition)\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 10 min\n- **Piece/concept type**: Piece\n- **Prerequisites**: Files (TOP-003), Ranks (TOP-004), Chess Pieces (TOP-007)\n\n**🎯 Today's Goal:**\nYour child can identify the Rook, call it by its proper name (not a Castle!), and place the two Rooks in the corners of the board.\n\n**✅ Lesson Success Criteria:**\n- Child can pick the Rook out of a pile of pieces.\n- Child calls the piece a \"Rook\" without prompting.\n- Child can place all 4 Rooks (White and Black) in the four corners of the board.\n\n*(Purpose: \"Can I teach this today?\" Yes. This is one of the easiest pieces to recognize and set up!)*"}, {"id": "LES-011-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-010#2#B1", "parent_prompt_trace": "KB-010#2#B1", "text": "The Rook is a major piece that looks like a castle tower. Each player starts with two Rooks. They are placed on the outside corners of the board (a1, h1 for White; a8, h8 for Black). The Rook is a very powerful piece, second only to the Queen."}, {"id": "LES-011-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-010#3#B1", "parent_prompt_trace": "KB-010#3#B1", "text": "Because the Rooks start in the corners, they are the \"anchors\" of the chess board setup. Teaching a child to set up the board always begins by putting the Rooks in the corners to build the walls of the army."}, {"id": "LES-011-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-010#4#B1", "parent_prompt_trace": "KB-010#4#B1", "text": "**Prerequisites:**\n- ✓ Files (TOP-003)\n- ✓ Ranks (TOP-004)\n- ✓ Chess Pieces (TOP-007)\n\n**What this unlocks:**\n- ✓ Rook Movement (TOP-106)\n- ✓ Piece Values (TOP-014)"}, {"id": "LES-011-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-010#5#B1", "parent_prompt_trace": "KB-010#5#B1", "text": "*This section is for YOUR understanding. Read it, absorb it.*\n\n**Appearance:** The Rook looks like a castle tower with battlements (the square notches) on top. It is thick and sturdy.\n**Name:** Its real name is the ROOK. Beginners often call it a Castle. You must gently correct this every time. \n**Starting Position:** The Rooks go in the absolute corners of the board. a1 and h1 for White. a8 and h8 for Black.\n\n**What NOT to teach today:** Do NOT teach how the Rook moves (straight lines). Do not teach \"Castling.\" We are only focusing on its name and where it starts."}, {"id": "LES-011-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-010#6#B1", "parent_prompt_trace": "KB-010#6#B1", "text": "*Now that you understand the concept, here is exactly how to explain it to your child.*\n\n### Step 1 — Meet the Rook (2 mins)\nHold up the Rook.\n> *\"Look at this piece! It looks like a strong castle tower. But in chess, it has a special superhero name. It is called a ROOK. Can you say Rook?\"*\n\n### Step 2 — The Flat Top (2 mins)\n> *\"Feel the top of the Rook. It is flat with little square bumps. That's where the archers would stand to protect the King! If a piece has a flat top, it's the Rook.\"*\n\n### Step 3 — The Corners (3 mins)\nGive your child the two White Rooks.\n> *\"The Rooks are the big, heavy walls that protect the whole army. So where do walls go? In the corners! Put one Rook in this corner, and the other Rook in the far corner.\"*"}, {"id": "LES-011-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-010#7#B1", "parent_prompt_trace": "KB-010#7#B1", "text": "> **🏰 The Castle Towers Analogy**\n> \n> The chess army is like a giant fort. To protect the King and Queen in the middle, they build two giant, heavy Castle Towers right on the edges of the kingdom. The towers are thick and strong, and they always stay in the corners to hold up the walls of the army.\n>\n> **Memory Trick for Starting Position:**\n> **\"Rooks in the corners!\"**"}, {"id": "LES-011-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-010#8#B1", "parent_prompt_trace": "KB-010#8#B1", "text": "The word \"Rook\" actually comes from the ancient Persian word *Rukh*, which meant \"Chariot\"! A long time ago, this piece was a horse-drawn chariot that would crash through the enemy lines. When chess came to Europe, people thought it looked like Italian siege towers, so the design changed into a castle, but the old name stuck!"}, {"id": "LES-011-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1", "source_trace": "KB-010#9#B1", "parent_prompt_trace": "KB-010#9#B1", "text": "**Recognizing the Rook**\n\n*The Rook looks like a tower with a flat, notched top.*", "diagram_id": "DGM-010-01", "diagram_url": "assets/DGM-010-01.svg", "position_id": "POS-ROOK-SHAPE-001", "position_version": 1, "position_title": "The Rook shape and flat top", "diagram_alt": "The Rook shape and flat top"}, {"id": "LES-011-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-010#10#B1", "parent_prompt_trace": "KB-010#10#B1", "text": "Setting up the Rooks is incredibly simple. They take the four extreme corners of the board: `a1`, `h1`, `a8`, and `h8`."}, {"id": "LES-011-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2", "source_trace": "KB-010#11#B1", "parent_prompt_trace": "KB-010#11#B1", "text": "**Rooks in the Corners**\n\n*White Rooks on a1 and h1. Black Rooks on a8 and h8.*", "diagram_id": "DGM-010-02", "diagram_url": "assets/DGM-010-02.svg", "position_id": "POS-ROOK-START-001", "position_version": 1, "position_title": "Starting squares for the Rooks", "diagram_alt": "Starting squares for the Rooks"}, {"id": "LES-011-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-010#12#B1", "parent_prompt_trace": "KB-010#12#B1", "text": "In this game, the Rooks have moved out of the corners, but they are easy to spot because of their flat, solid shape.", "diagram_id": "DGM-010-03", "diagram_url": "assets/DGM-010-03.svg", "position_id": "POS-ROOK-MIDGAME-001", "position_version": 1, "position_title": "Find the Rooks in a midgame", "diagram_alt": "Find the Rooks in a midgame"}, {"id": "LES-011-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-010#13#B1", "parent_prompt_trace": "KB-010#13#B1", "text": "### Chess Mistakes\n- ❌ **Calling it a Castle** — This is the #1 mistake. If they play in a real tournament and write down \"C\" for Castle, they will get confused because \"C\" isn't a piece letter. It is \"R\" for Rook.\n\n### Teaching Mistakes\n- ❌ **Teaching Castling early** — Because the piece looks like a castle, parents often immediately try to teach the special \"Castling\" move where the King and Rook jump over each other. Do NOT do this. It is one of the most advanced rules in chess."}, {"id": "LES-011-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-010#14#B1", "parent_prompt_trace": "KB-010#14#B1", "text": "- **Correct gently:** Every time they say \"Castle\", smile and say, \"It looks like a castle, but what's its special chess name? Rooooook.\"\n\n> **🧑‍🏫 Coach Tip:**\n> When building the habit of setting up the board, always teach them to put the Rooks down *first*. Placing the corner pieces creates a physical boundary that makes setting up the rest of the pieces much easier for small hands."}, {"id": "LES-011-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-010#15#B1", "parent_prompt_trace": "KB-010#15#B1", "text": "**Q: Why do they have two Rooks but only one King?**\nA: Because you need two towers to protect the edges of the kingdom (one on the left, one on the right).\n\n**Q: Is the Rook stronger than the Knight?**\nA: Yes! The Rook is very heavy and powerful. We will learn about points later, but the Rook is worth more than the Knight or Bishop."}, {"id": "LES-011-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-010#16#B1", "parent_prompt_trace": "KB-010#16#B1", "text": "### 🧱 Build the Walls\nClear the board. Give your child all 4 Rooks (White and Black). Say, \"Quick! Build the 4 corners of the kingdom!\" See how fast they can place them on a1, h1, a8, and h8.\n\n### 🗣️ The Name Game\nHold a King in one hand and a Rook in the other behind your back. Bring one out quickly. If they yell \"King!\" they get a point. If they yell \"Rook!\" they get a point. If they yell \"Castle!\", you get a point!"}, {"id": "LES-011-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-010#17#B1", "parent_prompt_trace": "KB-010#17#B1", "text": "### 🏆 Corner Coordinates\n**Challenge your child:**\n> \"The Rooks live in the corners, but do you remember the secret code names for those corners?\"\n\n**Rules:**\n1. Point to the bottom-left corner (a1). Ask: \"What is this square's name?\"\n2. Do this for all 4 corners (a1, h1, a8, h8). \n3. This combines Rook setup with their previous Coordinate training!"}, {"id": "LES-011-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-010#18#B1", "parent_prompt_trace": "KB-010#18#B1", "text": "### 🟢 Recognition (Easy)\nWhat is the proper chess name for the piece that looks like a castle tower?\n*Answer: The Rook.*\n\n### 🟡 Application (Medium)\nHow many Rooks are on the board at the very beginning of the game in total?\n*Answer: 4! (Two White Rooks, Two Black Rooks).*\n\n### 🔴 Challenge (Hard)\n\nLook at this setup. Are the Rooks in the correct starting squares?\n*Answer: No! The White Rooks are on the b and g files. They need to be pushed all the way out to the a and h files (the true corners).*", "diagram_id": "DGM-010-04", "diagram_url": "assets/DGM-010-04.svg", "position_id": "POS-ROOK-PUZZLE-001", "position_version": 1, "position_title": "Incorrect starting squares for Rooks", "diagram_alt": "Incorrect starting squares for Rooks"}, {"id": "LES-011-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-010#19#B1", "parent_prompt_trace": "KB-010#19#B1", "text": "*(No specific external resources required for this micro-concept.)*"}, {"id": "LES-011-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-010#20#B1", "parent_prompt_trace": "KB-010#20#B1", "text": "### Prerequisites\n- **Files** (TOP-003)\n- **Ranks** (TOP-004)\n- **Chess Pieces** (TOP-007)\n\n### Next Topics\n- **Rook Movement** (TOP-106) — How the Rook actually moves.\n- **Bishop** (TOP-011) — Meeting the Wise Wizard."}, {"id": "LES-011-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-010#21#B1", "parent_prompt_trace": "KB-010#21#B1", "text": "- [ ] Do I call it a Rook instead of a Castle?\n- [ ] Did my child practice calling it a Rook?\n- [ ] Did my child successfully place all 4 Rooks in the corners?\n- [ ] Did I successfully avoid teaching Castling or movement?\n\n**✅ If most answers are \"Yes\":** Congratulations — move on to the **Bishop (TOP-011)**.\n**🔄 If several answers are \"No\":** Play the \"Name Game\" again to reinforce the word \"Rook.\"\n\n**Explicitly NOT covered in this lesson:**\n- How the Rook moves (straight lines).\n- How the Rook captures.\n- The Castling rule.\n- Piece values.\n*(These will be taught in later lessons to prevent cognitive overload).*"}]}}</script><script id="task-data" type="application/json">{"schema_version": 1, "lesson_id": "LES-011", "tasks": [{"schema_version": 1, "task_id": "PZL-011-01", "kb_id": "KB-010", "lesson_id": "LES-011", "task_type": "PHYSICAL_BOARD_ACTION", "source_type": "PCA_CURRICULUM", "prompt": "What is the special chess name for the piece that looks like a castle?", "hint": "Think of a chariot.", "answer": {"kind": "TEXT_RUBRIC", "text": "Rook."}, "difficulty": "FOUNDATION", "source_trace": {"source_path": "curriculum/lessons/LES-011.yaml", "source_sha256": "c8d0903a8c412b313c364b1b46a154a15ec681d2141c278b82f199872030e39a", "field": "exercises", "anchor": "EX-011-01"}, "validation": {"status": "VALID", "validator_version": 1}}, {"schema_version": 1, "task_id": "PZL-011-02", "kb_id": "KB-010", "lesson_id": "LES-011", "task_type": "PHYSICAL_BOARD_ACTION", "source_type": "PCA_CURRICULUM", "prompt": "Where do the Rooks start on the board?", "hint": "Think about building walls.", "answer": {"kind": "TEXT_RUBRIC", "text": "In the corners."}, "difficulty":
