<script id="lesson-data" type="application/json">{"lesson_id": "LES-020", "kb_id": "KB-108", "topic_id": "TOP-108", "unit_id": "UNT-001", "sequence": 20, "objective": "**🎯 Today's Goal:**\nYour child will be able to jump the Knight in its unique \"L-shape\" pattern and understand that it only captures pieces on its final landing square.", "success_criteria": "**✅ Lesson Success Criteria:**\n- The child successfully moves the Knight in an \"L-shape.\"\n- The child demonstrates that the Knight can jump over pieces.\n- The child understands that jumping *over* an enemy piece does not capture it.", "source_traces": {"objective": "KB-108#1#B2", "success_criteria": "KB-108#1#B3"}, "prerequisites": [], "readiness_checks": [], "parent_notes": [], "parent_reference": [{"ordinal": 1, "section_id": "AT_A_GLANCE", "heading": "1. At a Glance", "source_trace": "KB-108#1", "content": "- **Topic**: Knight Movement\n- **Difficulty**: Intermediate\n- **Typical age**: 6+\n- **Estimated teaching time**: 20 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-107 Bishop Movement, TOP-012 Knight Recognition\n\n**🎯 Today's Goal:**\nYour child will be able to jump the Knight in its unique \"L-shape\" pattern and understand that it only captures pieces on its final landing square.\n\n**✅ Lesson Success Criteria:**\n- The child successfully moves the Knight in an \"L-shape.\"\n- The child demonstrates that the Knight can jump over pieces.\n- The child understands that jumping *over* an enemy piece does not capture it.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"ordinal": 2, "section_id": "DEFINITION", "heading": "2. Definition", "source_trace": "KB-108#2", "content": "The Knight is the only piece in chess that can jump over other pieces! It moves in a very specific pattern: two squares in a straight line (horizontally or vertically) followed by one square to the side. This forms the shape of a capital \"L\". The Knight captures an enemy piece *only* if that piece is sitting on the Knight's final landing square. Pieces that the Knight jumps over are ignored completely."}, {"ordinal": 3, "section_id": "WHY_IT_MATTERS", "heading": "3. Why It Matters", "source_trace": "KB-108#3", "content": "The Knight is usually the hardest piece for beginners to master because its movement isn't a straight line. However, because it can jump over blockades, it is an incredibly tricky and dangerous piece in crowded positions where Rooks and Bishops are stuck."}, {"ordinal": 4, "section_id": "BEFORE_YOU_TEACH", "heading": "4. Before You Teach (Graph)", "source_trace": "KB-108#4", "content": "- **Requires:** TOP-012 (Knight Recognition), TOP-107 (Bishop Movement)\n- **Unlocks:** TOP-109 (Pawn Movement), TOP-027 (Forks)"}, {"ordinal": 5, "section_id": "PARENT_UNDERSTANDS", "heading": "5. Parent Understands", "source_trace": "KB-108#5", "content": "The Knight is unique. Think of its move as a three-step sequence: \"One, Two, Turn.\" \nYou move it two squares straight (up, down, left, or right), and then one square at a 90-degree angle. \nIt does not matter if the squares the Knight passes over are occupied by friendly pieces or enemy pieces—the Knight leaps right over them like a horse jumping a fence. \nThe absolute most important thing to grasp is capturing: If the Knight jumps over an enemy pawn to land on an empty square, that enemy pawn is perfectly safe. The Knight *only* captures what it lands directly on."}, {"ordinal": 6, "section_id": "HOW_TO_TEACH_IT", "heading": "6. How to Teach It", "source_trace": "KB-108#6", "content": "1. **The Chants:** Place a Knight on the board. Say, \"The Knight is a brave horse! It gallops in an L-shape.\" Move the Knight while chanting: \"Gallop, gallop, turn!\" (Two squares straight, one to the side).\n2. **The L-Shape Tracing:** Have your child trace the capital \"L\" on the board with their finger before moving the piece.\n3. **The Jumping Demonstration:** Build a \"wall\" of pawns in a circle around the Knight. Show how the Queen or Rook would be trapped. Then say, \"But the horse can jump the fence!\" Have the Knight jump over the pawns.\n4. **The Safe Jump:** Jump the Knight *over* a Black pawn and land on an empty square. Ask, \"Did I capture the pawn?\" Explain strongly: \"No! The horse just jumped over its head. We only capture what we land on!\"\n5. **The Capture:** Place a Black piece exactly on the Knight's landing square. \"Gallop, gallop, turn... squash!\" Take the enemy piece."}, {"ordinal": 7, "section_id": "STORY_ANALOGY_MEMORY", "heading": "7. Teaching Story / Analogy / Memory Hint", "source_trace": "KB-108#7", "content": "**The Brave Horse:** \nThe Knight is a brave horse jumping fences in a tournament. It runs really fast (one, two!) and then makes a sharp turn (turn!). Because it jumps so high in the air, the people standing on the ground underneath the horse are totally safe. It only squashes the person standing exactly where its hooves land!"}, {"ordinal": 8, "section_id": "DID_YOU_KNOW", "heading": "8. Did You Know? 🎓", "source_trace": "KB-108#8", "content": "The Knight always changes the color of the square it is standing on! If it starts its jump on a light square, it will always land on a dark square. If it starts on dark, it lands on light. This color-flipping is magic!"}, {"ordinal": 9, "section_id": "BOARD_DIAGRAM_1", "heading": "9. Board Diagram 1 — Basic Concept", "source_trace": "KB-108#9", "content": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)\n*The Knight jumps in an L-shape: two squares straight, one square to the side.*"}, {"ordinal": 10, "section_id": "HOW_IT_WORKS", "heading": "10. How It Works", "source_trace": "KB-108#10", "content": "The Knight must complete its full \"L\" shape on every turn. It cannot stop halfway. If its landing square is empty, it lands safely. If its landing square has an enemy piece, it captures it. If its landing square has a friendly piece, the Knight cannot jump there (it cannot squash its friends!)."}, {"ordinal": 11, "section_id": "BOARD_DIAGRAM_2", "heading": "11. Board Diagram 2 — Practical Example", "source_trace": "KB-108#11", "content": "![DGM-108-02: A White Knight completely surrounded by pawns, jumping over them to land outside the wall.](../../assets/diagrams/TOP-108/DGM-108-02.svg)\n*The Knight is the only piece that can jump over walls!*"}, {"ordinal": 12, "section_id": "REAL_GAME_EXAMPLE", "heading": "12. Real Game Example", "source_trace": "KB-108#12", "content": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)\n*Remember: we only capture the piece we land on, not the piece we jump over.*"}, {"ordinal": 13, "section_id": "COMMON_MISTAKES", "heading": "13. Common Mistakes", "source_trace": "KB-108#13", "content": "- **Incorrect Shapes:** Children sometimes move two straight and two to the side, or three straight and one to the side. \n- **Capturing jumped pieces:** Because checkers teaches kids to capture by jumping *over* pieces, children instinctively try to remove the pieces the Knight hops over. \n\n> **🧑‍🏫 Coach Tip:**\n> If your child removes a piece they jumped over, laugh and say, \"Wait! This is chess, not checkers! The horse jumped way over his head. Put him back on the board!\""}, {"ordinal": 14, "section_id": "TEACHING_NOTES", "heading": "14. Teaching Notes", "source_trace": "KB-108#14", "content": "Expect the Knight to take twice as long to learn as the other pieces. Do not get frustrated. The \"Gallop, gallop, turn\" chant is highly effective because it adds rhythm to the physical movement.\n\n> **🧑‍🏫 Coach Tip:**\n> You can also teach the Knight as the \"Magic Circle.\" If a Knight is in the center, its 8 landing squares form a rough circle around it. This helps children visualize where it can reach without plotting every L-shape."}, {"ordinal": 15, "section_id": "PARENT_FAQ", "heading": "15. Parent FAQ", "source_trace": "KB-108#15", "content": "**Q: Can the Knight move sideways first, and then up? (One, two sideways, one up?)**\nA: Yes! The \"L\" can be laying down, standing up, or backward. As long as it is two steps in one direction, and one step sideways, it is a legal Knight move.\n\n**Q: My child keeps making a 2x2 square shape instead of an L.**\nA: Use coins or pawns to physically mark the path on the board. Make them touch each square: \"One, two, turn.\""}, {"ordinal": 16, "section_id": "PRACTICE_TOGETHER", "heading": "16. Practice Together", "source_trace": "KB-108#16", "content": "**The Knight Maze:**\nPlace the White Knight on `a1`. Scatter 6 or 7 Black pieces randomly on the board as \"apples.\" The child must jump the horse around the board, landing on the apples to eat them. See how many turns it takes to eat all the apples. Remember: they have to land exactly on the apple to eat it!"}, {"ordinal": 17, "section_id": "COACH_CHALLENGE", "heading": "17. Coach Challenge ⭐", "source_trace": "KB-108#17", "content": "**The Color Flipper Test:**\nPlace the Knight on `d4` (a dark square). Ask your child to point to a square they want to jump to. Before they move, ask them: \"You are starting on a dark square. What color square will the horse land on?\" (Answer: Light!). Let them jump to verify. Try it again from a light square. This teaches them the advanced concept that Knights always switch colors!"}, {"ordinal": 18, "section_id": "TRY_IT_YOURSELF", "heading": "18. Try It Yourself", "source_trace": "KB-108#18", "content": "### 🟢 Recognition (Easy)\n![DGM-108-04: White Knight on e4. Highlight a legal L-shape jump and an illegal diagonal move.](../../assets/diagrams/TOP-108/DGM-108-04.svg)\n**Question:** Which path is the horse allowed to take? The L-shape, or the straight diagonal line?\n**Answer:** The L-shape! Knights can never slide straight or diagonally.\n\n### 🟡 Application (Medium)\n![DGM-108-05: White Knight on c3. Black Pawn on c4 (in front of Knight). Black Bishop on d5 (landing square).](../../assets/diagrams/TOP-108/DGM-108-05.svg)\n**Question:** Can the White Knight jump over the Black pawn to capture the Black Bishop?\n**Answer:** Yes! The Knight jumps right over the pawn on c4 (ignoring it) and lands on d5 to capture the Bishop!\n\n### 🔴 Challenge (Hard)\n![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)\n**Question:** The Knight can jump to two different squares here. Which piece is it allowed to capture?\n**Answer:** It can capture the Black Rook on g5! It is NOT allowed to jump onto e5 because its own White Pawn is standing there (you cannot squash your friends!)."}, {"ordinal": 19, "section_id": "CONTINUE_LEARNING", "heading": "19. Continue Learning", "source_trace": "KB-108#19", "content": "- **Lichess Practice:** [The Pieces - Knight](https://lichess.org/learn#/5) (Interactive drills for kids)."}, {"ordinal": 20, "section_id": "RELATED_TOPICS", "heading": "20. Related Topics", "source_trace": "KB-108#20", "content": "- **Prerequisites:** TOP-107 Bishop Movement, TOP-012 Knight (Recognition)\n- **Next Steps:** TOP-109 Pawn Movement, TOP-027 Forks"}, {"ordinal": 21, "section_id": "PARENT_CONFIDENCE_CHECK", "heading": "21. Parent Confidence Check ✅", "source_trace": "KB-108#21", "content": "- [ ] Do I understand the \"Two straight, one sideways\" movement?\n- [ ] Do I understand that jumping over a piece does not capture it?\n- [ ] Do I understand the Knight only captures on its landing square?\n- [ ] Did we practice the \"Gallop, gallop, turn\" chant?\n- [ ] Did my child successfully avoid capturing a piece they jumped over?\n\n---\n\n```yaml\nkb_quality:\n  reviewed: true\n  diagrams: 6\n  mini_puzzles: 3\n  external_resources: 1\n  coach_challenges: -03", "diagram_url": "assets/DGM-108-03.svg", "position_id": "POS-KNIGHT-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)", "diagram_alt": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)"}, {"id": "LES-020-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-108#13#B1", "parent_prompt_trace": "KB-108#13#B1", "text": "- **Incorrect Shapes:** Children sometimes move two straight and two to the side, or three straight and one to the side. \n- **Capturing jumped pieces:** Because checkers teaches kids to capture by jumping *over* pieces, children instinctively try to remove the pieces the Knight hops over.\n\n> **🧑‍🏫 Coach Tip:**\n> If your child removes a piece they jumped over, laugh and say, \"Wait! This is chess, not checkers! The horse jumped way over his head. Put him back on the board!\""}, {"id": "LES-020-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-108#14#B1", "parent_prompt_trace": "KB-108#14#B1", "text": "Expect the Knight to take twice as long to learn as the other pieces. Do not get frustrated. The \"Gallop, gallop, turn\" chant is highly effective because it adds rhythm to the physical movement.\n\n> **🧑‍🏫 Coach Tip:**\n> You can also teach the Knight as the \"Magic Circle.\" If a Knight is in the center, its 8 landing squares form a rough circle around it. This helps children visualize where it can reach without plotting every L-shape."}, {"id": "LES-020-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-108#15#B1", "parent_prompt_trace": "KB-108#15#B1", "text": "**Q: Can the Knight move sideways first, and then up? (One, two sideways, one up?)**\nA: Yes! The \"L\" can be laying down, standing up, or backward. As long as it is two steps in one direction, and one step sideways, it is a legal Knight move.\n\n**Q: My child keeps making a 2x2 square shape instead of an L.**\nA: Use coins or pawns to physically mark the path on the board. Make them touch each square: \"One, two, turn.\""}, {"id": "LES-020-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-108#16#B1", "parent_prompt_trace": "KB-108#16#B1", "text": "**The Knight Maze:**\nPlace the White Knight on `a1`. Scatter 6 or 7 Black pieces randomly on the board as \"apples.\" The child must jump the horse around the board, landing on the apples to eat them. See how many turns it takes to eat all the apples. Remember: they have to land exactly on the apple to eat it!"}, {"id": "LES-020-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-108#17#B1", "parent_prompt_trace": "KB-108#17#B1", "text": "**The Color Flipper Test:**\nPlace the Knight on `d4` (a dark square). Ask your child to point to a square they want to jump to. Before they move, ask them: \"You are starting on a dark square. What color square will the horse land on?\" (Answer: Light!). Let them jump to verify. Try it again from a light square. This teaches them the advanced concept that Knights always switch colors!"}, {"id": "LES-020-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-108#18#B1", "parent_prompt_trace": "KB-108#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which path is the horse allowed to take? The L-shape, or the straight diagonal line?\n**Answer:** The L-shape! Knights can never slide straight or diagonally.\n\n### 🟡 Application (Medium)\n\n**Question:** Can the White Knight jump over the Black pawn to capture the Black Bishop?\n**Answer:** Yes! The Knight jumps right over the pawn on c4 (ignoring it) and lands on d5 to capture the Bishop!\n\n### 🔴 Challenge (Hard)\n\n**Question:** The Knight can jump to two different squares here. Which piece is it allowed to capture?\n**Answer:** It can capture the Black Rook on g5! It is NOT allowed to jump onto e5 because its own White Pawn is standing there (you cannot squash your friends!).", "diagram_id": "DGM-108-06", "diagram_url": "assets/DGM-108-06.svg", "position_id": "POS-KNIGHT-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)", "diagram_alt": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)"}, {"id": "LES-020-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-108#19#B1", "parent_prompt_trace": "KB-108#19#B1", "text": "- **Lichess Practice:** [The Pieces - Knight](https://lichess.org/learn#/5) (Interactive drills for kids)."}, {"id": "LES-020-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-108#20#B1", "parent_prompt_trace": "KB-108#20#B1", "text": "- **Prerequisites:** TOP-107 Bishop Movement, TOP-012 Knight (Recognition)\n- **Next Steps:** TOP-109 Pawn Movement, TOP-027 Forks"}, {"id": "LES-020-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-108#21#B1", "parent_prompt_trace": "KB-108#21#B1", "text": "- [ ] Do I understand the \"Two straight, one sideways\" movement?\n- [ ] Do I understand that jumping over a piece does not capture it?\n- [ ] Do I understand the Knight only captures on its landing square?\n- [ ] Did we practice the \"Gallop, gallop, turn\" chant?\n- [ ] Did my child successfully avoid capturing a piece they jumped over?"}], "task_references": ["PZL-020-01", "PZL-020-02", "PZL-020-03", "PZL-020-04"], "diagram_references": ["DGM-108-01", "DGM-108-02", "DGM-108-03", "DGM-108-04", "DGM-108-05", "DGM-108-06"], "diagram_deferrals": [], "assessment_reference": "ASM-020", "deferred_topics": [], "teach_slides": [{"id": "LES-020-S01", "type": "INTRO", "title": "Knight Movement", "text": "The Knight gallops two, turns one, and can jump every wall.", "parent_prompt": "Introduce knight movement.", "diagram_id": "DGM-108-01", "diagram_url": "assets/DGM-108-01.svg", "visual": {"diagram_id": "DGM-108-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)", "diagram_alt": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)"}, {"id": "LES-020-S02", "type": "DIAGRAM", "title": "Basic movement", "text": "Use the board to explore knight movement.", "parent_prompt": "Guide the basic movement.", "diagram_id": "DGM-108-01", "diagram_url": "assets/DGM-108-01.svg", "visual": {"diagram_id": "DGM-108-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)", "diagram_alt": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)"}, {"id": "LES-020-S03", "type": "DIAGRAM", "title": "Capture", "text": "Use the board to explore knight movement.", "parent_prompt": "Guide the capture.", "diagram_id": "DGM-108-02", "diagram_url": "assets/DGM-108-02.svg", "visual": {"diagram_id": "DGM-108-02", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-108-02: A White Knight completely surrounded by pawns, jumping over them to land outside the wall.](../../assets/diagrams/TOP-108/DGM-108-02.svg)", "diagram_alt": "![DGM-108-02: A White Knight completely surrounded by pawns, jumping over them to land outside the wall.](../../assets/diagrams/TOP-108/DGM-108-02.svg)"}, {"id": "LES-020-S04", "type": "DIAGRAM", "title": "Real-game pattern", "text": "Use the board to explore knight movement.", "parent_prompt": "Guide the real-game pattern.", "diagram_id": "DGM-108-03", "diagram_url": "assets/DGM-108-03.svg", "visual": {"diagram_id": "DGM-108-03", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)", "diagram_alt": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)"}, {"id": "LES-020-S05", "type": "QUESTION", "title": "Recognition check", "text": "Use the board to explore knight movement.", "parent_prompt": "Guide the recognition check.", "diagram_id": "DGM-108-04", "diagram_url": "assets/DGM-108-04.svg", "visual": {"diagram_id": "DGM-108-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-004", "position_version": 1, "position_title": "![DGM-108-04: White Knight on e4. Highlight a legal L-shape jump and an illegal diagonal move.](../../assets/diagrams/TOP-108/DGM-108-04.svg)", "diagram_alt": "![DGM-108-04: White Knight on e4. Highlight a legal L-shape jump and an illegal diagonal move.](../../assets/diagrams/TOP-108/DGM-108-04.svg)"}, {"id": "LES-020-S06", "type": "QUESTION", "title": "Find the landing square", "text": "Decide what the Knight can capture.", "parent_prompt": "Guide the landing-square check.", "diagram_id": "DGM-108-05", "diagram_url": "assets/DGM-108-05.svg", "visual": {"diagram_id": "DGM-108-05", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-005", "position_version": 1, "position_title": "![DGM-108-05: White Knight on c3. Black Pawn on c4 (in front of Knight). Black Bishop on d5 (landing square).](../../assets/diagrams/TOP-108/DGM-108-05.svg)", "diagram_alt": "![DGM-108-05: White Knight on c3. Black Pawn on c4 (in front of Knight). Black Bishop on d5 (landing square).](../../assets/diagrams/TOP-108/DGM-108-05.svg)"}, {"id": "LES-020-S07", "type": "QUESTION", "title": "Choose a legal landing", "text": "Separate blocked and capturable landing squares.", "parent_prompt": "Guide the occupied-square check.", "diagram_id": "DGM-108-06", "diagram_url": "assets/DGM-108-06.svg", "visual": {"diagram_id": "DGM-108-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)", "diagram_alt": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)"}, {"id": "LES-020-S08", "type": "ASSESSMENT", "title": "Check your progress", "text": "Show that you understand knight movement.", "parent_prompt": "Check each success criterion with the board.", "diagram_id": "DGM-108-06", "diagram_url": "assets/DGM-108-06.svg", "visual": {"diagram_id": "DGM-108-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)", "diagram_alt": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)"}], "guide_sections": [{"id": "LES-020-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-108#1#B1", "parent_prompt_trace": "KB-108#1#B1", "text": "- **Topic**: Knight Movement\n- **Difficulty**: Intermediate\n- **Typical age**: 6+\n- **Estimated teaching time**: 20 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-107 Bishop Movement, TOP-012 Knight Recognition\n\n**🎯 Today's Goal:**\nYour child will be able to jump the Knight in its unique \"L-shape\" pattern and understand that it only captures pieces on its final landing square.\n\n**✅ Lesson Success Criteria:**\n- The child successfully moves the Knight in an \"L-shape.\"\n- The child demonstrates that the Knight can jump over pieces.\n- The child understands that jumping *over* an enemy piece does not capture it.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-020-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-108#2#B1", "parent_prompt_trace": "KB-108#2#B1", "text": "The Knight is the only piece in chess that can jump over other pieces! It moves in a very specific pattern: two squares in a straight line (horizontally or vertically) followed by one square to the side. This forms the shape of a capital \"L\". The Knight captures an enemy piece *only* if that piece is sitting on the Knight's final landing square. Pieces that the Knight jumps over are ignored completely."}, {"id": "LES-020-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-108#3#B1", "parent_prompt_trace": "KB-108#3#B1", "text": "The Knight is usually the hardest piece for beginners to master because its movement isn't a straight line. However, because it can jump over blockades, it is an incredibly tricky and dangerous piece in crowded positions where Rooks and Bishops are stuck."}, {"id": "LES-020-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-108#4#B1", "parent_prompt_trace": "KB-108#4#B1", "text": "- **Requires:** TOP-012 (Knight Recognition), TOP-107 (Bishop Movement)\n- **Unlocks:** TOP-109 (Pawn Movement), TOP-027 (Forks)"}, {"id": "LES-020-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-108#5#B1", "parent_prompt_trace": "KB-108#5#B1", "text": "The Knight is unique. Think of its move as a three-step sequence: \"One, Two, Turn.\" \nYou move it two squares straight (up, down, left, or right), and then one square at a 90-degree angle. \nIt does not matter if the squares the Knight passes over are occupied by friendly pieces or enemy pieces—the Knight leaps right over them like a horse jumping a fence. \nThe absolute most important thing to grasp is capturing: If the Knight jumps over an enemy pawn to land on an empty square, that enemy pawn is perfectly safe. The Knight *only* captures what it lands directly on."}, {"id": "LES-020-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-108#6#B1", "parent_prompt_trace": "KB-108#6#B1", "text": "1. **The Chants:** Place a Knight on the board. Say, \"The Knight is a brave horse! It gallops in an L-shape.\" Move the Knight while chanting: \"Gallop, gallop, turn!\" (Two squares straight, one to the side).\n2. **The L-Shape Tracing:** Have your child trace the capital \"L\" on the board with their finger before moving the piece.\n3. **The Jumping Demonstration:** Build a \"wall\" of pawns in a circle around the Knight. Show how the Queen or Rook would be trapped. Then say, \"But the horse can jump the fence!\" Have the Knight jump over the pawns.\n4. **The Safe Jump:** Jump the Knight *over* a Black pawn and land on an empty square. Ask, \"Did I capture the pawn?\" Explain strongly: \"No! The horse just jumped over its head. We only capture what we land on!\"\n5. **The Capture:** Place a Black piece exactly on the Knight's landing square. \"Gallop, gallop, turn... squash!\" Take the enemy piece."}, {"id": "LES-020-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-108#7#B1", "parent_prompt_trace": "KB-108#7#B1", "text": "**The Brave Horse:** \nThe Knight is a brave horse jumping fences in a tournament. It runs really fast (one, two!) and then makes a sharp turn (turn!). Because it jumps so high in the air, the people standing on the ground underneath the horse are totally safe. It only squashes the person standing exactly where its hooves land!"}, {"id": "LES-020-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-108#8#B1", "parent_prompt_trace": "KB-108#8#B1", "text": "The Knight always changes the color of the square it is standing on! If it starts its jump on a light square, it will always land on a dark square. If it starts on dark, it lands on light. This color-flipping is magic!"}, {"id": "LES-020-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1 — Basic Concept", "source_trace": "KB-108#9#B1", "parent_prompt_trace": "KB-108#9#B1", "text": "*The Knight jumps in an L-shape: two squares straight, one square to the side.*", "diagram_id": "DGM-108-01", "diagram_url": "assets/DGM-108-01.svg", "position_id": "POS-KNIGHT-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)", "diagram_alt": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)"}, {"id": "LES-020-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-108#10#B1", "parent_prompt_trace": "KB-108#10#B1", "text": "The Knight must complete its full \"L\" shape on every turn. It cannot stop halfway. If its landing square is empty, it lands safely. If its landing square has an enemy piece, it captures it. If its landing square has a friendly piece, the Knight cannot jump there (it cannot squash its friends!)."}, {"id": "LES-020-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-108#11#B1", "parent_prompt_trace": "KB-108#11#B1", "text": "*The Knight is the only piece that can jump over walls!*", "diagram_id": "DGM-108-02", "diagram_url": "assets/DGM-108-02.svg", "position_id": "POS-KNIGHT-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-108-02: A White Knight completely surrounded by pawns, jumping over them to land outside the wall.](../../assets/diagrams/TOP-108/DGM-108-02.svg)", "diagram_alt": "![DGM-108-02: A White Knight completely surrounded by pawns, jumping over them to land outside the wall.](../../assets/diagrams/TOP-108/DGM-108-02.svg)"}, {"id": "LES-020-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-108#12#B1", "parent_prompt_trace": "KB-108#12#B1", "text": "*Remember: we only capture the piece we land on, not the piece we jump over.*", "diagram_id": "DGM-108-03", "diagram_url": "assets/DGM-108-03.svg", "position_id": "POS-KNIGHT-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)", "diagram_alt": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)"}, {"id": "LES-020-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-108#13#B1", "parent_prompt_trace": "KB-108#13#B1", "text": "- **Incorrect Shapes:** Children sometimes move two straight and two to the side, or three straight and one to the side. \n- **Capturing jumped pieces:** Because checkers teaches kids to capture by jumping *over* pieces, children instinctively try to remove the pieces the Knight hops over.\n\n> **🧑‍🏫 Coach Tip:**\n> If your child removes a piece they jumped over, laugh and say, \"Wait! This is chess, not checkers! The horse jumped way over his head. Put him back on the board!\""}, {"id": "LES-020-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-108#14#B1", "parent_prompt_trace": "KB-108#14#B1", "text": "Expect the Knight to take twice as long to learn as the other pieces. Do not get frustrated. The \"Gallop, gallop, turn\" chant is highly effective because it adds rhythm to the physical movement.\n\n> **🧑‍🏫 Coach Tip:**\n> You can also teach the Knight as the \"Magic Circle.\" If a Knight is in the center, its 8 landing squares form a rough circle around it. This helps children visualize where it can reach without plotting every L-shape."}, {"id": "LES-020-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-108#15#B1", "parent_prompt_trace": "KB-108#15#B1", "text": "**Q: Can the Knight move sideways first, and then up? (One, two sideways, one up?)**\nA: Yes! The \"L\" can be laying down, standing up, or backward. As long as it is two steps in one direction, and one step sideways, it is a legal Knight move.\n\n**Q: My child keeps making a 2x2 square shape instead of an L.**\nA: Use coins or pawns to physically mark the path on the board. Make them touch each square: \"One, two, turn.\""}, {"id": "LES-020-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-108#16#B1", "parent_prompt_trace": "KB-108#16#B1", "text": "**The Knight Maze:**\nPlace the White Knight on `a1`. Scatter 6 or 7 Black pieces randomly on the board as \"apples.\" The child must jump the horse around the board, landing on the apples to eat them. See how many turns it takes to eat all the apples. Remember: they have to land exactly on the apple to eat it!"}, {"id": "LES-020-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-108#17#B1", "parent_prompt_trace": "KB-108#17#B1", "text": "**The Color Flipper Test:**\nPlace the Knight on `d4` (a dark square). Ask your child to point to a square they want to jump to. Before they move, ask them: \"You are starting on a dark square. What color square will the horse land on?\" (Answer: Light!). Let them jump to verify. Try it again from a light square. This teaches them the advanced concept that Knights always switch colors!"}, {"id": "LES-020-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-108#18#B1", "parent_prompt_trace": "KB-108#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which path is the horse allowed to take? The L-shape, or the straight diagonal line?\n**Answer:** The L-shape! Knights can never slide straight or diagonally.\n\n### 🟡 Application (Medium)\n\n**Question:** Can the White Knight jump over the Black pawn to capture the Black Bishop?\n**Answer:** Yes! The Knight jumps right over the pawn on c4 (ignoring it) and lands on d5 to capture the Bishop!\n\n### 🔴 Challenge (Hard)\n\n**Question:** The Knight can jump to two different squares here. Which piece is it allowed to capture?\n**Answer:** It can capture the Black Rook on g5! It is NOT allowed to jump onto e5 because its own White Pawn is standing there (you cannot squash your friends!).", "diagram_id": "DGM-108-06", "diagram_url": "assets/DGM-108-06.svg", "position_id": "POS-KNIGHT-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)", "diagram_alt": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)"}, {"id": "LES-020-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-108#19#B1", "parent_prompt_trace": "KB-108#19#B1", "text": "- **Lichess Practice:** [The Pieces - Knight](https://lichess.org/learn#/5) (Interactive drills for kids)."}, {"id": "LES-020-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-108#20#B1", "parent_prompt_trace": "KB-108#20#B1", "text": "- **Prerequisites:** TOP-107 Bishop Movement, TOP-012 Knight (Recognition)\n- **Next Steps:** TOP-109 Pawn Movement, TOP-027 Forks"}, {"id": "LES-020-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-108#21#B1", "parent_prompt_trace": "KB-108#21#B1", "text": "- [ ] Do I understand the \"Two straight, one sideways\" movement?\n- [ ] Do I understand that jumping over a piece does not capture it?\n- [ ] Do I understand the Knight only captures on its landing square?\n- [ ] Did we practice the \"Gallop, gallop, turn\" chant?\n- [ ] Did my child successfully avoid capturing a piece they jumped over?"}], "title": "Knight Movement", "duration_minutes": 20, "memory_phrase": "Gallop, gallop, turn.", "teach": {"title": "Core Lesson", "estimated_minutes": 20, "slides": [{"id": "LES-020-S01", "type": "INTRO", "title": "Knight Movement", "text": "The Knight gallops two, turns one, and can jump every wall.", "parent_prompt": "Introduce knight movement.", "diagram_id": "DGM-108-01", "diagram_url": "assets/DGM-108-01.svg", "visual": {"diagram_id": "DGM-108-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)", "diagram_alt": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)"}, {"id": "LES-020-S02", "type": "DIAGRAM", "title": "Basic movement", "text": "Use the board to explore knight movement.", "parent_prompt": "Guide the basic movement.", "diagram_id": "DGM-108-01", "diagram_url": "assets/DGM-108-01.svg", "visual": {"diagram_id": "DGM-108-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)", "diagram_alt": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)"}, {"id": "LES-020-S03", "type": "DIAGRAM", "title": "Capture", "text": "Use the board to explore knight movement.", "parent_prompt": "Guide the capture.", "diagram_id": "DGM-108-02", "diagram_url": "assets/DGM-108-02.svg", "visual": {"diagram_id": "DGM-108-02", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-108-02: A White Knight completely surrounded by pawns, jumping over them to land outside the wall.](../../assets/diagrams/TOP-108/DGM-108-02.svg)", "diagram_alt": "![DGM-108-02: A White Knight completely surrounded by pawns, jumping over them to land outside the wall.](../../assets/diagrams/TOP-108/DGM-108-02.svg)"}, {"id": "LES-020-S04", "type": "DIAGRAM", "title": "Real-game pattern", "text": "Use the board to explore knight movement.", "parent_prompt": "Guide the real-game pattern.", "diagram_id": "DGM-108-03", "diagram_url": "assets/DGM-108-03.svg", "visual": {"diagram_id": "DGM-108-03", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)", "diagram_alt": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)"}, {"id": "LES-020-S05", "type": "QUESTION", "title": "Recognition check", "text": "Use the board to explore knight movement.", "parent_prompt": "Guide the recognition check.", "diagram_id": "DGM-108-04", "diagram_url": "assets/DGM-108-04.svg", "visual": {"diagram_id": "DGM-108-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-004", "position_version": 1, "position_title": "![DGM-108-04: White Knight on e4. Highlight a legal L-shape jump and an illegal diagonal move.](../../assets/diagrams/TOP-108/DGM-108-04.svg)", "diagram_alt": "![DGM-108-04: White Knight on e4. Highlight a legal L-shape jump and an illegal diagonal move.](../../assets/diagrams/TOP-108/DGM-108-04.svg)"}, {"id": "LES-020-S06", "type": "QUESTION", "title": "Find the landing square", "text": "Decide what the Knight can capture.", "parent_prompt": "Guide the landing-square check.", "diagram_id": "DGM-108-05", "diagram_url": "assets/DGM-108-05.svg", "visual": {"diagram_id": "DGM-108-05", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-005", "position_version": 1, "position_title": "![DGM-108-05: White Knight on c3. Black Pawn on c4 (in front of Knight). Black Bishop on d5 (landing square).](../../assets/diagrams/TOP-108/DGM-108-05.svg)", "diagram_alt": "![DGM-108-05: White Knight on c3. Black Pawn on c4 (in front of Knight). Black Bishop on d5 (landing square).](../../assets/diagrams/TOP-108/DGM-108-05.svg)"}, {"id": "LES-020-S07", "type": "QUESTION", "title": "Choose a legal landing", "text": "Separate blocked and capturable landing squares.", "parent_prompt": "Guide the occupied-square check.", "diagram_id": "DGM-108-06", "diagram_url": "assets/DGM-108-06.svg", "visual": {"diagram_id": "DGM-108-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)", "diagram_alt": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)"}, {"id": "LES-020-S08", "type": "ASSESSMENT", "title": "Check your progress", "text": "Show that you understand knight movement.", "parent_prompt": "Check each success criterion with the board.", "diagram_id": "DGM-108-06", "diagram_url": "assets/DGM-108-06.svg", "visual": {"diagram_id": "DGM-108-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KNIGHT-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)", "diagram_alt": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)"}]}, "continue_teaching": {"title": "Continue Teaching", "estimated_minutes": 0, "groups": []}, "full_guide": {"title": "Parent Full Guide", "sections": [{"id": "LES-020-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-108#1#B1", "parent_prompt_trace": "KB-108#1#B1", "text": "- **Topic**: Knight Movement\n- **Difficulty**: Intermediate\n- **Typical age**: 6+\n- **Estimated teaching time**: 20 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-107 Bishop Movement, TOP-012 Knight Recognition\n\n**🎯 Today's Goal:**\nYour child will be able to jump the Knight in its unique \"L-shape\" pattern and understand that it only captures pieces on its final landing square.\n\n**✅ Lesson Success Criteria:**\n- The child successfully moves the Knight in an \"L-shape.\"\n- The child demonstrates that the Knight can jump over pieces.\n- The child understands that jumping *over* an enemy piece does not capture it.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-020-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-108#2#B1", "parent_prompt_trace": "KB-108#2#B1", "text": "The Knight is the only piece in chess that can jump over other pieces! It moves in a very specific pattern: two squares in a straight line (horizontally or vertically) followed by one square to the side. This forms the shape of a capital \"L\". The Knight captures an enemy piece *only* if that piece is sitting on the Knight's final landing square. Pieces that the Knight jumps over are ignored completely."}, {"id": "LES-020-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-108#3#B1", "parent_prompt_trace": "KB-108#3#B1", "text": "The Knight is usually the hardest piece for beginners to master because its movement isn't a straight line. However, because it can jump over blockades, it is an incredibly tricky and dangerous piece in crowded positions where Rooks and Bishops are stuck."}, {"id": "LES-020-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-108#4#B1", "parent_prompt_trace": "KB-108#4#B1", "text": "- **Requires:** TOP-012 (Knight Recognition), TOP-107 (Bishop Movement)\n- **Unlocks:** TOP-109 (Pawn Movement), TOP-027 (Forks)"}, {"id": "LES-020-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-108#5#B1", "parent_prompt_trace": "KB-108#5#B1", "text": "The Knight is unique. Think of its move as a three-step sequence: \"One, Two, Turn.\" \nYou move it two squares straight (up, down, left, or right), and then one square at a 90-degree angle. \nIt does not matter if the squares the Knight passes over are occupied by friendly pieces or enemy pieces—the Knight leaps right over them like a horse jumping a fence. \nThe absolute most important thing to grasp is capturing: If the Knight jumps over an enemy pawn to land on an empty square, that enemy pawn is perfectly safe. The Knight *only* captures what it lands directly on."}, {"id": "LES-020-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-108#6#B1", "parent_prompt_trace": "KB-108#6#B1", "text": "1. **The Chants:** Place a Knight on the board. Say, \"The Knight is a brave horse! It gallops in an L-shape.\" Move the Knight while chanting: \"Gallop, gallop, turn!\" (Two squares straight, one to the side).\n2. **The L-Shape Tracing:** Have your child trace the capital \"L\" on the board with their finger before moving the piece.\n3. **The Jumping Demonstration:** Build a \"wall\" of pawns in a circle around the Knight. Show how the Queen or Rook would be trapped. Then say, \"But the horse can jump the fence!\" Have the Knight jump over the pawns.\n4. **The Safe Jump:** Jump the Knight *over* a Black pawn and land on an empty square. Ask, \"Did I capture the pawn?\" Explain strongly: \"No! The horse just jumped over its head. We only capture what we land on!\"\n5. **The Capture:** Place a Black piece exactly on the Knight's landing square. \"Gallop, gallop, turn... squash!\" Take the enemy piece."}, {"id": "LES-020-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-108#7#B1", "parent_prompt_trace": "KB-108#7#B1", "text": "**The Brave Horse:** \nThe Knight is a brave horse jumping fences in a tournament. It runs really fast (one, two!) and then makes a sharp turn (turn!). Because it jumps so high in the air, the people standing on the ground underneath the horse are totally safe. It only squashes the person standing exactly where its hooves land!"}, {"id": "LES-020-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-108#8#B1", "parent_prompt_trace": "KB-108#8#B1", "text": "The Knight always changes the color of the square it is standing on! If it starts its jump on a light square, it will always land on a dark square. If it starts on dark, it lands on light. This color-flipping is magic!"}, {"id": "LES-020-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1 — Basic Concept", "source_trace": "KB-108#9#B1", "parent_prompt_trace": "KB-108#9#B1", "text": "*The Knight jumps in an L-shape: two squares straight, one square to the side.*", "diagram_id": "DGM-108-01", "diagram_url": "assets/DGM-108-01.svg", "position_id": "POS-KNIGHT-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)", "diagram_alt": "![DGM-108-01: A White Knight in the center, with green L-shaped arrows pointing to its 8 possible landing squares, forming a circle.](../../assets/diagrams/TOP-108/DGM-108-01.svg)"}, {"id": "LES-020-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-108#10#B1", "parent_prompt_trace": "KB-108#10#B1", "text": "The Knight must complete its full \"L\" shape on every turn. It cannot stop halfway. If its landing square is empty, it lands safely. If its landing square has an enemy piece, it captures it. If its landing square has a friendly piece, the Knight cannot jump there (it cannot squash its friends!)."}, {"id": "LES-020-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-108#11#B1", "parent_prompt_trace": "KB-108#11#B1", "text": "*The Knight is the only piece that can jump over walls!*", "diagram_id": "DGM-108-02", "diagram_url": "assets/DGM-108-02.svg", "position_id": "POS-KNIGHT-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-108-02: A White Knight completely surrounded by pawns, jumping over them to land outside the wall.](../../assets/diagrams/TOP-108/DGM-108-02.svg)", "diagram_alt": "![DGM-108-02: A White Knight completely surrounded by pawns, jumping over them to land outside the wall.](../../assets/diagrams/TOP-108/DGM-108-02.svg)"}, {"id": "LES-020-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-108#12#B1", "parent_prompt_trace": "KB-108#12#B1", "text": "*Remember: we only capture the piece we land on, not the piece we jump over.*", "diagram_id": "DGM-108-03", "diagram_url": "assets/DGM-108-03.svg", "position_id": "POS-KNIGHT-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)", "diagram_alt": "![DGM-108-03: A White Knight jumping over an enemy piece but capturing a completely different piece on its landing square.](../../assets/diagrams/TOP-108/DGM-108-03.svg)"}, {"id": "LES-020-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-108#13#B1", "parent_prompt_trace": "KB-108#13#B1", "text": "- **Incorrect Shapes:** Children sometimes move two straight and two to the side, or three straight and one to the side. \n- **Capturing jumped pieces:** Because checkers teaches kids to capture by jumping *over* pieces, children instinctively try to remove the pieces the Knight hops over.\n\n> **🧑‍🏫 Coach Tip:**\n> If your child removes a piece they jumped over, laugh and say, \"Wait! This is chess, not checkers! The horse jumped way over his head. Put him back on the board!\""}, {"id": "LES-020-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-108#14#B1", "parent_prompt_trace": "KB-108#14#B1", "text": "Expect the Knight to take twice as long to learn as the other pieces. Do not get frustrated. The \"Gallop, gallop, turn\" chant is highly effective because it adds rhythm to the physical movement.\n\n> **🧑‍🏫 Coach Tip:**\n> You can also teach the Knight as the \"Magic Circle.\" If a Knight is in the center, its 8 landing squares form a rough circle around it. This helps children visualize where it can reach without plotting every L-shape."}, {"id": "LES-020-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-108#15#B1", "parent_prompt_trace": "KB-108#15#B1", "text": "**Q: Can the Knight move sideways first, and then up? (One, two sideways, one up?)**\nA: Yes! The \"L\" can be laying down, standing up, or backward. As long as it is two steps in one direction, and one step sideways, it is a legal Knight move.\n\n**Q: My child keeps making a 2x2 square shape instead of an L.**\nA: Use coins or pawns to physically mark the path on the board. Make them touch each square: \"One, two, turn.\""}, {"id": "LES-020-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-108#16#B1", "parent_prompt_trace": "KB-108#16#B1", "text": "**The Knight Maze:**\nPlace the White Knight on `a1`. Scatter 6 or 7 Black pieces randomly on the board as \"apples.\" The child must jump the horse around the board, landing on the apples to eat them. See how many turns it takes to eat all the apples. Remember: they have to land exactly on the apple to eat it!"}, {"id": "LES-020-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-108#17#B1", "parent_prompt_trace": "KB-108#17#B1", "text": "**The Color Flipper Test:**\nPlace the Knight on `d4` (a dark square). Ask your child to point to a square they want to jump to. Before they move, ask them: \"You are starting on a dark square. What color square will the horse land on?\" (Answer: Light!). Let them jump to verify. Try it again from a light square. This teaches them the advanced concept that Knights always switch colors!"}, {"id": "LES-020-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-108#18#B1", "parent_prompt_trace": "KB-108#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which path is the horse allowed to take? The L-shape, or the straight diagonal line?\n**Answer:** The L-shape! Knights can never slide straight or diagonally.\n\n### 🟡 Application (Medium)\n\n**Question:** Can the White Knight jump over the Black pawn to capture the Black Bishop?\n**Answer:** Yes! The Knight jumps right over the pawn on c4 (ignoring it) and lands on d5 to capture the Bishop!\n\n### 🔴 Challenge (Hard)\n\n**Question:** The Knight can jump to two different squares here. Which piece is it allowed to capture?\n**Answer:** It can capture the Black Rook on g5! It is NOT allowed to jump onto e5 because its own White Pawn is standing there (you cannot squash your friends!).", "diagram_id": "DGM-108-06", "diagram_url": "assets/DGM-108-06.svg", "position_id": "POS-KNIGHT-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)", "diagram_alt": "![DGM-108-06: White Knight on f3. White Pawn on e5 (a landing square). Black Rook on g5 (a landing square).](../../assets/diagrams/TOP-108/DGM-108-06.svg)"}, {"id": "LES-020-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-108#19#B1", "parent_prompt_trace": "KB-108#19#B1", "text": "- **Lichess Practice:** [The Pieces - Knight](https://lichess.org/learn#/5) (Interactive drills for kids)."}, {"id": "LES-020-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-108#20#B1", "parent_prompt_trace": "KB-108#20#B1", "text": "- **Prerequisites:** TOP-107 Bishop Movement, TOP-012 Knight (Recognition)\n- **Next Steps:** TOP-109 Pawn Movement, TOP-027 Forks"}, {"id": "LES-020-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-108#21#B1", "parent_prompt_trace": "KB-108#21#B1", "text": "- [ ] Do I understand the \"Two straight, one sideways\" movement?\n- [ ] Do I understand that jumping over a piece does not capture it?\n- [ ] Do I understand the Knight only captures on its landing square?\n- [ ] Did we practice the \"Gallop, gallop, turn\" chant?\n- [ ] Did my child successfully avoid capturing a piece they jumped over?"}]}}</script><script id="task-data" type="application/json">{"schema_version": 1, "lesson_id": "LES-020", "tasks": [{"schema_version": 1, "task_id": "PZL-020-01", "kb_id": "KB-108", "lesson_id": "LES-020", "task_type": "PHYSICAL_B t rule in your own words.", "hint": "The Knight gallops two, turns one, and can jump every wall.", "answer": {"kind": "TEXT_RUBRIC", "text": "Gallop, gallop, turn."}, "difficulty": "FOUNDATION", "source_trace": {"source_path": "curriculum/lessons/LES-020.yaml", "source_sha256": "9f835ce14dd8f6270a149d4bd63cc6d18464d77ed47019779a17d1aa8ec8f45b", "field": "exercises", "anchor": "EX-020-04"}, "validation": {"status": "VALID", "validator_version": 1}}]}</script><script src="assets/classroom.js"></script></body></html>
