<script id="lesson-data" type="application/json">{"lesson_id": "LES-016", "kb_id": "KB-104", "topic_id": "TOP-104", "unit_id": "UNT-001", "sequence": 16, "objective": "**🎯 Today's Goal:**\nYour child will be able to correctly move the King one square at a time, capture with the King, and identify which squares are safe or dangerous.", "success_criteria": "**✅ Lesson Success Criteria:**\n- The child moves the King exactly one square in any direction.\n- The child correctly captures an enemy piece with the King.\n- The child refuses to move the King onto a square attacked by an enemy.", "source_traces": {"objective": "KB-104#1#B2", "success_criteria": "KB-104#1#B3"}, "prerequisites": [], "readiness_checks": [], "parent_notes": [], "parent_reference": [{"ordinal": 1, "section_id": "AT_A_GLANCE", "heading": "1. At a Glance", "source_trace": "KB-104#1", "content": "- **Topic**: King Movement\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 15 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-005 Squares, TOP-008 King Recognition\n\n**🎯 Today's Goal:**\nYour child will be able to correctly move the King one square at a time, capture with the King, and identify which squares are safe or dangerous.\n\n**✅ Lesson Success Criteria:**\n- The child moves the King exactly one square in any direction.\n- The child correctly captures an enemy piece with the King.\n- The child refuses to move the King onto a square attacked by an enemy.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"ordinal": 2, "section_id": "DEFINITION", "heading": "2. Definition", "source_trace": "KB-104#2", "content": "The King is the most important piece in chess, but it is a slow mover. It can only move one square at a time in any direction (forward, backward, left, right, or diagonally). The King captures the same way it moves: by stepping onto the square occupied by an enemy piece. However, there is a special rule: the King is never allowed to move to a square where an enemy piece could capture it."}, {"ordinal": 3, "section_id": "WHY_IT_MATTERS", "heading": "3. Why It Matters", "source_trace": "KB-104#3", "content": "Before a child can understand how to win the game (Checkmate), they must first master how the King moves and exactly where it is allowed to go. Because the King cannot move into danger, its movement rules are unique compared to every other piece."}, {"ordinal": 4, "section_id": "BEFORE_YOU_TEACH", "heading": "4. Before You Teach (Graph)", "source_trace": "KB-104#4", "content": "- **Requires:** TOP-008 (King Recognition), TOP-005 (Squares)\n- **Unlocks:** TOP-019 (Check), TOP-022 (Castling), TOP-105 (Queen Movement)"}, {"ordinal": 5, "section_id": "PARENT_UNDERSTANDS", "heading": "5. Parent Understands", "source_trace": "KB-104#5", "content": "The King's movement is mechanically simple but conceptually tricky due to the \"safety rule.\" \nMechanically, the King steps exactly one square to any adjacent square. If an enemy piece is on that adjacent square, the King can capture it by removing the enemy and taking its place.\nConceptually, the King has a severe restriction: it cannot commit \"suicide.\" If moving to a square would place the King in the path of an enemy attack, that move is illegal. A direct consequence of this rule is that **two Kings can never stand next to each other**. If they did, they would be attacking each other, meaning the one who just moved stepped into danger!"}, {"ordinal": 6, "section_id": "HOW_TO_TEACH_IT", "heading": "6. How to Teach It", "source_trace": "KB-104#6", "content": "1. **Clear the Board:** Start with a completely empty board. Place the White King in the center.\n2. **The Step Demonstration:** Slowly move the King one square forward. Say, \"The King takes one careful step.\" Move it back, then take one step diagonally. \n3. **The Finger Trace:** Have your child put their finger on the King, and ask them to tap every square the King is allowed to step to right now. (They should tap the 8 surrounding squares).\n4. **Introduce Danger:** Place a Black pawn near the King so that it attacks a square next to the King. Ask the child to move the King. If they try to move to the attacked square, stop them with a gentle \"Uh oh!\" and explain the safety rule.\n5. **The Two Kings Rule:** Place the Black King on the board, two squares away from the White King. Ask the child to move the White King right next to the Black King. When they do, act like a referee blowing a whistle! Explain that Kings have a force field and can never touch."}, {"ordinal": 7, "section_id": "STORY_ANALOGY_MEMORY", "heading": "7. Teaching Story / Analogy / Memory Hint", "source_trace": "KB-104#7", "content": "**The Old Wise King:** \nThe King is very old, very wise, and wearing a heavy gold crown. Because his crown is so heavy and he is so old, he cannot run. He can only take one slow, careful step at a time. Because he is the leader of the kingdom, he is also very cautious—he will never step onto a square if a bad guy is watching it!"}, {"ordinal": 8, "section_id": "DID_YOU_KNOW", "heading": "8. Did You Know? 🎓", "source_trace": "KB-104#8", "content": "Even though the King is slow, in the \"Endgame\" (when most pieces have been captured), the King becomes a powerful fighter! Without many enemies around to trap him, the old King marches up the board to help his army win."}, {"ordinal": 9, "section_id": "BOARD_DIAGRAM_1", "heading": "9. Board Diagram 1 — Basic Concept", "source_trace": "KB-104#9", "content": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)\n*The King can step one square in any direction.*"}, {"ordinal": 10, "section_id": "HOW_IT_WORKS", "heading": "10. How It Works", "source_trace": "KB-104#10", "content": "The King moves by picking a square right next to it and stepping there. It does not jump. If one of your own pieces is on the square next to the King, the King is blocked and cannot move there. If an enemy piece is on a square next to the King (and no other enemy is protecting it), the King can capture it!"}, {"ordinal": 11, "section_id": "BOARD_DIAGRAM_2", "heading": "11. Board Diagram 2 — Practical Example", "source_trace": "KB-104#11", "content": "![DGM-104-02: A White King next to an unprotected Black Pawn, with a green arrow showing the capture.](../../assets/diagrams/TOP-104/DGM-104-02.svg)\n*The King captures just like it moves—by taking one step onto the enemy's square.*"}, {"ordinal": 12, "section_id": "REAL_GAME_EXAMPLE", "heading": "12. Real Game Example", "source_trace": "KB-104#12", "content": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)\n*In a real game, the King has to be careful. Here, the King cannot move forward because of its own pieces, and cannot move left because an enemy is watching those squares.*"}, {"ordinal": 13, "section_id": "COMMON_MISTAKES", "heading": "13. Common Mistakes", "source_trace": "KB-104#13", "content": "- **Moving two squares:** Children sometimes get excited and try to slide the King like a Rook.\n- **Ignoring danger:** The most common mistake is moving the King onto a square that an enemy piece is attacking.\n- **Kings touching:** Children will often try to capture the enemy King with their own King. \n\n> **🧑‍🏫 Coach Tip:**\n> If your child moves the King into danger, don't say \"Illegal move!\" Instead, gasp playfully and say, \"Oh no! The bad guy is watching that square! The King is too smart to step there. Try another step!\""}, {"ordinal": 14, "section_id": "TEACHING_NOTES", "heading": "14. Teaching Notes", "source_trace": "KB-104#14", "content": "Spend the most time on the concept of \"danger squares.\" Moving the piece one square is easy; looking around the board to see if that square is safe requires a lot of cognitive effort for a 6-year-old. Be extremely patient. \n\n> **🧑‍🏫 Coach Tip:**\n> Use your hands to physically cover the \"danger squares\" on the board when the child is first learning, physically blocking them from making an illegal move. Then, gradually remove your hands and let them spot the danger themselves."}, {"ordinal": 15, "section_id": "PARENT_FAQ", "heading": "15. Parent FAQ", "source_trace": "KB-104#15", "content": "**Q: My child keeps trying to capture the other King. What do I do?**\nA: Remind them of the \"Force Field\" rule. Kings have magical force fields that push each other away. They can never stand next to each other, so they can never capture each other.\n\n**Q: Do we say 'Check' when teaching this?**\nA: Not yet! Right now, we only call it \"danger.\" \"Check\" involves a whole new set of rules (escaping, blocking, capturing the attacker). We will learn Check in a later lesson. \n\n**Q: Can the King move backwards?**\nA: Yes! The King can move backwards, forwards, sideways, and diagonally."}, {"ordinal": 16, "section_id": "PRACTICE_TOGETHER", "heading": "16. Practice Together", "source_trace": "KB-104#16", "content": "**The Minefield Game:**\nTake an empty board and place the White King on `e1`. Place 4 or 5 Black pieces scattered around the board (Pawns and Rooks work best). Put a piece of candy or a small toy on the other side of the board (e.g., `e8`). Take turns moving the King one square at a time, trying to reach the prize without ever stepping on a \"danger square\" (a square attacked by the Black pieces). Work together to find the safe path!"}, {"ordinal": 17, "section_id": "COACH_CHALLENGE", "heading": "17. Coach Challenge ⭐", "source_trace": "KB-104#17", "content": "**The Force Field Test:**\nPlace the White King on `d4`. Hold the Black King in your hand. Try to place the Black King on `d5` (right next to the White King). Ask your child, \"Can I put my King here?\" Encourage them to yell \"No! Force Field!\" Try placing your King on `e5` (diagonal). \"How about here?\" (No!). Then place it on `d6` (one empty square between them). \"How about here?\" (Yes!). This physically reinforces the two-Kings rule."}, {"ordinal": 18, "section_id": "TRY_IT_YOURSELF", "heading": "18. Try It Yourself", "source_trace": "KB-104#18", "content": "### 🟢 Recognition (Easy)\n![DGM-104-04: White King on e4. Black Rook on a5. Highlight the squares around the King.](../../assets/diagrams/TOP-104/DGM-104-04.svg)\n**Question:** Which of the highlighted squares are SAFE for the King to step on?\n**Answer:** The King can move to d3, e3, f3, d4, and f4. It CANNOT move to d5, e5, or f5 because the Black Rook is watching that rank.\n\n### 🟡 Application (Medium)\n![DGM-104-05: White King on g2. Black Pawn on h3 (unprotected).](../../assets/diagrams/TOP-104/DGM-104-05.svg)\n**Question:** Can the White King capture the Black Pawn?\n**Answer:** Yes! The King takes one step diagonally to capture the unprotected pawn.\n\n### 🔴 Challenge (Hard)\n![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)\n**Question:** The White King wants to move. Where can he go?\n**Answer:** Nowhere! He is blocked by his own pawns forward, and he cannot move to d1 or f1 right now. (Note: He is also in danger on e1, but we just want to focus on his inability to step anywhere safe)."}, {"ordinal": 19, "section_id": "CONTINUE_LEARNING", "heading": "19. Continue Learning", "source_trace": "KB-104#19", "content": "- **Lichess Practice:** [The Pieces - King](https://lichess.org/learn#/3) (Interactive drills for kids)."}, {"ordinal": 20, "section_id": "RELATED_TOPICS", "heading": "20. Related Topics", "source_trace": "KB-104#20", "content": "- **Prerequisites:** TOP-005 Squares, TOP-008 King (Recognition)\n- **Next Steps:** TOP-105 Queen Movement, TOP-019 Check"}, {"ordinal": 21, "section_id": "PARENT_CONFIDENCE_CHECK", "heading": "21. Parent Confidence Check ✅", "source_trace": "KB-104#21", "content": "- [ ] Do I understand that the King only moves one square?\n- [ ] Do I understand that the King cannot step into an attacked square?\n- [ ] Do I understand that two Kings can never touch?\n- [ ] Did we complete the \"Minefield Game\" together?\n- [ ] Can my child explain why the King cannot step next to another King?\n\n---\n\n```yaml\nkb_quality:\n  reviewed: true\n  diagrams: 6\n  mini_puzzles: 3\n  external_resources: 1\n  coach_challenges: 1\n  practice_activities: 1\n  coach_tips: 2\n  parent_faq: 3\n  estimated_read_time: 15 min\n```"}], "slides": [{"id": "LES-016-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-104#1#B1", "parent_prompt_trace": "KB-104#1#B1", "text": "- **Topic**: King Movement\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 15 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-005 Squares, TOP-008 King Recognition\n\n**🎯 Today's Goal:**\nYour child will be able to correctly move the King one square at a time, capture with the King, and identify which squares are safe or dangerous.\n\n**✅ Lesson Success Criteria:**\n- The child moves the King exactly one square in any direction.\n- The child correctly captures an enemy piece with the King.\n- The child refuses to move the King onto a square attacked by an enemy.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-016-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-104#2#B1", "parent_prompt_trace": "KB-104#2#B1", "text": "The King is the most important piece in chess, but it is a slow mover. It can only move one square at a time in any direction (forward, backward, left, right, or diagonally). The King captures the same way it moves: by stepping onto the square occupied by an assets/diagrams/TOP-104/DGM-104-02.svg)", "diagram_alt": "![DGM-104-02: A White King next to an unprotected Black Pawn, with a green arrow showing the capture.](../../assets/diagrams/TOP-104/DGM-104-02.svg)"}, {"id": "LES-016-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-104#12#B1", "parent_prompt_trace": "KB-104#12#B1", "text": "*In a real game, the King has to be careful. Here, the King cannot move forward because of its own pieces, and cannot move left because an enemy is watching those squares.*", "diagram_id": "DGM-104-03", "diagram_url": "assets/DGM-104-03.svg", "position_id": "POS-KING-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)", "diagram_alt": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)"}, {"id": "LES-016-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-104#13#B1", "parent_prompt_trace": "KB-104#13#B1", "text": "- **Moving two squares:** Children sometimes get excited and try to slide the King like a Rook.\n- **Ignoring danger:** The most common mistake is moving the King onto a square that an enemy piece is attacking.\n- **Kings touching:** Children will often try to capture the enemy King with their own King.\n\n> **🧑‍🏫 Coach Tip:**\n> If your child moves the King into danger, don't say \"Illegal move!\" Instead, gasp playfully and say, \"Oh no! The bad guy is watching that square! The King is too smart to step there. Try another step!\""}, {"id": "LES-016-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-104#14#B1", "parent_prompt_trace": "KB-104#14#B1", "text": "Spend the most time on the concept of \"danger squares.\" Moving the piece one square is easy; looking around the board to see if that square is safe requires a lot of cognitive effort for a 6-year-old. Be extremely patient.\n\n> **🧑‍🏫 Coach Tip:**\n> Use your hands to physically cover the \"danger squares\" on the board when the child is first learning, physically blocking them from making an illegal move. Then, gradually remove your hands and let them spot the danger themselves."}, {"id": "LES-016-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-104#15#B1", "parent_prompt_trace": "KB-104#15#B1", "text": "**Q: My child keeps trying to capture the other King. What do I do?**\nA: Remind them of the \"Force Field\" rule. Kings have magical force fields that push each other away. They can never stand next to each other, so they can never capture each other.\n\n**Q: Do we say 'Check' when teaching this?**\nA: Not yet! Right now, we only call it \"danger.\" \"Check\" involves a whole new set of rules (escaping, blocking, capturing the attacker). We will learn Check in a later lesson.\n\n**Q: Can the King move backwards?**\nA: Yes! The King can move backwards, forwards, sideways, and diagonally."}, {"id": "LES-016-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-104#16#B1", "parent_prompt_trace": "KB-104#16#B1", "text": "**The Minefield Game:**\nTake an empty board and place the White King on `e1`. Place 4 or 5 Black pieces scattered around the board (Pawns and Rooks work best). Put a piece of candy or a small toy on the other side of the board (e.g., `e8`). Take turns moving the King one square at a time, trying to reach the prize without ever stepping on a \"danger square\" (a square attacked by the Black pieces). Work together to find the safe path!"}, {"id": "LES-016-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-104#17#B1", "parent_prompt_trace": "KB-104#17#B1", "text": "**The Force Field Test:**\nPlace the White King on `d4`. Hold the Black King in your hand. Try to place the Black King on `d5` (right next to the White King). Ask your child, \"Can I put my King here?\" Encourage them to yell \"No! Force Field!\" Try placing your King on `e5` (diagonal). \"How about here?\" (No!). Then place it on `d6` (one empty square between them). \"How about here?\" (Yes!). This physically reinforces the two-Kings rule."}, {"id": "LES-016-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-104#18#B1", "parent_prompt_trace": "KB-104#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which of the highlighted squares are SAFE for the King to step on?\n**Answer:** The King can move to d3, e3, f3, d4, and f4. It CANNOT move to d5, e5, or f5 because the Black Rook is watching that rank.\n\n### 🟡 Application (Medium)\n\n**Question:** Can the White King capture the Black Pawn?\n**Answer:** Yes! The King takes one step diagonally to capture the unprotected pawn.\n\n### 🔴 Challenge (Hard)\n\n**Question:** The White King wants to move. Where can he go?\n**Answer:** Nowhere! He is blocked by his own pawns forward, and he cannot move to d1 or f1 right now. (Note: He is also in danger on e1, but we just want to focus on his inability to step anywhere safe).", "diagram_id": "DGM-104-06", "diagram_url": "assets/DGM-104-06.svg", "position_id": "POS-KING-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)", "diagram_alt": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)"}, {"id": "LES-016-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-104#19#B1", "parent_prompt_trace": "KB-104#19#B1", "text": "- **Lichess Practice:** [The Pieces - King](https://lichess.org/learn#/3) (Interactive drills for kids)."}, {"id": "LES-016-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-104#20#B1", "parent_prompt_trace": "KB-104#20#B1", "text": "- **Prerequisites:** TOP-005 Squares, TOP-008 King (Recognition)\n- **Next Steps:** TOP-105 Queen Movement, TOP-019 Check"}, {"id": "LES-016-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-104#21#B1", "parent_prompt_trace": "KB-104#21#B1", "text": "- [ ] Do I understand that the King only moves one square?\n- [ ] Do I understand that the King cannot step into an attacked square?\n- [ ] Do I understand that two Kings can never touch?\n- [ ] Did we complete the \"Minefield Game\" together?\n- [ ] Can my child explain why the King cannot step next to another King?"}], "task_references": ["PZL-016-01", "PZL-016-02", "PZL-016-03", "PZL-016-04"], "diagram_references": ["DGM-104-01", "DGM-104-02", "DGM-104-03", "DGM-104-04", "DGM-104-05", "DGM-104-06"], "diagram_deferrals": [], "assessment_reference": "ASM-016", "deferred_topics": [], "teach_slides": [{"id": "LES-016-S01", "type": "INTRO", "title": "King Movement", "text": "The King takes one careful step and never steps into danger.", "parent_prompt": "Introduce king movement.", "diagram_id": "DGM-104-01", "diagram_url": "assets/DGM-104-01.svg", "visual": {"diagram_id": "DGM-104-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)", "diagram_alt": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)"}, {"id": "LES-016-S02", "type": "DIAGRAM", "title": "Basic movement", "text": "Use the board to explore king movement.", "parent_prompt": "Guide the basic movement.", "diagram_id": "DGM-104-01", "diagram_url": "assets/DGM-104-01.svg", "visual": {"diagram_id": "DGM-104-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)", "diagram_alt": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)"}, {"id": "LES-016-S03", "type": "DIAGRAM", "title": "Capture", "text": "Use the board to explore king movement.", "parent_prompt": "Guide the capture.", "diagram_id": "DGM-104-02", "diagram_url": "assets/DGM-104-02.svg", "visual": {"diagram_id": "DGM-104-02", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-104-02: A White King next to an unprotected Black Pawn, with a green arrow showing the capture.](../../assets/diagrams/TOP-104/DGM-104-02.svg)", "diagram_alt": "![DGM-104-02: A White King next to an unprotected Black Pawn, with a green arrow showing the capture.](../../assets/diagrams/TOP-104/DGM-104-02.svg)"}, {"id": "LES-016-S04", "type": "DIAGRAM", "title": "Real-game pattern", "text": "Use the board to explore king movement.", "parent_prompt": "Guide the real-game pattern.", "diagram_id": "DGM-104-03", "diagram_url": "assets/DGM-104-03.svg", "visual": {"diagram_id": "DGM-104-03", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)", "diagram_alt": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)"}, {"id": "LES-016-S05", "type": "QUESTION", "title": "Recognition check", "text": "Use the board to explore king movement.", "parent_prompt": "Guide the recognition check.", "diagram_id": "DGM-104-04", "diagram_url": "assets/DGM-104-04.svg", "visual": {"diagram_id": "DGM-104-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-004", "position_version": 1, "position_title": "![DGM-104-04: White King on e4. Black Rook on a5. Highlight the squares around the King.](../../assets/diagrams/TOP-104/DGM-104-04.svg)", "diagram_alt": "![DGM-104-04: White King on e4. Black Rook on a5. Highlight the squares around the King.](../../assets/diagrams/TOP-104/DGM-104-04.svg)"}, {"id": "LES-016-S06", "type": "QUESTION", "title": "Safe capture", "text": "Decide whether the King can capture safely.", "parent_prompt": "Guide the safe-capture check.", "diagram_id": "DGM-104-05", "diagram_url": "assets/DGM-104-05.svg", "visual": {"diagram_id": "DGM-104-05", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-005", "position_version": 1, "position_title": "![DGM-104-05: White King on g2. Black Pawn on h3 (unprotected).](../../assets/diagrams/TOP-104/DGM-104-05.svg)", "diagram_alt": "![DGM-104-05: White King on g2. Black Pawn on h3 (unprotected).](../../assets/diagrams/TOP-104/DGM-104-05.svg)"}, {"id": "LES-016-S07", "type": "QUESTION", "title": "Avoid danger", "text": "Find the square the King must not enter.", "parent_prompt": "Guide the danger-square check.", "diagram_id": "DGM-104-06", "diagram_url": "assets/DGM-104-06.svg", "visual": {"diagram_id": "DGM-104-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)", "diagram_alt": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)"}, {"id": "LES-016-S08", "type": "ASSESSMENT", "title": "Check your progress", "text": "Show that you understand king movement.", "parent_prompt": "Check each success criterion with the board.", "diagram_id": "DGM-104-06", "diagram_url": "assets/DGM-104-06.svg", "visual": {"diagram_id": "DGM-104-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)", "diagram_alt": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)"}], "guide_sections": [{"id": "LES-016-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-104#1#B1", "parent_prompt_trace": "KB-104#1#B1", "text": "- **Topic**: King Movement\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 15 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-005 Squares, TOP-008 King Recognition\n\n**🎯 Today's Goal:**\nYour child will be able to correctly move the King one square at a time, capture with the King, and identify which squares are safe or dangerous.\n\n**✅ Lesson Success Criteria:**\n- The child moves the King exactly one square in any direction.\n- The child correctly captures an enemy piece with the King.\n- The child refuses to move the King onto a square attacked by an enemy.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-016-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-104#2#B1", "parent_prompt_trace": "KB-104#2#B1", "text": "The King is the most important piece in chess, but it is a slow mover. It can only move one square at a time in any direction (forward, backward, left, right, or diagonally). The King captures the same way it moves: by stepping onto the square occupied by an enemy piece. However, there is a special rule: the King is never allowed to move to a square where an enemy piece could capture it."}, {"id": "LES-016-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-104#3#B1", "parent_prompt_trace": "KB-104#3#B1", "text": "Before a child can understand how to win the game (Checkmate), they must first master how the King moves and exactly where it is allowed to go. Because the King cannot move into danger, its movement rules are unique compared to every other piece."}, {"id": "LES-016-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-104#4#B1", "parent_prompt_trace": "KB-104#4#B1", "text": "- **Requires:** TOP-008 (King Recognition), TOP-005 (Squares)\n- **Unlocks:** TOP-019 (Check), TOP-022 (Castling), TOP-105 (Queen Movement)"}, {"id": "LES-016-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-104#5#B1", "parent_prompt_trace": "KB-104#5#B1", "text": "The King's movement is mechanically simple but conceptually tricky due to the \"safety rule.\" \nMechanically, the King steps exactly one square to any adjacent square. If an enemy piece is on that adjacent square, the King can capture it by removing the enemy and taking its place.\nConceptually, the King has a severe restriction: it cannot commit \"suicide.\" If moving to a square would place the King in the path of an enemy attack, that move is illegal. A direct consequence of this rule is that **two Kings can never stand next to each other**. If they did, they would be attacking each other, meaning the one who just moved stepped into danger!"}, {"id": "LES-016-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-104#6#B1", "parent_prompt_trace": "KB-104#6#B1", "text": "1. **Clear the Board:** Start with a completely empty board. Place the White King in the center.\n2. **The Step Demonstration:** Slowly move the King one square forward. Say, \"The King takes one careful step.\" Move it back, then take one step diagonally. \n3. **The Finger Trace:** Have your child put their finger on the King, and ask them to tap every square the King is allowed to step to right now. (They should tap the 8 surrounding squares).\n4. **Introduce Danger:** Place a Black pawn near the King so that it attacks a square next to the King. Ask the child to move the King. If they try to move to the attacked square, stop them with a gentle \"Uh oh!\" and explain the safety rule.\n5. **The Two Kings Rule:** Place the Black King on the board, two squares away from the White King. Ask the child to move the White King right next to the Black King. When they do, act like a referee blowing a whistle! Explain that Kings have a force field and can never touch."}, {"id": "LES-016-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-104#7#B1", "parent_prompt_trace": "KB-104#7#B1", "text": "**The Old Wise King:** \nThe King is very old, very wise, and wearing a heavy gold crown. Because his crown is so heavy and he is so old, he cannot run. He can only take one slow, careful step at a time. Because he is the leader of the kingdom, he is also very cautious—he will never step onto a square if a bad guy is watching it!"}, {"id": "LES-016-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-104#8#B1", "parent_prompt_trace": "KB-104#8#B1", "text": "Even though the King is slow, in the \"Endgame\" (when most pieces have been captured), the King becomes a powerful fighter! Without many enemies around to trap him, the old King marches up the board to help his army win."}, {"id": "LES-016-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1 — Basic Concept", "source_trace": "KB-104#9#B1", "parent_prompt_trace": "KB-104#9#B1", "text": "*The King can step one square in any direction.*", "diagram_id": "DGM-104-01", "diagram_url": "assets/DGM-104-01.svg", "position_id": "POS-KING-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)", "diagram_alt": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)"}, {"id": "LES-016-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-104#10#B1", "parent_prompt_trace": "KB-104#10#B1", "text": "The King moves by picking a square right next to it and stepping there. It does not jump. If one of your own pieces is on the square next to the King, the King is blocked and cannot move there. If an enemy piece is on a square next to the King (and no other enemy is protecting it), the King can capture it!"}, {"id": "LES-016-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-104#11#B1", "parent_prompt_trace": "KB-104#11#B1", "text": "*The King captures just like it moves—by taking one step onto the enemy's square.*", "diagram_id": "DGM-104-02", "diagram_url": "assets/DGM-104-02.svg", "position_id": "POS-KING-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-104-02: A White King next to an unprotected Black Pawn, with a green arrow showing the capture.](../../assets/diagrams/TOP-104/DGM-104-02.svg)", "diagram_alt": "![DGM-104-02: A White King next to an unprotected Black Pawn, with a green arrow showing the capture.](../../assets/diagrams/TOP-104/DGM-104-02.svg)"}, {"id": "LES-016-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-104#12#B1", "parent_prompt_trace": "KB-104#12#B1", "text": "*In a real game, the King has to be careful. Here, the King cannot move forward because of its own pieces, and cannot move left because an enemy is watching those squares.*", "diagram_id": "DGM-104-03", "diagram_url": "assets/DGM-104-03.svg", "position_id": "POS-KING-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)", "diagram_alt": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)"}, {"id": "LES-016-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-104#13#B1", "parent_prompt_trace": "KB-104#13#B1", "text": "- **Moving two squares:** Children sometimes get excited and try to slide the King like a Rook.\n- **Ignoring danger:** The most common mistake is moving the King onto a square that an enemy piece is attacking.\n- **Kings touching:** Children will often try to capture the enemy King with their own King.\n\n> **🧑‍🏫 Coach Tip:**\n> If your child moves the King into danger, don't say \"Illegal move!\" Instead, gasp playfully and say, \"Oh no! The bad guy is watching that square! The King is too smart to step there. Try another step!\""}, {"id": "LES-016-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-104#14#B1", "parent_prompt_trace": "KB-104#14#B1", "text": "Spend the most time on the concept of \"danger squares.\" Moving the piece one square is easy; looking around the board to see if that square is safe requires a lot of cognitive effort for a 6-year-old. Be extremely patient.\n\n> **🧑‍🏫 Coach Tip:**\n> Use your hands to physically cover the \"danger squares\" on the board when the child is first learning, physically blocking them from making an illegal move. Then, gradually remove your hands and let them spot the danger themselves."}, {"id": "LES-016-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-104#15#B1", "parent_prompt_trace": "KB-104#15#B1", "text": "**Q: My child keeps trying to capture the other King. What do I do?**\nA: Remind them of the \"Force Field\" rule. Kings have magical force fields that push each other away. They can never stand next to each other, so they can never capture each other.\n\n**Q: Do we say 'Check' when teaching this?**\nA: Not yet! Right now, we only call it \"danger.\" \"Check\" involves a whole new set of rules (escaping, blocking, capturing the attacker). We will learn Check in a later lesson.\n\n**Q: Can the King move backwards?**\nA: Yes! The King can move backwards, forwards, sideways, and diagonally."}, {"id": "LES-016-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-104#16#B1", "parent_prompt_trace": "KB-104#16#B1", "text": "**The Minefield Game:**\nTake an empty board and place the White King on `e1`. Place 4 or 5 Black pieces scattered around the board (Pawns and Rooks work best). Put a piece of candy or a small toy on the other side of the board (e.g., `e8`). Take turns moving the King one square at a time, trying to reach the prize without ever stepping on a \"danger square\" (a square attacked by the Black pieces). Work together to find the safe path!"}, {"id": "LES-016-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-104#17#B1", "parent_prompt_trace": "KB-104#17#B1", "text": "**The Force Field Test:**\nPlace the White King on `d4`. Hold the Black King in your hand. Try to place the Black King on `d5` (right next to the White King). Ask your child, \"Can I put my King here?\" Encourage them to yell \"No! Force Field!\" Try placing your King on `e5` (diagonal). \"How about here?\" (No!). Then place it on `d6` (one empty square between them). \"How about here?\" (Yes!). This physically reinforces the two-Kings rule."}, {"id": "LES-016-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-104#18#B1", "parent_prompt_trace": "KB-104#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which of the highlighted squares are SAFE for the King to step on?\n**Answer:** The King can move to d3, e3, f3, d4, and f4. It CANNOT move to d5, e5, or f5 because the Black Rook is watching that rank.\n\n### 🟡 Application (Medium)\n\n**Question:** Can the White King capture the Black Pawn?\n**Answer:** Yes! The King takes one step diagonally to capture the unprotected pawn.\n\n### 🔴 Challenge (Hard)\n\n**Question:** The White King wants to move. Where can he go?\n**Answer:** Nowhere! He is blocked by his own pawns forward, and he cannot move to d1 or f1 right now. (Note: He is also in danger on e1, but we just want to focus on his inability to step anywhere safe).", "diagram_id": "DGM-104-06", "diagram_url": "assets/DGM-104-06.svg", "position_id": "POS-KING-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)", "diagram_alt": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)"}, {"id": "LES-016-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-104#19#B1", "parent_prompt_trace": "KB-104#19#B1", "text": "- **Lichess Practice:** [The Pieces - King](https://lichess.org/learn#/3) (Interactive drills for kids)."}, {"id": "LES-016-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-104#20#B1", "parent_prompt_trace": "KB-104#20#B1", "text": "- **Prerequisites:** TOP-005 Squares, TOP-008 King (Recognition)\n- **Next Steps:** TOP-105 Queen Movement, TOP-019 Check"}, {"id": "LES-016-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-104#21#B1", "parent_prompt_trace": "KB-104#21#B1", "text": "- [ ] Do I understand that the King only moves one square?\n- [ ] Do I understand that the King cannot step into an attacked square?\n- [ ] Do I understand that two Kings can never touch?\n- [ ] Did we complete the \"Minefield Game\" together?\n- [ ] Can my child explain why the King cannot step next to another King?"}], "title": "King Movement", "duration_minutes": 15, "memory_phrase": "One careful step, always safe.", "teach": {"title": "Core Lesson", "estimated_minutes": 15, "slides": [{"id": "LES-016-S01", "type": "INTRO", "title": "King Movement", "text": "The King takes one careful step and never steps into danger.", "parent_prompt": "Introduce king movement.", "diagram_id": "DGM-104-01", "diagram_url": "assets/DGM-104-01.svg", "visual": {"diagram_id": "DGM-104-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)", "diagram_alt": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)"}, {"id": "LES-016-S02", "type": "DIAGRAM", "title": "Basic movement", "text": "Use the board to explore king movement.", "parent_prompt": "Guide the basic movement.", "diagram_id": "DGM-104-01", "diagram_url": "assets/DGM-104-01.svg", "visual": {"diagram_id": "DGM-104-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)", "diagram_alt": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)"}, {"id": "LES-016-S03", "type": "DIAGRAM", "title": "Capture", "text": "Use the board to explore king movement.", "parent_prompt": "Guide the capture.", "diagram_id": "DGM-104-02", "diagram_url": "assets/DGM-104-02.svg", "visual": {"diagram_id": "DGM-104-02", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-104-02: A White King next to an unprotected Black Pawn, with a green arrow showing the capture.](../../assets/diagrams/TOP-104/DGM-104-02.svg)", "diagram_alt": "![DGM-104-02: A White King next to an unprotected Black Pawn, with a green arrow showing the capture.](../../assets/diagrams/TOP-104/DGM-104-02.svg)"}, {"id": "LES-016-S04", "type": "DIAGRAM", "title": "Real-game pattern", "text": "Use the board to explore king movement.", "parent_prompt": "Guide the real-game pattern.", "diagram_id": "DGM-104-03", "diagram_url": "assets/DGM-104-03.svg", "visual": {"diagram_id": "DGM-104-03", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)", "diagram_alt": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)"}, {"id": "LES-016-S05", "type": "QUESTION", "title": "Recognition check", "text": "Use the board to explore king movement.", "parent_prompt": "Guide the recognition check.", "diagram_id": "DGM-104-04", "diagram_url": "assets/DGM-104-04.svg", "visual": {"diagram_id": "DGM-104-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-004", "position_version": 1, "position_title": "![DGM-104-04: White King on e4. Black Rook on a5. Highlight the squares around the King.](../../assets/diagrams/TOP-104/DGM-104-04.svg)", "diagram_alt": "![DGM-104-04: White King on e4. Black Rook on a5. Highlight the squares around the King.](../../assets/diagrams/TOP-104/DGM-104-04.svg)"}, {"id": "LES-016-S06", "type": "QUESTION", "title": "Safe capture", "text": "Decide whether the King can capture safely.", "parent_prompt": "Guide the safe-capture check.", "diagram_id": "DGM-104-05", "diagram_url": "assets/DGM-104-05.svg", "visual": {"diagram_id": "DGM-104-05", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-005", "position_version": 1, "position_title": "![DGM-104-05: White King on g2. Black Pawn on h3 (unprotected).](../../assets/diagrams/TOP-104/DGM-104-05.svg)", "diagram_alt": "![DGM-104-05: White King on g2. Black Pawn on h3 (unprotected).](../../assets/diagrams/TOP-104/DGM-104-05.svg)"}, {"id": "LES-016-S07", "type": "QUESTION", "title": "Avoid danger", "text": "Find the square the King must not enter.", "parent_prompt": "Guide the danger-square check.", "diagram_id": "DGM-104-06", "diagram_url": "assets/DGM-104-06.svg", "visual": {"diagram_id": "DGM-104-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)", "diagram_alt": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)"}, {"id": "LES-016-S08", "type": "ASSESSMENT", "title": "Check your progress", "text": "Show that you understand king movement.", "parent_prompt": "Check each success criterion with the board.", "diagram_id": "DGM-104-06", "diagram_url": "assets/DGM-104-06.svg", "visual": {"diagram_id": "DGM-104-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-KING-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)", "diagram_alt": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)"}]}, "continue_teaching": {"title": "Continue Teaching", "estimated_minutes": 0, "groups": []}, "full_guide": {"title": "Parent Full Guide", "sections": [{"id": "LES-016-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-104#1#B1", "parent_prompt_trace": "KB-104#1#B1", "text": "- **Topic**: King Movement\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 15 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-005 Squares, TOP-008 King Recognition\n\n**🎯 Today's Goal:**\nYour child will be able to correctly move the King one square at a time, capture with the King, and identify which squares are safe or dangerous.\n\n**✅ Lesson Success Criteria:**\n- The child moves the King exactly one square in any direction.\n- The child correctly captures an enemy piece with the King.\n- The child refuses to move the King onto a square attacked by an enemy.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-016-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-104#2#B1", "parent_prompt_trace": "KB-104#2#B1", "text": "The King is the most important piece in chess, but it is a slow mover. It can only move one square at a time in any direction (forward, backward, left, right, or diagonally). The King captures the same way it moves: by stepping onto the square occupied by an enemy piece. However, there is a special rule: the King is never allowed to move to a square where an enemy piece could capture it."}, {"id": "LES-016-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-104#3#B1", "parent_prompt_trace": "KB-104#3#B1", "text": "Before a child can understand how to win the game (Checkmate), they must first master how the King moves and exactly where it is allowed to go. Because the King cannot move into danger, its movement rules are unique compared to every other piece."}, {"id": "LES-016-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-104#4#B1", "parent_prompt_trace": "KB-104#4#B1", "text": "- **Requires:** TOP-008 (King Recognition), TOP-005 (Squares)\n- **Unlocks:** TOP-019 (Check), TOP-022 (Castling), TOP-105 (Queen Movement)"}, {"id": "LES-016-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-104#5#B1", "parent_prompt_trace": "KB-104#5#B1", "text": "The King's movement is mechanically simple but conceptually tricky due to the \"safety rule.\" \nMechanically, the King steps exactly one square to any adjacent square. If an enemy piece is on that adjacent square, the King can capture it by removing the enemy and taking its place.\nConceptually, the King has a severe restriction: it cannot commit \"suicide.\" If moving to a square would place the King in the path of an enemy attack, that move is illegal. A direct consequence of this rule is that **two Kings can never stand next to each other**. If they did, they would be attacking each other, meaning the one who just moved stepped into danger!"}, {"id": "LES-016-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-104#6#B1", "parent_prompt_trace": "KB-104#6#B1", "text": "1. **Clear the Board:** Start with a completely empty board. Place the White King in the center.\n2. **The Step Demonstration:** Slowly move the King one square forward. Say, \"The King takes one careful step.\" Move it back, then take one step diagonally. \n3. **The Finger Trace:** Have your child put their finger on the King, and ask them to tap every square the King is allowed to step to right now. (They should tap the 8 surrounding squares).\n4. **Introduce Danger:** Place a Black pawn near the King so that it attacks a square next to the King. Ask the child to move the King. If they try to move to the attacked square, stop them with a gentle \"Uh oh!\" and explain the safety rule.\n5. **The Two Kings Rule:** Place the Black King on the board, two squares away from the White King. Ask the child to move the White King right next to the Black King. When they do, act like a referee blowing a whistle! Explain that Kings have a force field and can never touch."}, {"id": "LES-016-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-104#7#B1", "parent_prompt_trace": "KB-104#7#B1", "text": "**The Old Wise King:** \nThe King is very old, very wise, and wearing a heavy gold crown. Because his crown is so heavy and he is so old, he cannot run. He can only take one slow, careful step at a time. Because he is the leader of the kingdom, he is also very cautious—he will never step onto a square if a bad guy is watching it!"}, {"id": "LES-016-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-104#8#B1", "parent_prompt_trace": "KB-104#8#B1", "text": "Even though the King is slow, in the \"Endgame\" (when most pieces have been captured), the King becomes a powerful fighter! Without many enemies around to trap him, the old King marches up the board to help his army win."}, {"id": "LES-016-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1 — Basic Concept", "source_trace": "KB-104#9#B1", "parent_prompt_trace": "KB-104#9#B1", "text": "*The King can step one square in any direction.*", "diagram_id": "DGM-104-01", "diagram_url": "assets/DGM-104-01.svg", "position_id": "POS-KING-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)", "diagram_alt": "![DGM-104-01: A White King in the center of the board with green arrows pointing to all 8 adjacent squares.](../../assets/diagrams/TOP-104/DGM-104-01.svg)"}, {"id": "LES-016-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-104#10#B1", "parent_prompt_trace": "KB-104#10#B1", "text": "The King moves by picking a square right next to it and stepping there. It does not jump. If one of your own pieces is on the square next to the King, the King is blocked and cannot move there. If an enemy piece is on a square next to the King (and no other enemy is protecting it), the King can capture it!"}, {"id": "LES-016-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-104#11#B1", "parent_prompt_trace": "KB-104#11#B1", "text": "*The King captures just like it moves—by taking one step onto the enemy's square.*", "diagram_id": "DGM-104-02", "diagram_url": "assets/DGM-104-02.svg", "position_id": "POS-KING-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-104-02: A White King next to an unprotected Black Pawn, with a green arrow showing the capture.](../../assets/diagrams/TOP-104/DGM-104-02.svg)", "diagram_alt": "![DGM-104-02: A White King next to an unprotected Black Pawn, with a green arrow showing the capture.](../../assets/diagrams/TOP-104/DGM-104-02.svg)"}, {"id": "LES-016-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-104#12#B1", "parent_prompt_trace": "KB-104#12#B1", "text": "*In a real game, the King has to be careful. Here, the King cannot move forward because of its own pieces, and cannot move left because an enemy is watching those squares.*", "diagram_id": "DGM-104-03", "diagram_url": "assets/DGM-104-03.svg", "position_id": "POS-KING-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)", "diagram_alt": "![DGM-104-03: A King trying to escape, but blocked by its own Pawns on one side and an enemy attack on the other.](../../assets/diagrams/TOP-104/DGM-104-03.svg)"}, {"id": "LES-016-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-104#13#B1", "parent_prompt_trace": "KB-104#13#B1", "text": "- **Moving two squares:** Children sometimes get excited and try to slide the King like a Rook.\n- **Ignoring danger:** The most common mistake is moving the King onto a square that an enemy piece is attacking.\n- **Kings touching:** Children will often try to capture the enemy King with their own King.\n\n> **🧑‍🏫 Coach Tip:**\n> If your child moves the King into danger, don't say \"Illegal move!\" Instead, gasp playfully and say, \"Oh no! The bad guy is watching that square! The King is too smart to step there. Try another step!\""}, {"id": "LES-016-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-104#14#B1", "parent_prompt_trace": "KB-104#14#B1", "text": "Spend the most time on the concept of \"danger squares.\" Moving the piece one square is easy; looking around the board to see if that square is safe requires a lot of cognitive effort for a 6-year-old. Be extremely patient.\n\n> **🧑‍🏫 Coach Tip:**\n> Use your hands to physically cover the \"danger squares\" on the board when the child is first learning, physically blocking them from making an illegal move. Then, gradually remove your hands and let them spot the danger themselves."}, {"id": "LES-016-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-104#15#B1", "parent_prompt_trace": "KB-104#15#B1", "text": "**Q: My child keeps trying to capture the other King. What do I do?**\nA: Remind them of the \"Force Field\" rule. Kings have magical force fields that push each other away. They can never stand next to each other, so they can never capture each other.\n\n**Q: Do we say 'Check' when teaching this?**\nA: Not yet! Right now, we only call it \"danger.\" \"Check\" involves a whole new set of rules (escaping, blocking, capturing the attacker). We will learn Check in a later lesson.\n\n**Q: Can the King move backwards?**\nA: Yes! The King can move backwards, forwards, sideways, and diagonally."}, {"id": "LES-016-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-104#16#B1", "parent_prompt_trace": "KB-104#16#B1", "text": "**The Minefield Game:**\nTake an empty board and place the White King on `e1`. Place 4 or 5 Black pieces scattered around the board (Pawns and Rooks work best). Put a piece of candy or a small toy on the other side of the board (e.g., `e8`). Take turns moving the King one square at a time, trying to reach the prize without ever stepping on a \"danger square\" (a square attacked by the Black pieces). Work together to find the safe path!"}, {"id": "LES-016-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-104#17#B1", "parent_prompt_trace": "KB-104#17#B1", "text": "**The Force Field Test:**\nPlace the White King on `d4`. Hold the Black King in your hand. Try to place the Black King on `d5` (right next to the White King). Ask your child, \"Can I put my King here?\" Encourage them to yell \"No! Force Field!\" Try placing your King on `e5` (diagonal). \"How about here?\" (No!). Then place it on `d6` (one empty square between them). \"How about here?\" (Yes!). This physically reinforces the two-Kings rule."}, {"id": "LES-016-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-104#18#B1", "parent_prompt_trace": "KB-104#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which of the highlighted squares are SAFE for the King to step on?\n**Answer:** The King can move to d3, e3, f3, d4, and f4. It CANNOT move to d5, e5, or f5 because the Black Rook is watching that rank.\n\n### 🟡 Application (Medium)\n\n**Question:** Can the White King capture the Black Pawn?\n**Answer:** Yes! The King takes one step diagonally to capture the unprotected pawn.\n\n### 🔴 Challenge (Hard)\n\n**Question:** The White King wants to move. Where can he go?\n**Answer:** Nowhere! He is blocked by his own pawns forward, and he cannot move to d1 or f1 right now. (Note: He is also in danger on e1, but we just want to focus on his inability to step anywhere safe).", "diagram_id": "DGM-104-06", "diagram_url": "assets/DGM-104-06.svg", "position_id": "POS-KING-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)", "diagram_alt": "![DGM-104-06: White King on e1. White Pawns on d2, e2, f2. Black Bishop on a5 (attacking d2 and e1).](../../assets/diagrams/TOP-104/DGM-104-06.svg)"}, {"id": "LES-016-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-104#19#B1", "parent_prompt_trace": "KB-104#19#B1", "text": "- **Lichess Practice:** [The Pieces - King](https://lichess.org/learn#/3) (Interactive drills for kids)."}, {"id": "LES-016-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-104#20#B1", "parent_prompt_trace": "KB-104#20#B1", "text": "- **Prerequisites:** TOP-005 Squares, TOP-008 King (Recognition)\n- **Next Steps:** TOP-105 Queen Movement, TOP-019 Check"}, {"id": "LES-016-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-104#21#B1", "parent_prompt_trace": "KB-104#21#B1", "text": "- [ ] Do I understand that the King only moves one square?\n- [ ] Do I understand that the King cannot step into an attacked square?\n- [ ] Do I understand that two Kings can never touch?\n- [ ] Did we complete the \"Minefield Game\" together?\n- [ ] Can my child explain why the King cannot step next to another King?"}]}}</script><script id="task-data" type="application/json">{"schema_version": 1, "lesson_id": "LES-016", "tasks": [{"schema_version": 1, "task_id": "PZL-016-01", "kb_id": "KB-104", "lesson_id": "LES-016", "task_type": "PHYSICAL_BOARD_ACTION", "source_type": "PCA_CURRICULUM", "prompt": "Show the basic movement pattern for the King.", "hint": "One careful step, always safe.", "answer": {"kind": "TEXT_RUBRIC", "text": "Moves the King exactly one square in any direction."}, "difficulty": "FOUNDATION", "source_trace": {"source_path": "curriculum/lessons/LES-016.yaml", "source_sha256": "e529b83340a604c61137d151870f8488c624650d5005e09ab167a552a5d20af4", "field": "exercises", "anchor": "EX-016-01"}, "validation": {"status": "VALID", "validator_version": 1}}, {"schema_version": 1, "task_id": "PZL-016-02", "kb_id": "KB-104", "lesson_id": "LES-016", "task_type": "PHYSICAL_BOARD_ACTION", "source_type": "PCA_CURRICULUM", "prompt": "Demonstrate a legal capture.", "hint": "Capture only according to the movement rule.", "answer": {"kind": "TEXT_RUBRIC", "text": "Captures an unprotected adjacent enemy piece."}, "difficulty": "FOUNDATION", "source_trace": {"source_path": "curriculum/lessons/LES-016.yaml", "source_sha256": "e529b83340a604c61137d151870f8488c624650d5005e09ab167a552a5d20af4", "field": "exercises", "anchor": "EX-016-02"}, "validation": {"status": "VALID", "validator_version": 1}}, {"schema_version": 1, "task_id": "PZL-016-03", "kb_id": "KB-104", "lesson_id": "LES-016", "task_type": "PHYSICAL_BOARD_ACTION", "source_type": "PCA_CURRICULUM", "prompt": "Identify an illegal move in the challenge position.", "hint": "Check the path and landing square.", "answer": {"kind": "TEXT_RUBRIC", "text": "Refuses moves onto enemy-attacked squares."}, "difficulty": "FOUNDATION", "source_trace": {"source_path": "curriculum/lessons/LES-016.yaml", "source_sha256": "e529b83340a604c61137d151870f8488c624650d5005e09ab167a552a5d20af4", "field": "exercises", "anchor": "EX-016-03"}, "validation": {"status": "VALID", "validator_version": 1}}, {"schema_version": 1, "task_id": "PZL-016-04", "kb_id": "KB-104", "lesson_id": "LES-016", "task_type": "EXPLAIN_POSITION", "source_type": "PCA_CURRICULUM", "prompt": "Explain the movement rule in your own words.", "hint": "The King takes one careful step and never steps into danger.", "answer": {"kind": "TEXT_RUBRIC", "text": "One careful step, always safe."}, "difficulty": "FOUNDATION", "source_trace": {"source_path": "curriculum/lessons/LES-016.yaml", "source_sha256": "e529b83340a604c61137d151870f8488c624650d5005e09ab167a552a5d20af4", "field": "exercises", "anchor": "EX-016-04"}, "validation": {"status": "VALID", "validator_version": 1}}]}</script><script src="assets/classroom.js"></script></body></html>
