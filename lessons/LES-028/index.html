<script id="lesson-data" type="application/json">{"lesson_id": "LES-028", "kb_id": "KB-028", "topic_id": "TOP-028", "unit_id": "UNT-002", "sequence": 1, "objective": "**🎯 Today's Goal:**\nYour child will learn one of the most devastating magic tricks in chess: attacking two different things at the exact same time!", "success_criteria": "**✅ Lesson Success Criteria:**\n- The child understands that the opponent is only allowed to make one move per turn.\n- The child can set up a situation where one piece points at two targets.\n- The child knows that the Knight is the undisputed master of the Fork.", "source_traces": {"objective": "KB-028#1#B2", "success_criteria": "KB-028#1#B3"}, "prerequisites": [], "readiness_checks": [], "parent_notes": [], "parent_reference": [{"ordinal": 1, "section_id": "AT_A_GLANCE", "heading": "1. At a Glance", "source_trace": "KB-028#1", "content": "- **Topic**: The Fork (The Two-Headed Dragon)\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 20 min\n- **Piece/concept type**: Tactic\n- **Prerequisites**: TOP-096 Threat, TOP-014 Piece Values\n\n**🎯 Today's Goal:**\nYour child will learn one of the most devastating magic tricks in chess: attacking two different things at the exact same time!\n\n**✅ Lesson Success Criteria:**\n- The child understands that the opponent is only allowed to make one move per turn.\n- The child can set up a situation where one piece points at two targets.\n- The child knows that the Knight is the undisputed master of the Fork.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"ordinal": 2, "section_id": "DEFINITION", "heading": "2. Definition", "source_trace": "KB-028#2", "content": "A **Fork** (also called a Double Attack) happens when a single piece attacks two or more enemy pieces simultaneously. Because the rules of chess dictate that a player can only move one piece per turn, it is usually impossible to save both attacked pieces. The attacker is guaranteed to capture at least one of the targets on the next turn. While any piece (even a pawn or a King) can deliver a fork, the Knight is famous for it because its unique L-shaped jump allows it to attack pieces in ways they cannot attack back."}, {"ordinal": 3, "section_id": "WHY_IT_MATTERS", "heading": "3. Why It Matters", "source_trace": "KB-028#3", "content": "In TOP-096 (Threat), we learned how to spot a single \"Biting Dog.\" But what if two biting dogs attack two different pieces at once? The brain panics! The Fork is the foundational tactic of winning material in chess. Beginners play \"one-on-one\" chess, moving a piece to attack a single target. The opponent simply moves the target away. The Fork teaches the child to think geometrically, finding the exact intersection where one piece can terrorize two targets at once."}, {"ordinal": 4, "section_id": "BEFORE_YOU_TEACH", "heading": "4. Before You Teach (Graph)", "source_trace": "KB-028#4", "content": "- **Requires:** TOP-096 (Threat), TOP-014 (Piece Values)\n- **Unlocks:** None"}, {"ordinal": 5, "section_id": "PARENT_UNDERSTANDS", "heading": "5. Parent Understands", "source_trace": "KB-028#5", "content": "The math of a fork relies on the turn-based nature of chess. \nIf your Knight attacks their Queen and their Rook at the same time, it's their turn. \nThey look at the board. They realize their Queen (9 points) is more valuable than their Rook (5 points). They use their one move to save the Queen. \nOn your turn, you eat the Rook! \nYou forced them into an impossible choice. The absolute best fork is when one of the targets is the King (a Check). Because they *must* save the King legally, whatever else you are attacking is completely doomed."}, {"ordinal": 6, "section_id": "HOW_TO_TEACH_IT", "heading": "6. How to Teach It", "source_trace": "KB-028#6", "content": "1. **The Math Problem:** \"If I attack your Queen, what do you do? You run away. But wait! You only get one move per turn, right? What if I attack your Queen AND your Castle at the exact same time?\"\n2. **The Dinner Fork:** \"Think about a fork you eat spaghetti with. It has a handle, but at the end, it splits into pointy prongs! In chess, your piece is the handle, and its lasers are the prongs! We want to poke two things at once!\"\n3. **The Ninja Jump:** \"The Ninja Horse (Knight) is the best at forking! Because he jumps in an L-shape, he can point his sword at a Castle and a Queen, and neither of them can shoot him back!\"\n4. **The Royal Fork:** \"The best fork in the world is when one prong pokes the King, and the other prong pokes the Queen! The King yells 'Save me!' and the poor Queen gets eaten!\""}, {"ordinal": 7, "section_id": "STORY_ANALOGY_MEMORY", "heading": "7. Teaching Story / Analogy / Memory Hint", "source_trace": "KB-028#7", "content": "**The Two-Headed Dragon:**\nImagine a Dragon with two heads. He walks into the forest and sees two tasty Knights running away. One Knight runs left, and the other Knight runs right. A normal dragon only has one head, so he has to choose one Knight to chase. But the Two-Headed Dragon just stretches his necks out and grabs BOTH of them at the same time! When you make a Fork in chess, you are turning your piece into a Two-Headed Dragon. The opponent only has time to save one guy, and the dragon eats the other one!"}, {"ordinal": 8, "section_id": "DID_YOU_KNOW", "heading": "8. Did You Know? 🎓", "source_trace": "KB-028#8", "content": "When a Knight forks the enemy King, Queen, and a Rook all at the exact same time, it is known in chess clubs as a \"Family Fork\"! (Because it attacks the whole Royal Family!)."}, {"ordinal": 9, "section_id": "BOARD_DIAGRAM_1", "heading": "9. Board Diagram 1 — Basic Concept", "source_trace": "KB-028#9", "content": "![DGM-028-01: A White Knight on c7. Red arrows point to the Black King on e8 and the Black Rook on a8.](../../assets/diagrams/TOP-028/DGM-028-01.svg)\n*The Royal Fork! The Knight's L-shape perfectly targets two pieces at once. Black MUST move the King, meaning the Rook is doomed.*"}, {"ordinal": 10, "section_id": "HOW_IT_WORKS", "heading": "10. How It Works", "source_trace": "KB-028#10", "content": "A fork only works if the piece delivering the fork is safe. If you move your Knight to fork the King and Queen, but an enemy pawn can just eat your Knight, it's not a fork, it's a blunder!"}, {"ordinal": 11, "section_id": "BOARD_DIAGRAM_2", "heading": "11. Board Diagram 2 — Practical Example", "source_trace": "KB-028#11", "content": "![DGM-028-02: A White pawn on d5. It is diagonally attacking a Black Knight on e6 and a Black Bishop on c6.](../../assets/diagrams/TOP-028/DGM-028-02.svg)\n*The Pawn Fork. Yes, even pawns can be two-headed dragons! If Black saves the Knight, the pawn eats the Bishop.*"}, {"ordinal": 12, "section_id": "REAL_GAME_EXAMPLE", "heading": "12. Real Game Example", "source_trace": "KB-028#12", "content": "![DGM-028-03: A Black Queen on e4. Arrows point in four different directions, attacking a Rook, a Bishop, a pawn, and delivering check to the King.](../../assets/diagrams/TOP-028/DGM-028-03.svg)\n*The Queen Fork. The Queen is so powerful she can fork 3 or 4 things at once! But she must be careful not to get eaten by smaller pieces.*"}, {"ordinal": 13, "section_id": "COMMON_MISTAKES", "heading": "13. Common Mistakes", "source_trace": "KB-028#13", "content": "- **The \"Suicide\" Fork:** A child spots a beautiful fork, but the square they jump to is heavily guarded. They play the move, yell \"Fork!\", and immediately get their piece captured. Remind them: \"The Two-Headed Dragon has to stand on a safe square!\"\n- **Forgetting the pawn fork:** Kids get so obsessed with Knights that they forget pawns are the cheapest, deadliest forks on the board. A 1-point pawn forking two 3-point minor pieces is devastating.\n\n> **🧑‍🏫 Coach Tip:**\n> When your child successfully executes a fork against you, groan loudly. Act incredibly frustrated that you can only save one piece. Kids love seeing that their move mathematically broke the rules of the universe for you."}, {"ordinal": 14, "section_id": "TEACHING_NOTES", "heading": "14. Teaching Notes", "source_trace": "KB-028#14", "content": "This relies heavily on TOP-014 (Piece Values) because when the opponent is forked, they have to calculate which piece is more valuable to save!\n\n> **🧑‍🏫 Coach Tip:**\n> Knights love to fork from the `c7` or `f7` squares because they are close to the King and Rooks. Teach your child to always protect those squares!"}, {"ordinal": 15, "section_id": "PARENT_FAQ", "heading": "15. Parent FAQ", "source_trace": "KB-028#15", "content": "**Q: Can a King deliver a fork?**\nA: Yes! In the endgame, a King can step between two enemy pawns or two enemy Knights, attacking them both at the same time."}, {"ordinal": 16, "section_id": "PRACTICE_TOGETHER", "heading": "16. Practice Together", "source_trace": "KB-028#16", "content": "**The Dragon Drill:**\nClear the board. Give your child a White Knight. \nPut a Black King on `e8` and a Black Queen on `e4`. \nTell them: \"Find the square where the Two-Headed Dragon can bite both of them!\"\nWatch them hop the Knight around until they find `c7` (wait, no, `c7` hits `e8`, but `e4`? No. The correct squares to fork `e8` and `e4` are `f6` or `d6` or `c5`. Let's use `d6`! From `d6`, the Knight hits `e8` and `e4`).\nLet them hop to `d6` and yell \"Fork!\""}, {"ordinal": 17, "section_id": "COACH_CHALLENGE", "heading": "17. Coach Challenge ⭐", "source_trace": "KB-028#17", "content": "**The Choice:**\nSet up a pawn fork for your child. Their pawn is attacking your Queen and your Castle. \nAsk: \"Which piece are you hoping I save?\"\n(They should say: \"The Castle, so I can eat the Queen!\").\nMove your Queen away.\nAsk: \"What do you do now?\"\n(Eat the Castle!)."}, {"ordinal": 18, "section_id": "TRY_IT_YOURSELF", "heading": "18. Try It Yourself", "source_trace": "KB-028#18", "content": "### 🟢 Recognition (Easy)\n![DGM-028-04: A Knight pointing at two different Castles at the same time.](../../assets/diagrams/TOP-028/DGM-028-04.svg)\n**Question:** What do we call it when one piece attacks two pieces at the same time?\n**Answer:** A Fork! (Or a double attack).\n\n### 🟡 Application (Medium)\n![DGM-028-05: A White pawn forks a Black Knight and a Black Bishop.](../../assets/diagrams/TOP-028/DGM-028-05.svg)\n**Question:** You are Black. You only have one turn! You can't save both. Which piece should you save?\n**Answer:** It's a trick question! They are both worth 3 points! Just pick your favorite one to save, and say goodbye to the other one.\n\n### 🔴 Challenge (Hard)\n![DGM-028-06: A White Knight lands on c7, checking the Black King and attacking the Black Rook. BUT, a Black Queen is staring right at c7.](../../assets/diagrams/TOP-028/DGM-028-06.svg)\n**Question:** White yelled \"FORK!\" But what is Black going to do?\n**Answer:** Black is going to eat the Knight with their Queen! It was a suicide fork because the square wasn't safe!"}, {"ordinal": 19, "section_id": "CONTINUE_LEARNING", "heading": "19. Continue Learning", "source_trace": "KB-028#19", "content": "- **Lichess Practice:** [Knight Forks](https://lichess.org/practice/basic-tactics/the-fork/QjAaFq9b/QzH8J4zF) (Solve these puzzles to train your brain to see the invisible L-shapes!)."}, {"ordinal": 20, "section_id": "RELATED_TOPICS", "heading": "20. Related Topics", "source_trace": "KB-028#20", "content": "- **Prerequisites:** TOP-096 Threat, TOP-014 Piece Values\n- **Next Steps:** None"}, {"ordinal": 21, "section_id": "PARENT_CONFIDENCE_CHECK", "heading": "21. Parent Confidence Check ✅", "source_trace": "KB-028#21", "content": "- [ ] Do I understand that a Fork exploits the \"one move per turn\" rule?\n- [ ] Do I know why a fork involving a Check is the most powerful?\n- [ ] Do I know that Pawns can deliver forks too?\n- [ ] Did we practice the \"Dragon Drill\"?\n\n---"}], "slides": [{"id": "LES-028-S001", "role": "KB_CONTENT", "type": "S s doomed.*", "diagram_id": "DGM-028-01", "diagram_url": "assets/DGM-028-01.svg", "position_id": "POS-FORK-KNIGHT-001", "position_version": 1, "position_title": "Royal knight fork from c7", "diagram_alt": "Royal knight fork from c7"}, {"id": "LES-028-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-028#10#B1", "parent_prompt_trace": "KB-028#10#B1", "text": "A fork only works if the piece delivering the fork is safe. If you move your Knight to fork the King and Queen, but an enemy pawn can just eat your Knight, it's not a fork, it's a blunder!"}, {"id": "LES-028-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-028#11#B1", "parent_prompt_trace": "KB-028#11#B1", "text": "*The Pawn Fork. Yes, even pawns can be two-headed dragons! If Black saves the Knight, the pawn eats the Bishop.*", "diagram_id": "DGM-028-02", "diagram_url": "assets/DGM-028-02.svg", "position_id": "POS-FORK-PAWN-001", "position_version": 1, "position_title": "Pawn fork from d5", "diagram_alt": "Pawn fork from d5"}, {"id": "LES-028-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-028#12#B1", "parent_prompt_trace": "KB-028#12#B1", "text": "*The Queen Fork. The Queen is so powerful she can fork 3 or 4 things at once! But she must be careful not to get eaten by smaller pieces.*"}, {"id": "LES-028-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-028#13#B1", "parent_prompt_trace": "KB-028#13#B1", "text": "- **The \"Suicide\" Fork:** A child spots a beautiful fork, but the square they jump to is heavily guarded. They play the move, yell \"Fork!\", and immediately get their piece captured. Remind them: \"The Two-Headed Dragon has to stand on a safe square!\"\n- **Forgetting the pawn fork:** Kids get so obsessed with Knights that they forget pawns are the cheapest, deadliest forks on the board. A 1-point pawn forking two 3-point minor pieces is devastating.\n\n> **🧑‍🏫 Coach Tip:**\n> When your child successfully executes a fork against you, groan loudly. Act incredibly frustrated that you can only save one piece. Kids love seeing that their move mathematically broke the rules of the universe for you."}, {"id": "LES-028-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-028#14#B1", "parent_prompt_trace": "KB-028#14#B1", "text": "This relies heavily on TOP-014 (Piece Values) because when the opponent is forked, they have to calculate which piece is more valuable to save!\n\n> **🧑‍🏫 Coach Tip:**\n> Knights love to fork from the `c7` or `f7` squares because they are close to the King and Rooks. Teach your child to always protect those squares!"}, {"id": "LES-028-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-028#15#B1", "parent_prompt_trace": "KB-028#15#B1", "text": "**Q: Can a King deliver a fork?**\nA: Yes! In the endgame, a King can step between two enemy pawns or two enemy Knights, attacking them both at the same time."}, {"id": "LES-028-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-028#16#B1", "parent_prompt_trace": "KB-028#16#B1", "text": "**The Dragon Drill:**\nClear the board. Give your child a White Knight. \nPut a Black King on `e8` and a Black Queen on `e4`. \nTell them: \"Find the square where the Two-Headed Dragon can bite both of them!\"\nWatch them hop the Knight around until they find `c7` (wait, no, `c7` hits `e8`, but `e4`? No. The correct squares to fork `e8` and `e4` are `f6` or `d6` or `c5`. Let's use `d6`! From `d6`, the Knight hits `e8` and `e4`).\nLet them hop to `d6` and yell \"Fork!\""}, {"id": "LES-028-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-028#17#B1", "parent_prompt_trace": "KB-028#17#B1", "text": "**The Choice:**\nSet up a pawn fork for your child. Their pawn is attacking your Queen and your Castle. \nAsk: \"Which piece are you hoping I save?\"\n(They should say: \"The Castle, so I can eat the Queen!\").\nMove your Queen away.\nAsk: \"What do you do now?\"\n(Eat the Castle!)."}, {"id": "LES-028-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-028#18#B1", "parent_prompt_trace": "KB-028#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** What do we call it when one piece attacks two pieces at the same time?\n**Answer:** A Fork! (Or a double attack).\n\n### 🟡 Application (Medium)\n\n**Question:** You are Black. You only have one turn! You can't save both. Which piece should you save?\n**Answer:** It's a trick question! They are both worth 3 points! Just pick your favorite one to save, and say goodbye to the other one.\n\n### 🔴 Challenge (Hard)\n\n**Question:** White yelled \"FORK!\" But what is Black going to do?\n**Answer:** Black is going to eat the Knight with their Queen! It was a suicide fork because the square wasn't safe!", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}, {"id": "LES-028-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-028#19#B1", "parent_prompt_trace": "KB-028#19#B1", "text": "- **Lichess Practice:** [Knight Forks](https://lichess.org/practice/basic-tactics/the-fork/QjAaFq9b/QzH8J4zF) (Solve these puzzles to train your brain to see the invisible L-shapes!)."}, {"id": "LES-028-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-028#20#B1", "parent_prompt_trace": "KB-028#20#B1", "text": "- **Prerequisites:** TOP-096 Threat, TOP-014 Piece Values\n- **Next Steps:** None"}, {"id": "LES-028-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-028#21#B1", "parent_prompt_trace": "KB-028#21#B1", "text": "- [ ] Do I understand that a Fork exploits the \"one move per turn\" rule?\n- [ ] Do I know why a fork involving a Check is the most powerful?\n- [ ] Do I know that Pawns can deliver forks too?\n- [ ] Did we practice the \"Dragon Drill\"?"}], "task_references": ["PZL-028-01", "PZL-028-02", "PZL-028-03", "PZL-028-04", "PZL-028-05", "PZL-028-06"], "diagram_references": ["DGM-028-01", "DGM-028-02", "DGM-028-03", "DGM-028-04"], "diagram_deferrals": [{"diagram_target": "DGM-028-05", "reason": "OUT_OF_SCOPE_PHASE_7", "source_target": "../../assets/diagrams/TOP-028/DGM-028-05.svg"}, {"diagram_target": "DGM-028-06", "reason": "OUT_OF_SCOPE_PHASE_7", "source_target": "../../assets/diagrams/TOP-028/DGM-028-06.svg"}], "assessment_reference": "ASM-028", "deferred_topics": [{"topic": "family_forks", "defer_to": "later_advanced_tactics"}], "teach_slides": [{"id": "LES-028-S01", "type": "INTRO", "title": "The Two-Headed Dragon", "text": "One piece can attack two targets at the same time.", "parent_prompt": "Ask what would happen if one piece attacked two targets at once.", "diagram_id": "DGM-028-01", "diagram_url": "assets/DGM-028-01.svg", "visual": {"diagram_id": "DGM-028-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-KNIGHT-001", "position_version": 1, "position_title": "Royal knight fork from c7", "diagram_alt": "Royal knight fork from c7"}, {"id": "LES-028-S02", "type": "EXPLAIN", "title": "One piece two targets", "text": "A fork is a double attack by one piece.", "parent_prompt": "Emphasize that the opponent gets only one move.", "diagram_id": "DGM-028-01", "diagram_url": "assets/DGM-028-01.svg", "visual": {"diagram_id": "DGM-028-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-KNIGHT-001", "position_version": 1, "position_title": "Royal knight fork from c7", "diagram_alt": "Royal knight fork from c7"}, {"id": "LES-028-S03", "type": "DIAGRAM", "title": "The royal fork", "text": "The knight checks the king and attacks the rook.", "parent_prompt": "Point from the knight to the king and rook and require the king response first.", "diagram_id": "DGM-028-01", "diagram_url": "assets/DGM-028-01.svg", "visual": {"diagram_id": "DGM-028-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-KNIGHT-001", "position_version": 1, "position_title": "Royal knight fork from c7", "diagram_alt": "Royal knight fork from c7"}, {"id": "LES-028-S04", "type": "DIAGRAM", "title": "Pawns fork too", "text": "The pawn attacks two pieces at once.", "parent_prompt": "Ask which of the knight or bishop Black would save.", "diagram_id": "DGM-028-02", "diagram_url": "assets/DGM-028-02.svg", "visual": {"diagram_id": "DGM-028-02", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-PAWN-001", "position_version": 1, "position_title": "Pawn fork from d5", "diagram_alt": "Pawn fork from d5"}, {"id": "LES-028-S05", "type": "DIAGRAM", "title": "A powerful double attack", "text": "A queen can attack several targets at once.", "parent_prompt": "Trace the queen's different attack lines and count the targets.", "diagram_id": "DGM-028-03", "diagram_url": "assets/DGM-028-03.svg", "visual": {"diagram_id": "DGM-028-03", "layout": "VISUAL_60", "animation": "NONE"}}, {"id": "LES-028-S06", "type": "PHYSICAL_ACTIVITY", "title": "Dragon Drill", "text": "Find the square that bites both targets.", "parent_prompt": "Run the Dragon Drill with the knight moving to d6 to attack the king on e8 and queen on e4.", "visual": {"sticker": "detective", "layout": "TEXT_ONLY", "sticker_url": "assets/detective.svg", "sticker_alt": "Chess detective searching for setup clues"}}, {"id": "LES-028-S07", "type": "DIAGRAM", "title": "Name the tactic", "text": "What do we call one piece attacking two pieces?", "parent_prompt": "Ask the recognition question before naming the tactic.", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "visual": {"diagram_id": "DGM-028-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}, {"id": "LES-028-S08", "type": "QUESTION", "title": "Is the dragon safe?", "text": "Check whether the forking piece can be captured.", "parent_prompt": "Ask why a beautiful-looking fork can still fail.", "reveal": "A fork fails if the opponent can safely capture the forking piece.", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "visual": {"diagram_id": "DGM-028-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}, {"id": "LES-028-S09", "type": "ASSESSMENT", "title": "Fork detective", "text": "Find both targets and explain the opponent's choice.", "parent_prompt": "Use ASM-028 without directional coaching.", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "visual": {"diagram_id": "DGM-028-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}, {"id": "LES-028-S10", "type": "REVIEW", "title": "One piece two targets", "text": "Spot both targets and check that the attacker is safe.", "parent_prompt": "Complete the parent confidence check and repeat the memory phrase.", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "visual": {"diagram_id": "DGM-028-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}], "guide_sections": [{"id": "LES-028-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-028#1#B1", "parent_prompt_trace": "KB-028#1#B1", "text": "- **Topic**: The Fork (The Two-Headed Dragon)\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 20 min\n- **Piece/concept type**: Tactic\n- **Prerequisites**: TOP-096 Threat, TOP-014 Piece Values\n\n**🎯 Today's Goal:**\nYour child will learn one of the most devastating magic tricks in chess: attacking two different things at the exact same time!\n\n**✅ Lesson Success Criteria:**\n- The child understands that the opponent is only allowed to make one move per turn.\n- The child can set up a situation where one piece points at two targets.\n- The child knows that the Knight is the undisputed master of the Fork.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-028-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-028#2#B1", "parent_prompt_trace": "KB-028#2#B1", "text": "A **Fork** (also called a Double Attack) happens when a single piece attacks two or more enemy pieces simultaneously. Because the rules of chess dictate that a player can only move one piece per turn, it is usually impossible to save both attacked pieces. The attacker is guaranteed to capture at least one of the targets on the next turn. While any piece (even a pawn or a King) can deliver a fork, the Knight is famous for it because its unique L-shaped jump allows it to attack pieces in ways they cannot attack back."}, {"id": "LES-028-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-028#3#B1", "parent_prompt_trace": "KB-028#3#B1", "text": "In TOP-096 (Threat), we learned how to spot a single \"Biting Dog.\" But what if two biting dogs attack two different pieces at once? The brain panics! The Fork is the foundational tactic of winning material in chess. Beginners play \"one-on-one\" chess, moving a piece to attack a single target. The opponent simply moves the target away. The Fork teaches the child to think geometrically, finding the exact intersection where one piece can terrorize two targets at once."}, {"id": "LES-028-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-028#4#B1", "parent_prompt_trace": "KB-028#4#B1", "text": "- **Requires:** TOP-096 (Threat), TOP-014 (Piece Values)\n- **Unlocks:** None"}, {"id": "LES-028-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-028#5#B1", "parent_prompt_trace": "KB-028#5#B1", "text": "The math of a fork relies on the turn-based nature of chess. \nIf your Knight attacks their Queen and their Rook at the same time, it's their turn. \nThey look at the board. They realize their Queen (9 points) is more valuable than their Rook (5 points). They use their one move to save the Queen. \nOn your turn, you eat the Rook! \nYou forced them into an impossible choice. The absolute best fork is when one of the targets is the King (a Check). Because they *must* save the King legally, whatever else you are attacking is completely doomed."}, {"id": "LES-028-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-028#6#B1", "parent_prompt_trace": "KB-028#6#B1", "text": "1. **The Math Problem:** \"If I attack your Queen, what do you do? You run away. But wait! You only get one move per turn, right? What if I attack your Queen AND your Castle at the exact same time?\"\n2. **The Dinner Fork:** \"Think about a fork you eat spaghetti with. It has a handle, but at the end, it splits into pointy prongs! In chess, your piece is the handle, and its lasers are the prongs! We want to poke two things at once!\"\n3. **The Ninja Jump:** \"The Ninja Horse (Knight) is the best at forking! Because he jumps in an L-shape, he can point his sword at a Castle and a Queen, and neither of them can shoot him back!\"\n4. **The Royal Fork:** \"The best fork in the world is when one prong pokes the King, and the other prong pokes the Queen! The King yells 'Save me!' and the poor Queen gets eaten!\""}, {"id": "LES-028-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-028#7#B1", "parent_prompt_trace": "KB-028#7#B1", "text": "**The Two-Headed Dragon:**\nImagine a Dragon with two heads. He walks into the forest and sees two tasty Knights running away. One Knight runs left, and the other Knight runs right. A normal dragon only has one head, so he has to choose one Knight to chase. But the Two-Headed Dragon just stretches his necks out and grabs BOTH of them at the same time! When you make a Fork in chess, you are turning your piece into a Two-Headed Dragon. The opponent only has time to save one guy, and the dragon eats the other one!"}, {"id": "LES-028-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-028#8#B1", "parent_prompt_trace": "KB-028#8#B1", "text": "When a Knight forks the enemy King, Queen, and a Rook all at the exact same time, it is known in chess clubs as a \"Family Fork\"! (Because it attacks the whole Royal Family!)."}, {"id": "LES-028-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1 — Basic Concept", "source_trace": "KB-028#9#B1", "parent_prompt_trace": "KB-028#9#B1", "text": "*The Royal Fork! The Knight's L-shape perfectly targets two pieces at once. Black MUST move the King, meaning the Rook is doomed.*", "diagram_id": "DGM-028-01", "diagram_url": "assets/DGM-028-01.svg", "position_id": "POS-FORK-KNIGHT-001", "position_version": 1, "position_title": "Royal knight fork from c7", "diagram_alt": "Royal knight fork from c7"}, {"id": "LES-028-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-028#10#B1", "parent_prompt_trace": "KB-028#10#B1", "text": "A fork only works if the piece delivering the fork is safe. If you move your Knight to fork the King and Queen, but an enemy pawn can just eat your Knight, it's not a fork, it's a blunder!"}, {"id": "LES-028-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-028#11#B1", "parent_prompt_trace": "KB-028#11#B1", "text": "*The Pawn Fork. Yes, even pawns can be two-headed dragons! If Black saves the Knight, the pawn eats the Bishop.*", "diagram_id": "DGM-028-02", "diagram_url": "assets/DGM-028-02.svg", "position_id": "POS-FORK-PAWN-001", "position_version": 1, "position_title": "Pawn fork from d5", "diagram_alt": "Pawn fork from d5"}, {"id": "LES-028-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-028#12#B1", "parent_prompt_trace": "KB-028#12#B1", "text": "*The Queen Fork. The Queen is so powerful she can fork 3 or 4 things at once! But she must be careful not to get eaten by smaller pieces.*"}, {"id": "LES-028-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-028#13#B1", "parent_prompt_trace": "KB-028#13#B1", "text": "- **The \"Suicide\" Fork:** A child spots a beautiful fork, but the square they jump to is heavily guarded. They play the move, yell \"Fork!\", and immediately get their piece captured. Remind them: \"The Two-Headed Dragon has to stand on a safe square!\"\n- **Forgetting the pawn fork:** Kids get so obsessed with Knights that they forget pawns are the cheapest, deadliest forks on the board. A 1-point pawn forking two 3-point minor pieces is devastating.\n\n> **🧑‍🏫 Coach Tip:**\n> When your child successfully executes a fork against you, groan loudly. Act incredibly frustrated that you can only save one piece. Kids love seeing that their move mathematically broke the rules of the universe for you."}, {"id": "LES-028-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-028#14#B1", "parent_prompt_trace": "KB-028#14#B1", "text": "This relies heavily on TOP-014 (Piece Values) because when the opponent is forked, they have to calculate which piece is more valuable to save!\n\n> **🧑‍🏫 Coach Tip:**\n> Knights love to fork from the `c7` or `f7` squares because they are close to the King and Rooks. Teach your child to always protect those squares!"}, {"id": "LES-028-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-028#15#B1", "parent_prompt_trace": "KB-028#15#B1", "text": "**Q: Can a King deliver a fork?**\nA: Yes! In the endgame, a King can step between two enemy pawns or two enemy Knights, attacking them both at the same time."}, {"id": "LES-028-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-028#16#B1", "parent_prompt_trace": "KB-028#16#B1", "text": "**The Dragon Drill:**\nClear the board. Give your child a White Knight. \nPut a Black King on `e8` and a Black Queen on `e4`. \nTell them: \"Find the square where the Two-Headed Dragon can bite both of them!\"\nWatch them hop the Knight around until they find `c7` (wait, no, `c7` hits `e8`, but `e4`? No. The correct squares to fork `e8` and `e4` are `f6` or `d6` or `c5`. Let's use `d6`! From `d6`, the Knight hits `e8` and `e4`).\nLet them hop to `d6` and yell \"Fork!\""}, {"id": "LES-028-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-028#17#B1", "parent_prompt_trace": "KB-028#17#B1", "text": "**The Choice:**\nSet up a pawn fork for your child. Their pawn is attacking your Queen and your Castle. \nAsk: \"Which piece are you hoping I save?\"\n(They should say: \"The Castle, so I can eat the Queen!\").\nMove your Queen away.\nAsk: \"What do you do now?\"\n(Eat the Castle!)."}, {"id": "LES-028-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-028#18#B1", "parent_prompt_trace": "KB-028#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** What do we call it when one piece attacks two pieces at the same time?\n**Answer:** A Fork! (Or a double attack).\n\n### 🟡 Application (Medium)\n\n**Question:** You are Black. You only have one turn! You can't save both. Which piece should you save?\n**Answer:** It's a trick question! They are both worth 3 points! Just pick your favorite one to save, and say goodbye to the other one.\n\n### 🔴 Challenge (Hard)\n\n**Question:** White yelled \"FORK!\" But what is Black going to do?\n**Answer:** Black is going to eat the Knight with their Queen! It was a suicide fork because the square wasn't safe!", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}, {"id": "LES-028-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-028#19#B1", "parent_prompt_trace": "KB-028#19#B1", "text": "- **Lichess Practice:** [Knight Forks](https://lichess.org/practice/basic-tactics/the-fork/QjAaFq9b/QzH8J4zF) (Solve these puzzles to train your brain to see the invisible L-shapes!)."}, {"id": "LES-028-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-028#20#B1", "parent_prompt_trace": "KB-028#20#B1", "text": "- **Prerequisites:** TOP-096 Threat, TOP-014 Piece Values\n- **Next Steps:** None"}, {"id": "LES-028-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-028#21#B1", "parent_prompt_trace": "KB-028#21#B1", "text": "- [ ] Do I understand that a Fork exploits the \"one move per turn\" rule?\n- [ ] Do I know why a fork involving a Check is the most powerful?\n- [ ] Do I know that Pawns can deliver forks too?\n- [ ] Did we practice the \"Dragon Drill\"?"}], "title": "The Fork", "duration_minutes": 20, "memory_phrase": "One piece, two targets.", "teach": {"title": "Core Lesson", "estimated_minutes": 20, "slides": [{"id": "LES-028-S01", "type": "INTRO", "title": "The Two-Headed Dragon", "text": "One piece can attack two targets at the same time.", "parent_prompt": "Ask what would happen if one piece attacked two targets at once.", "diagram_id": "DGM-028-01", "diagram_url": "assets/DGM-028-01.svg", "visual": {"diagram_id": "DGM-028-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-KNIGHT-001", "position_version": 1, "position_title": "Royal knight fork from c7", "diagram_alt": "Royal knight fork from c7"}, {"id": "LES-028-S02", "type": "EXPLAIN", "title": "One piece two targets", "text": "A fork is a double attack by one piece.", "parent_prompt": "Emphasize that the opponent gets only one move.", "diagram_id": "DGM-028-01", "diagram_url": "assets/DGM-028-01.svg", "visual": {"diagram_id": "DGM-028-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-KNIGHT-001", "position_version": 1, "position_title": "Royal knight fork from c7", "diagram_alt": "Royal knight fork from c7"}, {"id": "LES-028-S03", "type": "DIAGRAM", "title": "The royal fork", "text": "The knight checks the king and attacks the rook.", "parent_prompt": "Point from the knight to the king and rook and require the king response first.", "diagram_id": "DGM-028-01", "diagram_url": "assets/DGM-028-01.svg", "visual": {"diagram_id": "DGM-028-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-KNIGHT-001", "position_version": 1, "position_title": "Royal knight fork from c7", "diagram_alt": "Royal knight fork from c7"}, {"id": "LES-028-S04", "type": "DIAGRAM", "title": "Pawns fork too", "text": "The pawn attacks two pieces at once.", "parent_prompt": "Ask which of the knight or bishop Black would save.", "diagram_id": "DGM-028-02", "diagram_url": "assets/DGM-028-02.svg", "visual": {"diagram_id": "DGM-028-02", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-PAWN-001", "position_version": 1, "position_title": "Pawn fork from d5", "diagram_alt": "Pawn fork from d5"}, {"id": "LES-028-S05", "type": "DIAGRAM", "title": "A powerful double attack", "text": "A queen can attack several targets at once.", "parent_prompt": "Trace the queen's different attack lines and count the targets.", "diagram_id": "DGM-028-03", "diagram_url": "assets/DGM-028-03.svg", "visual": {"diagram_id": "DGM-028-03", "layout": "VISUAL_60", "animation": "NONE"}}, {"id": "LES-028-S06", "type": "PHYSICAL_ACTIVITY", "title": "Dragon Drill", "text": "Find the square that bites both targets.", "parent_prompt": "Run the Dragon Drill with the knight moving to d6 to attack the king on e8 and queen on e4.", "visual": {"sticker": "detective", "layout": "TEXT_ONLY", "sticker_url": "assets/detective.svg", "sticker_alt": "Chess detective searching for setup clues"}}, {"id": "LES-028-S07", "type": "DIAGRAM", "title": "Name the tactic", "text": "What do we call one piece attacking two pieces?", "parent_prompt": "Ask the recognition question before naming the tactic.", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "visual": {"diagram_id": "DGM-028-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}, {"id": "LES-028-S08", "type": "QUESTION", "title": "Is the dragon safe?", "text": "Check whether the forking piece can be captured.", "parent_prompt": "Ask why a beautiful-looking fork can still fail.", "reveal": "A fork fails if the opponent can safely capture the forking piece.", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "visual": {"diagram_id": "DGM-028-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}, {"id": "LES-028-S09", "type": "ASSESSMENT", "title": "Fork detective", "text": "Find both targets and explain the opponent's choice.", "parent_prompt": "Use ASM-028 without directional coaching.", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "visual": {"diagram_id": "DGM-028-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}, {"id": "LES-028-S10", "type": "REVIEW", "title": "One piece two targets", "text": "Spot both targets and check that the attacker is safe.", "parent_prompt": "Complete the parent confidence check and repeat the memory phrase.", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "visual": {"diagram_id": "DGM-028-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}]}, "continue_teaching": {"title": "Continue Teaching", "estimated_minutes": 0, "groups": []}, "full_guide": {"title": "Parent Full Guide", "sections": [{"id": "LES-028-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-028#1#B1", "parent_prompt_trace": "KB-028#1#B1", "text": "- **Topic**: The Fork (The Two-Headed Dragon)\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 20 min\n- **Piece/concept type**: Tactic\n- **Prerequisites**: TOP-096 Threat, TOP-014 Piece Values\n\n**🎯 Today's Goal:**\nYour child will learn one of the most devastating magic tricks in chess: attacking two different things at the exact same time!\n\n**✅ Lesson Success Criteria:**\n- The child understands that the opponent is only allowed to make one move per turn.\n- The child can set up a situation where one piece points at two targets.\n- The child knows that the Knight is the undisputed master of the Fork.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-028-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-028#2#B1", "parent_prompt_trace": "KB-028#2#B1", "text": "A **Fork** (also called a Double Attack) happens when a single piece attacks two or more enemy pieces simultaneously. Because the rules of chess dictate that a player can only move one piece per turn, it is usually impossible to save both attacked pieces. The attacker is guaranteed to capture at least one of the targets on the next turn. While any piece (even a pawn or a King) can deliver a fork, the Knight is famous for it because its unique L-shaped jump allows it to attack pieces in ways they cannot attack back."}, {"id": "LES-028-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-028#3#B1", "parent_prompt_trace": "KB-028#3#B1", "text": "In TOP-096 (Threat), we learned how to spot a single \"Biting Dog.\" But what if two biting dogs attack two different pieces at once? The brain panics! The Fork is the foundational tactic of winning material in chess. Beginners play \"one-on-one\" chess, moving a piece to attack a single target. The opponent simply moves the target away. The Fork teaches the child to think geometrically, finding the exact intersection where one piece can terrorize two targets at once."}, {"id": "LES-028-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-028#4#B1", "parent_prompt_trace": "KB-028#4#B1", "text": "- **Requires:** TOP-096 (Threat), TOP-014 (Piece Values)\n- **Unlocks:** None"}, {"id": "LES-028-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-028#5#B1", "parent_prompt_trace": "KB-028#5#B1", "text": "The math of a fork relies on the turn-based nature of chess. \nIf your Knight attacks their Queen and their Rook at the same time, it's their turn. \nThey look at the board. They realize their Queen (9 points) is more valuable than their Rook (5 points). They use their one move to save the Queen. \nOn your turn, you eat the Rook! \nYou forced them into an impossible choice. The absolute best fork is when one of the targets is the King (a Check). Because they *must* save the King legally, whatever else you are attacking is completely doomed."}, {"id": "LES-028-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-028#6#B1", "parent_prompt_trace": "KB-028#6#B1", "text": "1. **The Math Problem:** \"If I attack your Queen, what do you do? You run away. But wait! You only get one move per turn, right? What if I attack your Queen AND your Castle at the exact same time?\"\n2. **The Dinner Fork:** \"Think about a fork you eat spaghetti with. It has a handle, but at the end, it splits into pointy prongs! In chess, your piece is the handle, and its lasers are the prongs! We want to poke two things at once!\"\n3. **The Ninja Jump:** \"The Ninja Horse (Knight) is the best at forking! Because he jumps in an L-shape, he can point his sword at a Castle and a Queen, and neither of them can shoot him back!\"\n4. **The Royal Fork:** \"The best fork in the world is when one prong pokes the King, and the other prong pokes the Queen! The King yells 'Save me!' and the poor Queen gets eaten!\""}, {"id": "LES-028-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-028#7#B1", "parent_prompt_trace": "KB-028#7#B1", "text": "**The Two-Headed Dragon:**\nImagine a Dragon with two heads. He walks into the forest and sees two tasty Knights running away. One Knight runs left, and the other Knight runs right. A normal dragon only has one head, so he has to choose one Knight to chase. But the Two-Headed Dragon just stretches his necks out and grabs BOTH of them at the same time! When you make a Fork in chess, you are turning your piece into a Two-Headed Dragon. The opponent only has time to save one guy, and the dragon eats the other one!"}, {"id": "LES-028-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-028#8#B1", "parent_prompt_trace": "KB-028#8#B1", "text": "When a Knight forks the enemy King, Queen, and a Rook all at the exact same time, it is known in chess clubs as a \"Family Fork\"! (Because it attacks the whole Royal Family!)."}, {"id": "LES-028-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1 — Basic Concept", "source_trace": "KB-028#9#B1", "parent_prompt_trace": "KB-028#9#B1", "text": "*The Royal Fork! The Knight's L-shape perfectly targets two pieces at once. Black MUST move the King, meaning the Rook is doomed.*", "diagram_id": "DGM-028-01", "diagram_url": "assets/DGM-028-01.svg", "position_id": "POS-FORK-KNIGHT-001", "position_version": 1, "position_title": "Royal knight fork from c7", "diagram_alt": "Royal knight fork from c7"}, {"id": "LES-028-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-028#10#B1", "parent_prompt_trace": "KB-028#10#B1", "text": "A fork only works if the piece delivering the fork is safe. If you move your Knight to fork the King and Queen, but an enemy pawn can just eat your Knight, it's not a fork, it's a blunder!"}, {"id": "LES-028-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-028#11#B1", "parent_prompt_trace": "KB-028#11#B1", "text": "*The Pawn Fork. Yes, even pawns can be two-headed dragons! If Black saves the Knight, the pawn eats the Bishop.*", "diagram_id": "DGM-028-02", "diagram_url": "assets/DGM-028-02.svg", "position_id": "POS-FORK-PAWN-001", "position_version": 1, "position_title": "Pawn fork from d5", "diagram_alt": "Pawn fork from d5"}, {"id": "LES-028-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-028#12#B1", "parent_prompt_trace": "KB-028#12#B1", "text": "*The Queen Fork. The Queen is so powerful she can fork 3 or 4 things at once! But she must be careful not to get eaten by smaller pieces.*"}, {"id": "LES-028-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-028#13#B1", "parent_prompt_trace": "KB-028#13#B1", "text": "- **The \"Suicide\" Fork:** A child spots a beautiful fork, but the square they jump to is heavily guarded. They play the move, yell \"Fork!\", and immediately get their piece captured. Remind them: \"The Two-Headed Dragon has to stand on a safe square!\"\n- **Forgetting the pawn fork:** Kids get so obsessed with Knights that they forget pawns are the cheapest, deadliest forks on the board. A 1-point pawn forking two 3-point minor pieces is devastating.\n\n> **🧑‍🏫 Coach Tip:**\n> When your child successfully executes a fork against you, groan loudly. Act incredibly frustrated that you can only save one piece. Kids love seeing that their move mathematically broke the rules of the universe for you."}, {"id": "LES-028-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-028#14#B1", "parent_prompt_trace": "KB-028#14#B1", "text": "This relies heavily on TOP-014 (Piece Values) because when the opponent is forked, they have to calculate which piece is more valuable to save!\n\n> **🧑‍🏫 Coach Tip:**\n> Knights love to fork from the `c7` or `f7` squares because they are close to the King and Rooks. Teach your child to always protect those squares!"}, {"id": "LES-028-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-028#15#B1", "parent_prompt_trace": "KB-028#15#B1", "text": "**Q: Can a King deliver a fork?**\nA: Yes! In the endgame, a King can step between two enemy pawns or two enemy Knights, attacking them both at the same time."}, {"id": "LES-028-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-028#16#B1", "parent_prompt_trace": "KB-028#16#B1", "text": "**The Dragon Drill:**\nClear the board. Give your child a White Knight. \nPut a Black King on `e8` and a Black Queen on `e4`. \nTell them: \"Find the square where the Two-Headed Dragon can bite both of them!\"\nWatch them hop the Knight around until they find `c7` (wait, no, `c7` hits `e8`, but `e4`? No. The correct squares to fork `e8` and `e4` are `f6` or `d6` or `c5`. Let's use `d6`! From `d6`, the Knight hits `e8` and `e4`).\nLet them hop to `d6` and yell \"Fork!\""}, {"id": "LES-028-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-028#17#B1", "parent_prompt_trace": "KB-028#17#B1", "text": "**The Choice:**\nSet up a pawn fork for your child. Their pawn is attacking your Queen and your Castle. \nAsk: \"Which piece are you hoping I save?\"\n(They should say: \"The Castle, so I can eat the Queen!\").\nMove your Queen away.\nAsk: \"What do you do now?\"\n(Eat the Castle!)."}, {"id": "LES-028-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-028#18#B1", "parent_prompt_trace": "KB-028#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** What do we call it when one piece attacks two pieces at the same time?\n**Answer:** A Fork! (Or a double attack).\n\n### 🟡 Application (Medium)\n\n**Question:** You are Black. You only have one turn! You can't save both. Which piece should you save?\n**Answer:** It's a trick question! They are both worth 3 points! Just pick your favorite one to save, and say goodbye to the other one.\n\n### 🔴 Challenge (Hard)\n\n**Question:** White yelled \"FORK!\" But what is Black going to do?\n**Answer:** Black is going to eat the Knight with their Queen! It was a suicide fork because the square wasn't safe!", "diagram_id": "DGM-028-04", "diagram_url": "assets/DGM-028-04.svg", "position_id": "POS-FORK-PAWN-002", "position_version": 1, "position_title": "Pawn fork from d4", "diagram_alt": "Pawn fork from d4"}, {"id": "LES-028-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-028#19#B1", "parent_prompt_trace": "KB-028#19#B1", "text": "- **Lichess Practice:** [Knight Forks](https://lichess.org/practice/basic-tactics/the-fork/QjAaFq9b/QzH8J4zF) (Solve these puzzles to train your brain to see the invisible L-shapes!)."}, {"id": "LES-028-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-028#20#B1", "parent_prompt_trace": "KB-028#20#B1", "text": "- **Prerequisites:** TOP-096 Threat, TOP-014 Piece Values\n- **Next Steps:** None"}, {"id": "LES-028-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-028#21#B1", "parent_prompt_trace": "KB-028#21#B1", "text": "- [ ] Do I understand that a Fork exploits the \"one move per turn\" rule?\n- [ ] Do I know why a fork involving a Check is the most powerful?\n- [ ] Do I know that Pawns can deliver forks too?\n- [ ] Did we practice the \"Dragon Drill\"?"}]}}</script><script id="task-data" type="application/json">{"schema_version": 1, "lesson_id": "LES-028", "tasks": [{"schema_version": 1, "task_id": "PZL-028-01", "kb_id": "KB-028", "lesson_id": "LES-028", "task_type": "PHYSICAL_BOARD_ACTION", "source_type": "PCA_CURRICULUM", "prompt": "In the royal-fork diagram name both pieces attacked by the k
