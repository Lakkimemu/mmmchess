<script id="lesson-data" type="application/json">{"lesson_id": "LES-019", "kb_id": "KB-107", "topic_id": "TOP-107", "unit_id": "UNT-001", "sequence": 19, "objective": "**🎯 Today's Goal:**\nYour child will be able to slide the Bishop diagonally and understand that a Bishop never changes its color square.", "success_criteria": "**✅ Lesson Success Criteria:**\n- The child moves the Bishop only on diagonal lines.\n- The child correctly identifies whether a Bishop belongs to the light squares or the dark squares.\n- The child captures an enemy piece diagonally without jumping.", "source_traces": {"objective": "KB-107#1#B2", "success_criteria": "KB-107#1#B3"}, "prerequisites": [], "readiness_checks": [], "parent_notes": [], "parent_reference": [{"ordinal": 1, "section_id": "AT_A_GLANCE", "heading": "1. At a Glance", "source_trace": "KB-107#1", "content": "- **Topic**: Bishop Movement\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 15 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-106 Rook Movement, TOP-011 Bishop Recognition\n\n**🎯 Today's Goal:**\nYour child will be able to slide the Bishop diagonally and understand that a Bishop never changes its color square.\n\n**✅ Lesson Success Criteria:**\n- The child moves the Bishop only on diagonal lines.\n- The child correctly identifies whether a Bishop belongs to the light squares or the dark squares.\n- The child captures an enemy piece diagonally without jumping.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"ordinal": 2, "section_id": "DEFINITION", "heading": "2. Definition", "source_trace": "KB-107#2", "content": "The Bishop moves any number of empty squares in any diagonal direction. It captures by sliding into an enemy piece's square. Because diagonal lines are made up of squares of exactly the same color, a Bishop is \"color-bound.\" This means a Bishop that starts on a light square can only ever move to light squares for the entire game, and a Bishop that starts on a dark square is stuck on dark squares forever."}, {"ordinal": 3, "section_id": "WHY_IT_MATTERS", "heading": "3. Why It Matters", "source_trace": "KB-107#3", "content": "Bishops are tricky for beginners because diagonal vision is harder to develop than straight-line vision (like the Rook). Mastering the Bishop teaches a child how to see \"criss-cross\" patterns on the board. Furthermore, understanding the concept of \"light\" and \"dark\" Bishops is foundational for intermediate strategy."}, {"ordinal": 4, "section_id": "BEFORE_YOU_TEACH", "heading": "4. Before You Teach (Graph)", "source_trace": "KB-107#4", "content": "- **Requires:** TOP-011 (Bishop Recognition), TOP-106 (Rook Movement)\n- **Unlocks:** TOP-108 (Knight Movement), TOP-028 (Pins)"}, {"ordinal": 5, "section_id": "PARENT_UNDERSTANDS", "heading": "5. Parent Understands", "source_trace": "KB-107#5", "content": "The Bishop is the exact opposite of the Rook. It can slide as far as it wants, but *only* diagonally. \nThe most important concept to grasp is color binding. You start the game with two Bishops. If you look at their starting squares, one sits on a light square and one sits on a dark square. If you trace any diagonal line, you will see it is entirely made of the same color. Therefore, it is physically impossible for a Bishop to ever switch colors. If a child's Bishop suddenly changes color during a game, they have made an illegal move!"}, {"ordinal": 6, "section_id": "HOW_TO_TEACH_IT", "heading": "6. How to Teach It", "source_trace": "KB-107#6", "content": "1. **The Magic Paths:** Place one White Bishop on a light square in the center. Tell your child, \"The Bishop is a wizard, and it glides on magic diagonal paths!\"\n2. **The Color Check:** Ask the child what color square the Bishop is standing on. (Light). Have them trace the diagonal with their finger. Ask, \"What color are all the squares you are touching?\" (Light). Emphasize that the wizard is stuck on that color forever!\n3. **The Slide:** Have the child slide the Bishop all the way to a corner.\n4. **The No-Straight Rule:** Try to move the Bishop straight like a Rook. Stop and say, \"Oops! The wizard doesn't know how to walk straight. Only criss-cross!\"\n5. **The Two Brothers:** Place the second White Bishop on a dark square next to the first one. Show that they work together as a team to cover both colors, but they can never cross paths."}, {"ordinal": 7, "section_id": "STORY_ANALOGY_MEMORY", "heading": "7. Teaching Story / Analogy / Memory Hint", "source_trace": "KB-107#7", "content": "**The Two Wizards:** \nThe Bishops are two wizards. One wizard wears white robes and only walks on the light magic stones. The other wizard wears black robes and only walks on the dark magic stones. They are brothers, but they can never ever meet each other on the same square, because they live on different colors!"}, {"ordinal": 8, "section_id": "DID_YOU_KNOW", "heading": "8. Did You Know? 🎓", "source_trace": "KB-107#8", "content": "The cut on the top of the Bishop's piece represents a bishop's \"mitre\" (the tall hat worn by church leaders). But in some countries, this piece is called the \"Elephant,\" the \"Runner,\" or even the \"Fool\"!"}, {"ordinal": 9, "section_id": "BOARD_DIAGRAM_1", "heading": "9. Board Diagram 1 — Basic Concept", "source_trace": "KB-107#9", "content": "![DGM-107-01: A White Bishop on a light square in the center, with green diagonal arrows forming an X shape.](../../assets/diagrams/TOP-107/DGM-107-01.svg)\n*The Bishop glides diagonally, creating an X pattern.*"}, {"ordinal": 10, "section_id": "HOW_IT_WORKS", "heading": "10. How It Works", "source_trace": "KB-107#10", "content": "When moving a Bishop, pick one diagonal direction and slide as far as you want. You cannot jump over any pieces. If an enemy piece is on your diagonal, you can capture it by sliding to its square."}, {"ordinal": 11, "section_id": "BOARD_DIAGRAM_2", "heading": "11. Board Diagram 2 — Practical Example", "source_trace": "KB-107#11", "content": "![DGM-107-02: A dark-square White Bishop sliding diagonally to capture a Black Rook.](../../assets/diagrams/TOP-107/DGM-107-02.svg)\n*To capture, the Bishop slides into the enemy piece's square.*"}, {"ordinal": 12, "section_id": "REAL_GAME_EXAMPLE", "heading": "12. Real Game Example", "source_trace": "KB-107#12", "content": "![DGM-107-03: Two White Bishops side-by-side, controlling huge diagonal paths across the whole board.](../../assets/diagrams/TOP-107/DGM-107-03.svg)\n*When the two wizards work together, they can attack almost the entire board at the same time!*"}, {"ordinal": 13, "section_id": "COMMON_MISTAKES", "heading": "13. Common Mistakes", "source_trace": "KB-107#13", "content": "- **Color Switching:** Children often drift off the diagonal accidentally, landing on the wrong color.\n- **Rook Moves:** Sometimes they forget and try to move the Bishop straight, especially to capture an unprotected piece sitting right in front of them.\n\n> **🧑‍🏫 Coach Tip:**\n> When your child makes a move with a Bishop, occasionally ask, \"Color check!\" If they started on a light square and landed on a dark square, they will instantly realize they made a mistake."}, {"ordinal": 14, "section_id": "TEACHING_NOTES", "heading": "14. Teaching Notes", "source_trace": "KB-107#14", "content": "Diagonals are notoriously difficult for young brains to process. Our eyes naturally scan up/down and left/right. It will take time for your child to see the \"criss-cross\" lines clearly. Do not rush this lesson.\n\n> **🧑‍🏫 Coach Tip:**\n> If your child struggles to see diagonals, have them take 4 or 5 pawns and physically place them on the empty squares of the diagonal to build a \"bridge\" for the Bishop to look at."}, {"ordinal": 15, "section_id": "PARENT_FAQ", "heading": "15. Parent FAQ", "source_trace": "KB-107#15", "content": "**Q: My child keeps capturing straight ahead with the Bishop. What do I say?**\nA: Say, \"Ah, that's a Rook move! Remember, the wizard only walks on criss-cross paths.\"\n\n**Q: If my light-square Bishop gets captured, can my dark-square Bishop move to light squares to help out?**\nA: No! Once a wizard picks a color at the start of the game, they are bound to it forever. If you lose your light-square Bishop, your opponent's pieces on light squares are much safer."}, {"ordinal": 16, "section_id": "PRACTICE_TOGETHER", "heading": "16. Practice Together", "source_trace": "KB-107#16", "content": "**The Color Test Game:**\nTake all the pieces off the board. You (the parent) place a Black piece randomly on the board. The child holds a White Bishop. The child must instantly shout \"Light!\" or \"Dark!\" depending on what color the Black piece is on. Then, they must place their Bishop on the board and capture it in one move. Repeat 10 times."}, {"ordinal": 17, "section_id": "COACH_CHALLENGE", "heading": "17. Coach Challenge ⭐", "source_trace": "KB-107#17", "content": "**The Wizard's Laser:**\nPlace a White Bishop on `b2` (a dark square). Place 4 or 5 Black pawns on light squares around the board. Place one Black Rook on `g7` (a dark square on the Bishop's diagonal).\nAsk your child: \"The wizard wants to fire his magic laser! Which piece can he hit?\" \nThey must realize that he can *only* hit the Rook, because the pawns are all on light squares! This trains them to only look at pieces sharing their Bishop's color."}, {"ordinal": 18, "section_id": "TRY_IT_YOURSELF", "heading": "18. Try It Yourself", "source_trace": "KB-107#18", "content": "### 🟢 Recognition (Easy)\n![DGM-107-04: White Bishop on c4. Highlight a correct diagonal path and an incorrect straight path.](../../assets/diagrams/TOP-107/DGM-107-04.svg)\n**Question:** Which magic path is the Bishop allowed to use? The straight red one, or the diagonal green one?\n**Answer:** The diagonal green one!\n\n### 🟡 Application (Medium)\n![DGM-107-05: White Bishop (light squares) on d3. Black Knight on h7 (light square). Black Pawn on e4 (dark square).](../../assets/diagrams/TOP-107/DGM-107-05.svg)\n**Question:** Which enemy piece can the White Bishop capture right now?\n**Answer:** The Black Knight on h7. The Bishop cannot capture the Pawn on e4 because it is on a dark square!\n\n### 🔴 Challenge (Hard)\n![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)\n**Question:** The wizard wants to travel to h2. The pawn on e5 is blocking his long diagonal. How many turns will it take to get to h2?\n**Answer:** Two turns! He must slide up a shorter diagonal first (like to c3 or d4), stop, and then slide down to h2 on his next turn."}, {"ordinal": 19, "section_id": "CONTINUE_LEARNING", "heading": "19. Continue Learning", "source_trace": "KB-107#19", "content": "- **Lichess Practice:** [The Pieces - Bishop](https://lichess.org/learn#/2) (Interactive drills for kids)."}, {"ordinal": 20, "section_id": "RELATED_TOPICS", "heading": "20. Related Topics", "source_trace": "KB-107#20", "content": "- **Prerequisites:** TOP-106 Rook Movement, TOP-011 Bishop (Recognition)\n- **Next Steps:** TOP-108 Knight Movement"}, {"ordinal": 21, "section_id": "PARENT_CONFIDENCE_CHECK", "heading": "21. Parent Confidence Check ✅", "source_trace": "KB-107#21", "content": "- [ ] Do I understand that Bishops only move diagonally?\n- [ ] Do I understand the concept of color-bound pieces?\n- [ ] Did we practice the \"Color Test Game\"?\n- [ ] Can my child successfully perform a \"Color check\" after moving?\n\n---\n\n```yaml\nkb_quality:\n  reviewed: true\n  diagrams: 6\n  mini_puzzles: 3\n  external_resources: 1\n  coach_challenges: 1\n  practice_activities: 1\n  coach_tips: 2\n  parent_faq: 2\n  estimated_read_time: 15 min\n```"}], "slides": [{"id": "LES-019-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-107#1#B1", "parent_prompt_trace": "KB-1 title": "Common Mistakes", "source_trace": "KB-107#13#B1", "parent_prompt_trace": "KB-107#13#B1", "text": "- **Color Switching:** Children often drift off the diagonal accidentally, landing on the wrong color.\n- **Rook Moves:** Sometimes they forget and try to move the Bishop straight, especially to capture an unprotected piece sitting right in front of them.\n\n> **🧑‍🏫 Coach Tip:**\n> When your child makes a move with a Bishop, occasionally ask, \"Color check!\" If they started on a light square and landed on a dark square, they will instantly realize they made a mistake."}, {"id": "LES-019-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-107#14#B1", "parent_prompt_trace": "KB-107#14#B1", "text": "Diagonals are notoriously difficult for young brains to process. Our eyes naturally scan up/down and left/right. It will take time for your child to see the \"criss-cross\" lines clearly. Do not rush this lesson.\n\n> **🧑‍🏫 Coach Tip:**\n> If your child struggles to see diagonals, have them take 4 or 5 pawns and physically place them on the empty squares of the diagonal to build a \"bridge\" for the Bishop to look at."}, {"id": "LES-019-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-107#15#B1", "parent_prompt_trace": "KB-107#15#B1", "text": "**Q: My child keeps capturing straight ahead with the Bishop. What do I say?**\nA: Say, \"Ah, that's a Rook move! Remember, the wizard only walks on criss-cross paths.\"\n\n**Q: If my light-square Bishop gets captured, can my dark-square Bishop move to light squares to help out?**\nA: No! Once a wizard picks a color at the start of the game, they are bound to it forever. If you lose your light-square Bishop, your opponent's pieces on light squares are much safer."}, {"id": "LES-019-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-107#16#B1", "parent_prompt_trace": "KB-107#16#B1", "text": "**The Color Test Game:**\nTake all the pieces off the board. You (the parent) place a Black piece randomly on the board. The child holds a White Bishop. The child must instantly shout \"Light!\" or \"Dark!\" depending on what color the Black piece is on. Then, they must place their Bishop on the board and capture it in one move. Repeat 10 times."}, {"id": "LES-019-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-107#17#B1", "parent_prompt_trace": "KB-107#17#B1", "text": "**The Wizard's Laser:**\nPlace a White Bishop on `b2` (a dark square). Place 4 or 5 Black pawns on light squares around the board. Place one Black Rook on `g7` (a dark square on the Bishop's diagonal).\nAsk your child: \"The wizard wants to fire his magic laser! Which piece can he hit?\" \nThey must realize that he can *only* hit the Rook, because the pawns are all on light squares! This trains them to only look at pieces sharing their Bishop's color."}, {"id": "LES-019-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-107#18#B1", "parent_prompt_trace": "KB-107#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which magic path is the Bishop allowed to use? The straight red one, or the diagonal green one?\n**Answer:** The diagonal green one!\n\n### 🟡 Application (Medium)\n\n**Question:** Which enemy piece can the White Bishop capture right now?\n**Answer:** The Black Knight on h7. The Bishop cannot capture the Pawn on e4 because it is on a dark square!\n\n### 🔴 Challenge (Hard)\n\n**Question:** The wizard wants to travel to h2. The pawn on e5 is blocking his long diagonal. How many turns will it take to get to h2?\n**Answer:** Two turns! He must slide up a shorter diagonal first (like to c3 or d4), stop, and then slide down to h2 on his next turn.", "diagram_id": "DGM-107-06", "diagram_url": "assets/DGM-107-06.svg", "position_id": "POS-BISHOP-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)", "diagram_alt": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)"}, {"id": "LES-019-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-107#19#B1", "parent_prompt_trace": "KB-107#19#B1", "text": "- **Lichess Practice:** [The Pieces - Bishop](https://lichess.org/learn#/2) (Interactive drills for kids)."}, {"id": "LES-019-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-107#20#B1", "parent_prompt_trace": "KB-107#20#B1", "text": "- **Prerequisites:** TOP-106 Rook Movement, TOP-011 Bishop (Recognition)\n- **Next Steps:** TOP-108 Knight Movement"}, {"id": "LES-019-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-107#21#B1", "parent_prompt_trace": "KB-107#21#B1", "text": "- [ ] Do I understand that Bishops only move diagonally?\n- [ ] Do I understand the concept of color-bound pieces?\n- [ ] Did we practice the \"Color Test Game\"?\n- [ ] Can my child successfully perform a \"Color check\" after moving?"}], "task_references": ["PZL-019-01", "PZL-019-02", "PZL-019-03", "PZL-019-04"], "diagram_references": ["DGM-107-01", "DGM-107-02", "DGM-107-03", "DGM-107-04", "DGM-107-05", "DGM-107-06"], "diagram_deferrals": [], "assessment_reference": "ASM-019", "deferred_topics": assets/diagrams/TOP-107/DGM-107-02.svg)", "diagram_alt": "![DGM-107-02: A dark-square White Bishop sliding diagonally to capture a Black Rook.](../../assets/diagrams/TOP-107/DGM-107-02.svg)"}, {"id": "LES-019-S04", "type": "DIAGRAM", "title": "Real-game pattern", "text": "Use the board to explore bishop movement.", "parent_prompt": "Guide the real-game pattern.", "diagram_id": "DGM-107-03", "diagram_url": "assets/DGM-107-03.svg", "visual": {"diagram_id": "DGM-107-03", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-107-03: Two White Bishops side-by-side, controlling huge diagonal paths across the whole board.](../../assets/diagrams/TOP-107/DGM-107-03.svg)", "diagram_alt": "![DGM-107-03: Two White Bishops side-by-side, controlling huge diagonal paths across the whole board.](../../assets/diagrams/TOP-107/DGM-107-03.svg)"}, {"id": "LES-019-S05", "type": "QUESTION", "title": "Recognition check", "text": "Use the board to explore bishop movement.", "parent_prompt": "Guide the recognition check.", "diagram_id": "DGM-107-04", "diagram_url": "assets/DGM-107-04.svg", "visual": {"diagram_id": "DGM-107-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-004", "position_version": 1, "position_title": "![DGM-107-04: White Bishop on c4. Highlight a correct diagonal path and an incorrect straight path.](../../assets/diagrams/TOP-107/DGM-107-04.svg)", "diagram_alt": "![DGM-107-04: White Bishop on c4. Highlight a correct diagonal path and an incorrect straight path.](../../assets/diagrams/TOP-107/DGM-107-04.svg)"}, {"id": "LES-019-S06", "type": "QUESTION", "title": "Stay on one colour", "text": "Decide which piece the Bishop can reach.", "parent_prompt": "Guide the square-colour check.", "diagram_id": "DGM-107-05", "diagram_url": "assets/DGM-107-05.svg", "visual": {"diagram_id": "DGM-107-05", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-005", "position_version": 1, "position_title": "![DGM-107-05: White Bishop (light squares) on d3. Black Knight on h7 (light square). Black Pawn on e4 (dark square).](../../assets/diagrams/TOP-107/DGM-107-05.svg)", "diagram_alt": "![DGM-107-05: White Bishop (light squares) on d3. Black Knight on h7 (light square). Black Pawn on e4 (dark square).](../../assets/diagrams/TOP-107/DGM-107-05.svg)"}, {"id": "LES-019-S07", "type": "QUESTION", "title": "Plan the route", "text": "Decide whether the Bishop can reach the target.", "parent_prompt": "Guide the route check.", "diagram_id": "DGM-107-06", "diagram_url": "assets/DGM-107-06.svg", "visual": {"diagram_id": "DGM-107-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)", "diagram_alt": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)"}, {"id": "LES-019-S08", "type": "ASSESSMENT", "title": "Check your progress", "text": "Show that you understand bishop movement.", "parent_prompt": "Check each success criterion with the board.", "diagram_id": "DGM-107-06", "diagram_url": "assets/DGM-107-06.svg", "visual": {"diagram_id": "DGM-107-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)", "diagram_alt": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)"}], "guide_sections": [{"id": "LES-019-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-107#1#B1", "parent_prompt_trace": "KB-107#1#B1", "text": "- **Topic**: Bishop Movement\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 15 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-106 Rook Movement, TOP-011 Bishop Recognition\n\n**🎯 Today's Goal:**\nYour child will be able to slide the Bishop diagonally and understand that a Bishop never changes its color square.\n\n**✅ Lesson Success Criteria:**\n- The child moves the Bishop only on diagonal lines.\n- The child correctly identifies whether a Bishop belongs to the light squares or the dark squares.\n- The child captures an enemy piece diagonally without jumping.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-019-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-107#2#B1", "parent_prompt_trace": "KB-107#2#B1", "text": "The Bishop moves any number of empty squares in any diagonal direction. It captures by sliding into an enemy piece's square. Because diagonal lines are made up of squares of exactly the same color, a Bishop is \"color-bound.\" This means a Bishop that starts on a light square can only ever move to light squares for the entire game, and a Bishop that starts on a dark square is stuck on dark squares forever."}, {"id": "LES-019-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-107#3#B1", "parent_prompt_trace": "KB-107#3#B1", "text": "Bishops are tricky for beginners because diagonal vision is harder to develop than straight-line vision (like the Rook). Mastering the Bishop teaches a child how to see \"criss-cross\" patterns on the board. Furthermore, understanding the concept of \"light\" and \"dark\" Bishops is foundational for intermediate strategy."}, {"id": "LES-019-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-107#4#B1", "parent_prompt_trace": "KB-107#4#B1", "text": "- **Requires:** TOP-011 (Bishop Recognition), TOP-106 (Rook Movement)\n- **Unlocks:** TOP-108 (Knight Movement), TOP-028 (Pins)"}, {"id": "LES-019-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-107#5#B1", "parent_prompt_trace": "KB-107#5#B1", "text": "The Bishop is the exact opposite of the Rook. It can slide as far as it wants, but *only* diagonally. \nThe most important concept to grasp is color binding. You start the game with two Bishops. If you look at their starting squares, one sits on a light square and one sits on a dark square. If you trace any diagonal line, you will see it is entirely made of the same color. Therefore, it is physically impossible for a Bishop to ever switch colors. If a child's Bishop suddenly changes color during a game, they have made an illegal move!"}, {"id": "LES-019-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-107#6#B1", "parent_prompt_trace": "KB-107#6#B1", "text": "1. **The Magic Paths:** Place one White Bishop on a light square in the center. Tell your child, \"The Bishop is a wizard, and it glides on magic diagonal paths!\"\n2. **The Color Check:** Ask the child what color square the Bishop is standing on. (Light). Have them trace the diagonal with their finger. Ask, \"What color are all the squares you are touching?\" (Light). Emphasize that the wizard is stuck on that color forever!\n3. **The Slide:** Have the child slide the Bishop all the way to a corner.\n4. **The No-Straight Rule:** Try to move the Bishop straight like a Rook. Stop and say, \"Oops! The wizard doesn't know how to walk straight. Only criss-cross!\"\n5. **The Two Brothers:** Place the second White Bishop on a dark square next to the first one. Show that they work together as a team to cover both colors, but they can never cross paths."}, {"id": "LES-019-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-107#7#B1", "parent_prompt_trace": "KB-107#7#B1", "text": "**The Two Wizards:** \nThe Bishops are two wizards. One wizard wears white robes and only walks on the light magic stones. The other wizard wears black robes and only walks on the dark magic stones. They are brothers, but they can never ever meet each other on the same square, because they live on different colors!"}, {"id": "LES-019-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-107#8#B1", "parent_prompt_trace": "KB-107#8#B1", "text": "The cut on the top of the Bishop's piece represents a bishop's \"mitre\" (the tall hat worn by church leaders). But in some countries, this piece is called the \"Elephant,\" the \"Runner,\" or even the \"Fool\"!"}, {"id": "LES-019-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1 — Basic Concept", "source_trace": "KB-107#9#B1", "parent_prompt_trace": "KB-107#9#B1", "text": "*The Bishop glides diagonally, creating an X pattern.*", "diagram_id": "DGM-107-01", "diagram_url": "assets/DGM-107-01.svg", "position_id": "POS-BISHOP-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-107-01: A White Bishop on a light square in the center, with green diagonal arrows forming an X shape.](../../assets/diagrams/TOP-107/DGM-107-01.svg)", "diagram_alt": "![DGM-107-01: A White Bishop on a light square in the center, with green diagonal arrows forming an X shape.](../../assets/diagrams/TOP-107/DGM-107-01.svg)"}, {"id": "LES-019-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-107#10#B1", "parent_prompt_trace": "KB-107#10#B1", "text": "When moving a Bishop, pick one diagonal direction and slide as far as you want. You cannot jump over any pieces. If an enemy piece is on your diagonal, you can capture it by sliding to its square."}, {"id": "LES-019-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-107#11#B1", "parent_prompt_trace": "KB-107#11#B1", "text": "*To capture, the Bishop slides into the enemy piece's square.*", "diagram_id": "DGM-107-02", "diagram_url": "assets/DGM-107-02.svg", "position_id": "POS-BISHOP-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-107-02: A dark-square White Bishop sliding diagonally to capture a Black Rook.](../../assets/diagrams/TOP-107/DGM-107-02.svg)", "diagram_alt": "![DGM-107-02: A dark-square White Bishop sliding diagonally to capture a Black Rook.](../../assets/diagrams/TOP-107/DGM-107-02.svg)"}, {"id": "LES-019-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-107#12#B1", "parent_prompt_trace": "KB-107#12#B1", "text": "*When the two wizards work together, they can attack almost the entire board at the same time!*", "diagram_id": "DGM-107-03", "diagram_url": "assets/DGM-107-03.svg", "position_id": "POS-BISHOP-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-107-03: Two White Bishops side-by-side, controlling huge diagonal paths across the whole board.](../../assets/diagrams/TOP-107/DGM-107-03.svg)", "diagram_alt": "![DGM-107-03: Two White Bishops side-by-side, controlling huge diagonal paths across the whole board.](../../assets/diagrams/TOP-107/DGM-107-03.svg)"}, {"id": "LES-019-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-107#13#B1", "parent_prompt_trace": "KB-107#13#B1", "text": "- **Color Switching:** Children often drift off the diagonal accidentally, landing on the wrong color.\n- **Rook Moves:** Sometimes they forget and try to move the Bishop straight, especially to capture an unprotected piece sitting right in front of them.\n\n> **🧑‍🏫 Coach Tip:**\n> When your child makes a move with a Bishop, occasionally ask, \"Color check!\" If they started on a light square and landed on a dark square, they will instantly realize they made a mistake."}, {"id": "LES-019-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-107#14#B1", "parent_prompt_trace": "KB-107#14#B1", "text": "Diagonals are notoriously difficult for young brains to process. Our eyes naturally scan up/down and left/right. It will take time for your child to see the \"criss-cross\" lines clearly. Do not rush this lesson.\n\n> **🧑‍🏫 Coach Tip:**\n> If your child struggles to see diagonals, have them take 4 or 5 pawns and physically place them on the empty squares of the diagonal to build a \"bridge\" for the Bishop to look at."}, {"id": "LES-019-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-107#15#B1", "parent_prompt_trace": "KB-107#15#B1", "text": "**Q: My child keeps capturing straight ahead with the Bishop. What do I say?**\nA: Say, \"Ah, that's a Rook move! Remember, the wizard only walks on criss-cross paths.\"\n\n**Q: If my light-square Bishop gets captured, can my dark-square Bishop move to light squares to help out?**\nA: No! Once a wizard picks a color at the start of the game, they are bound to it forever. If you lose your light-square Bishop, your opponent's pieces on light squares are much safer."}, {"id": "LES-019-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-107#16#B1", "parent_prompt_trace": "KB-107#16#B1", "text": "**The Color Test Game:**\nTake all the pieces off the board. You (the parent) place a Black piece randomly on the board. The child holds a White Bishop. The child must instantly shout \"Light!\" or \"Dark!\" depending on what color the Black piece is on. Then, they must place their Bishop on the board and capture it in one move. Repeat 10 times."}, {"id": "LES-019-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-107#17#B1", "parent_prompt_trace": "KB-107#17#B1", "text": "**The Wizard's Laser:**\nPlace a White Bishop on `b2` (a dark square). Place 4 or 5 Black pawns on light squares around the board. Place one Black Rook on `g7` (a dark square on the Bishop's diagonal).\nAsk your child: \"The wizard wants to fire his magic laser! Which piece can he hit?\" \nThey must realize that he can *only* hit the Rook, because the pawns are all on light squares! This trains them to only look at pieces sharing their Bishop's color."}, {"id": "LES-019-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-107#18#B1", "parent_prompt_trace": "KB-107#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which magic path is the Bishop allowed to use? The straight red one, or the diagonal green one?\n**Answer:** The diagonal green one!\n\n### 🟡 Application (Medium)\n\n**Question:** Which enemy piece can the White Bishop capture right now?\n**Answer:** The Black Knight on h7. The Bishop cannot capture the Pawn on e4 because it is on a dark square!\n\n### 🔴 Challenge (Hard)\n\n**Question:** The wizard wants to travel to h2. The pawn on e5 is blocking his long diagonal. How many turns will it take to get to h2?\n**Answer:** Two turns! He must slide up a shorter diagonal first (like to c3 or d4), stop, and then slide down to h2 on his next turn.", "diagram_id": "DGM-107-06", "diagram_url": "assets/DGM-107-06.svg", "position_id": "POS-BISHOP-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)", "diagram_alt": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)"}, {"id": "LES-019-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-107#19#B1", "parent_prompt_trace": "KB-107#19#B1", "text": "- **Lichess Practice:** [The Pieces - Bishop](https://lichess.org/learn#/2) (Interactive drills for kids)."}, {"id": "LES-019-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-107#20#B1", "parent_prompt_trace": "KB-107#20#B1", "text": "- **Prerequisites:** TOP-106 Rook Movement, TOP-011 Bishop (Recognition)\n- **Next Steps:** TOP-108 Knight Movement"}, {"id": "LES-019-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-107#21#B1", "parent_prompt_trace": "KB-107#21#B1", "text": "- [ ] Do I understand that Bishops only move diagonally?\n- [ ] Do I understand the concept of color-bound pieces?\n- [ ] Did we practice the \"Color Test Game\"?\n- [ ] Can my child successfully perform a \"Color check\" after moving?"}], "title": "Bishop Movement", "duration_minutes": 15, "memory_phrase": "Criss-cross, same color.", "teach": {"title": "Core Lesson", "estimated_minutes": 15, "slides": [{"id": "LES-019-S01", "type": "INTRO", "title": "Bishop Movement", "text": "The Bishop glides on diagonal color roads and never changes color.", "parent_prompt": "Introduce bishop movement.", "diagram_id": "DGM-107-01", "diagram_url": "assets/DGM-107-01.svg", "visual": {"diagram_id": "DGM-107-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-107-01: A White Bishop on a light square in the center, with green diagonal arrows forming an X shape.](../../assets/diagrams/TOP-107/DGM-107-01.svg)", "diagram_alt": "![DGM-107-01: A White Bishop on a light square in the center, with green diagonal arrows forming an X shape.](../../assets/diagrams/TOP-107/DGM-107-01.svg)"}, {"id": "LES-019-S02", "type": "DIAGRAM", "title": "Basic movement", "text": "Use the board to explore bishop movement.", "parent_prompt": "Guide the basic movement.", "diagram_id": "DGM-107-01", "diagram_url": "assets/DGM-107-01.svg", "visual": {"diagram_id": "DGM-107-01", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-107-01: A White Bishop on a light square in the center, with green diagonal arrows forming an X shape.](../../assets/diagrams/TOP-107/DGM-107-01.svg)", "diagram_alt": "![DGM-107-01: A White Bishop on a light square in the center, with green diagonal arrows forming an X shape.](../../assets/diagrams/TOP-107/DGM-107-01.svg)"}, {"id": "LES-019-S03", "type": "DIAGRAM", "title": "Capture", "text": "Use the board to explore bishop movement.", "parent_prompt": "Guide the capture.", "diagram_id": "DGM-107-02", "diagram_url": "assets/DGM-107-02.svg", "visual": {"diagram_id": "DGM-107-02", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-107-02: A dark-square White Bishop sliding diagonally to capture a Black Rook.](../../assets/diagrams/TOP-107/DGM-107-02.svg)", "diagram_alt": "![DGM-107-02: A dark-square White Bishop sliding diagonally to capture a Black Rook.](../../assets/diagrams/TOP-107/DGM-107-02.svg)"}, {"id": "LES-019-S04", "type": "DIAGRAM", "title": "Real-game pattern", "text": "Use the board to explore bishop movement.", "parent_prompt": "Guide the real-game pattern.", "diagram_id": "DGM-107-03", "diagram_url": "assets/DGM-107-03.svg", "visual": {"diagram_id": "DGM-107-03", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-107-03: Two White Bishops side-by-side, controlling huge diagonal paths across the whole board.](../../assets/diagrams/TOP-107/DGM-107-03.svg)", "diagram_alt": "![DGM-107-03: Two White Bishops side-by-side, controlling huge diagonal paths across the whole board.](../../assets/diagrams/TOP-107/DGM-107-03.svg)"}, {"id": "LES-019-S05", "type": "QUESTION", "title": "Recognition check", "text": "Use the board to explore bishop movement.", "parent_prompt": "Guide the recognition check.", "diagram_id": "DGM-107-04", "diagram_url": "assets/DGM-107-04.svg", "visual": {"diagram_id": "DGM-107-04", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-004", "position_version": 1, "position_title": "![DGM-107-04: White Bishop on c4. Highlight a correct diagonal path and an incorrect straight path.](../../assets/diagrams/TOP-107/DGM-107-04.svg)", "diagram_alt": "![DGM-107-04: White Bishop on c4. Highlight a correct diagonal path and an incorrect straight path.](../../assets/diagrams/TOP-107/DGM-107-04.svg)"}, {"id": "LES-019-S06", "type": "QUESTION", "title": "Stay on one colour", "text": "Decide which piece the Bishop can reach.", "parent_prompt": "Guide the square-colour check.", "diagram_id": "DGM-107-05", "diagram_url": "assets/DGM-107-05.svg", "visual": {"diagram_id": "DGM-107-05", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-005", "position_version": 1, "position_title": "![DGM-107-05: White Bishop (light squares) on d3. Black Knight on h7 (light square). Black Pawn on e4 (dark square).](../../assets/diagrams/TOP-107/DGM-107-05.svg)", "diagram_alt": "![DGM-107-05: White Bishop (light squares) on d3. Black Knight on h7 (light square). Black Pawn on e4 (dark square).](../../assets/diagrams/TOP-107/DGM-107-05.svg)"}, {"id": "LES-019-S07", "type": "QUESTION", "title": "Plan the route", "text": "Decide whether the Bishop can reach the target.", "parent_prompt": "Guide the route check.", "diagram_id": "DGM-107-06", "diagram_url": "assets/DGM-107-06.svg", "visual": {"diagram_id": "DGM-107-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)", "diagram_alt": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)"}, {"id": "LES-019-S08", "type": "ASSESSMENT", "title": "Check your progress", "text": "Show that you understand bishop movement.", "parent_prompt": "Check each success criterion with the board.", "diagram_id": "DGM-107-06", "diagram_url": "assets/DGM-107-06.svg", "visual": {"diagram_id": "DGM-107-06", "layout": "VISUAL_60", "animation": "NONE"}, "position_id": "POS-BISHOP-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)", "diagram_alt": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)"}]}, "continue_teaching": {"title": "Continue Teaching", "estimated_minutes": 0, "groups": []}, "full_guide": {"title": "Parent Full Guide", "sections": [{"id": "LES-019-S001", "role": "KB_CONTENT", "type": "SHARED", "section_id": "AT_A_GLANCE", "section_ordinal": 1, "title": "At a Glance", "source_trace": "KB-107#1#B1", "parent_prompt_trace": "KB-107#1#B1", "text": "- **Topic**: Bishop Movement\n- **Difficulty**: Beginner\n- **Typical age**: 6+\n- **Estimated teaching time**: 15 min\n- **Piece/concept type**: Concept\n- **Prerequisites**: TOP-106 Rook Movement, TOP-011 Bishop Recognition\n\n**🎯 Today's Goal:**\nYour child will be able to slide the Bishop diagonally and understand that a Bishop never changes its color square.\n\n**✅ Lesson Success Criteria:**\n- The child moves the Bishop only on diagonal lines.\n- The child correctly identifies whether a Bishop belongs to the light squares or the dark squares.\n- The child captures an enemy piece diagonally without jumping.\n\n*(Purpose: \"Can I teach this today?\" A quick summary for busy parents.)*"}, {"id": "LES-019-S002", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DEFINITION", "section_ordinal": 2, "title": "Definition", "source_trace": "KB-107#2#B1", "parent_prompt_trace": "KB-107#2#B1", "text": "The Bishop moves any number of empty squares in any diagonal direction. It captures by sliding into an enemy piece's square. Because diagonal lines are made up of squares of exactly the same color, a Bishop is \"color-bound.\" This means a Bishop that starts on a light square can only ever move to light squares for the entire game, and a Bishop that starts on a dark square is stuck on dark squares forever."}, {"id": "LES-019-S003", "role": "KB_CONTENT", "type": "SHARED", "section_id": "WHY_IT_MATTERS", "section_ordinal": 3, "title": "Why It Matters", "source_trace": "KB-107#3#B1", "parent_prompt_trace": "KB-107#3#B1", "text": "Bishops are tricky for beginners because diagonal vision is harder to develop than straight-line vision (like the Rook). Mastering the Bishop teaches a child how to see \"criss-cross\" patterns on the board. Furthermore, understanding the concept of \"light\" and \"dark\" Bishops is foundational for intermediate strategy."}, {"id": "LES-019-S004", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BEFORE_YOU_TEACH", "section_ordinal": 4, "title": "Before You Teach (Graph)", "source_trace": "KB-107#4#B1", "parent_prompt_trace": "KB-107#4#B1", "text": "- **Requires:** TOP-011 (Bishop Recognition), TOP-106 (Rook Movement)\n- **Unlocks:** TOP-108 (Knight Movement), TOP-028 (Pins)"}, {"id": "LES-019-S005", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_UNDERSTANDS", "section_ordinal": 5, "title": "Parent Understands", "source_trace": "KB-107#5#B1", "parent_prompt_trace": "KB-107#5#B1", "text": "The Bishop is the exact opposite of the Rook. It can slide as far as it wants, but *only* diagonally. \nThe most important concept to grasp is color binding. You start the game with two Bishops. If you look at their starting squares, one sits on a light square and one sits on a dark square. If you trace any diagonal line, you will see it is entirely made of the same color. Therefore, it is physically impossible for a Bishop to ever switch colors. If a child's Bishop suddenly changes color during a game, they have made an illegal move!"}, {"id": "LES-019-S006", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_TO_TEACH_IT", "section_ordinal": 6, "title": "How to Teach It", "source_trace": "KB-107#6#B1", "parent_prompt_trace": "KB-107#6#B1", "text": "1. **The Magic Paths:** Place one White Bishop on a light square in the center. Tell your child, \"The Bishop is a wizard, and it glides on magic diagonal paths!\"\n2. **The Color Check:** Ask the child what color square the Bishop is standing on. (Light). Have them trace the diagonal with their finger. Ask, \"What color are all the squares you are touching?\" (Light). Emphasize that the wizard is stuck on that color forever!\n3. **The Slide:** Have the child slide the Bishop all the way to a corner.\n4. **The No-Straight Rule:** Try to move the Bishop straight like a Rook. Stop and say, \"Oops! The wizard doesn't know how to walk straight. Only criss-cross!\"\n5. **The Two Brothers:** Place the second White Bishop on a dark square next to the first one. Show that they work together as a team to cover both colors, but they can never cross paths."}, {"id": "LES-019-S007", "role": "KB_CONTENT", "type": "SHARED", "section_id": "STORY_ANALOGY_MEMORY", "section_ordinal": 7, "title": "Teaching Story / Analogy / Memory Hint", "source_trace": "KB-107#7#B1", "parent_prompt_trace": "KB-107#7#B1", "text": "**The Two Wizards:** \nThe Bishops are two wizards. One wizard wears white robes and only walks on the light magic stones. The other wizard wears black robes and only walks on the dark magic stones. They are brothers, but they can never ever meet each other on the same square, because they live on different colors!"}, {"id": "LES-019-S008", "role": "KB_CONTENT", "type": "SHARED", "section_id": "DID_YOU_KNOW", "section_ordinal": 8, "title": "Did You Know? 🎓", "source_trace": "KB-107#8#B1", "parent_prompt_trace": "KB-107#8#B1", "text": "The cut on the top of the Bishop's piece represents a bishop's \"mitre\" (the tall hat worn by church leaders). But in some countries, this piece is called the \"Elephant,\" the \"Runner,\" or even the \"Fool\"!"}, {"id": "LES-019-S009", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_1", "section_ordinal": 9, "title": "Board Diagram 1 — Basic Concept", "source_trace": "KB-107#9#B1", "parent_prompt_trace": "KB-107#9#B1", "text": "*The Bishop glides diagonally, creating an X pattern.*", "diagram_id": "DGM-107-01", "diagram_url": "assets/DGM-107-01.svg", "position_id": "POS-BISHOP-MOVEMENT-001", "position_version": 1, "position_title": "![DGM-107-01: A White Bishop on a light square in the center, with green diagonal arrows forming an X shape.](../../assets/diagrams/TOP-107/DGM-107-01.svg)", "diagram_alt": "![DGM-107-01: A White Bishop on a light square in the center, with green diagonal arrows forming an X shape.](../../assets/diagrams/TOP-107/DGM-107-01.svg)"}, {"id": "LES-019-S010", "role": "KB_CONTENT", "type": "SHARED", "section_id": "HOW_IT_WORKS", "section_ordinal": 10, "title": "How It Works", "source_trace": "KB-107#10#B1", "parent_prompt_trace": "KB-107#10#B1", "text": "When moving a Bishop, pick one diagonal direction and slide as far as you want. You cannot jump over any pieces. If an enemy piece is on your diagonal, you can capture it by sliding to its square."}, {"id": "LES-019-S011", "role": "KB_CONTENT", "type": "SHARED", "section_id": "BOARD_DIAGRAM_2", "section_ordinal": 11, "title": "Board Diagram 2 — Practical Example", "source_trace": "KB-107#11#B1", "parent_prompt_trace": "KB-107#11#B1", "text": "*To capture, the Bishop slides into the enemy piece's square.*", "diagram_id": "DGM-107-02", "diagram_url": "assets/DGM-107-02.svg", "position_id": "POS-BISHOP-MOVEMENT-002", "position_version": 1, "position_title": "![DGM-107-02: A dark-square White Bishop sliding diagonally to capture a Black Rook.](../../assets/diagrams/TOP-107/DGM-107-02.svg)", "diagram_alt": "![DGM-107-02: A dark-square White Bishop sliding diagonally to capture a Black Rook.](../../assets/diagrams/TOP-107/DGM-107-02.svg)"}, {"id": "LES-019-S012", "role": "KB_CONTENT", "type": "SHARED", "section_id": "REAL_GAME_EXAMPLE", "section_ordinal": 12, "title": "Real Game Example", "source_trace": "KB-107#12#B1", "parent_prompt_trace": "KB-107#12#B1", "text": "*When the two wizards work together, they can attack almost the entire board at the same time!*", "diagram_id": "DGM-107-03", "diagram_url": "assets/DGM-107-03.svg", "position_id": "POS-BISHOP-MOVEMENT-003", "position_version": 1, "position_title": "![DGM-107-03: Two White Bishops side-by-side, controlling huge diagonal paths across the whole board.](../../assets/diagrams/TOP-107/DGM-107-03.svg)", "diagram_alt": "![DGM-107-03: Two White Bishops side-by-side, controlling huge diagonal paths across the whole board.](../../assets/diagrams/TOP-107/DGM-107-03.svg)"}, {"id": "LES-019-S013", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COMMON_MISTAKES", "section_ordinal": 13, "title": "Common Mistakes", "source_trace": "KB-107#13#B1", "parent_prompt_trace": "KB-107#13#B1", "text": "- **Color Switching:** Children often drift off the diagonal accidentally, landing on the wrong color.\n- **Rook Moves:** Sometimes they forget and try to move the Bishop straight, especially to capture an unprotected piece sitting right in front of them.\n\n> **🧑‍🏫 Coach Tip:**\n> When your child makes a move with a Bishop, occasionally ask, \"Color check!\" If they started on a light square and landed on a dark square, they will instantly realize they made a mistake."}, {"id": "LES-019-S014", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TEACHING_NOTES", "section_ordinal": 14, "title": "Teaching Notes", "source_trace": "KB-107#14#B1", "parent_prompt_trace": "KB-107#14#B1", "text": "Diagonals are notoriously difficult for young brains to process. Our eyes naturally scan up/down and left/right. It will take time for your child to see the \"criss-cross\" lines clearly. Do not rush this lesson.\n\n> **🧑‍🏫 Coach Tip:**\n> If your child struggles to see diagonals, have them take 4 or 5 pawns and physically place them on the empty squares of the diagonal to build a \"bridge\" for the Bishop to look at."}, {"id": "LES-019-S015", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_FAQ", "section_ordinal": 15, "title": "Parent FAQ", "source_trace": "KB-107#15#B1", "parent_prompt_trace": "KB-107#15#B1", "text": "**Q: My child keeps capturing straight ahead with the Bishop. What do I say?**\nA: Say, \"Ah, that's a Rook move! Remember, the wizard only walks on criss-cross paths.\"\n\n**Q: If my light-square Bishop gets captured, can my dark-square Bishop move to light squares to help out?**\nA: No! Once a wizard picks a color at the start of the game, they are bound to it forever. If you lose your light-square Bishop, your opponent's pieces on light squares are much safer."}, {"id": "LES-019-S016", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PRACTICE_TOGETHER", "section_ordinal": 16, "title": "Practice Together", "source_trace": "KB-107#16#B1", "parent_prompt_trace": "KB-107#16#B1", "text": "**The Color Test Game:**\nTake all the pieces off the board. You (the parent) place a Black piece randomly on the board. The child holds a White Bishop. The child must instantly shout \"Light!\" or \"Dark!\" depending on what color the Black piece is on. Then, they must place their Bishop on the board and capture it in one move. Repeat 10 times."}, {"id": "LES-019-S017", "role": "KB_CONTENT", "type": "SHARED", "section_id": "COACH_CHALLENGE", "section_ordinal": 17, "title": "Coach Challenge ⭐", "source_trace": "KB-107#17#B1", "parent_prompt_trace": "KB-107#17#B1", "text": "**The Wizard's Laser:**\nPlace a White Bishop on `b2` (a dark square). Place 4 or 5 Black pawns on light squares around the board. Place one Black Rook on `g7` (a dark square on the Bishop's diagonal).\nAsk your child: \"The wizard wants to fire his magic laser! Which piece can he hit?\" \nThey must realize that he can *only* hit the Rook, because the pawns are all on light squares! This trains them to only look at pieces sharing their Bishop's color."}, {"id": "LES-019-S018", "role": "KB_CONTENT", "type": "SHARED", "section_id": "TRY_IT_YOURSELF", "section_ordinal": 18, "title": "Try It Yourself", "source_trace": "KB-107#18#B1", "parent_prompt_trace": "KB-107#18#B1", "text": "### 🟢 Recognition (Easy)\n\n**Question:** Which magic path is the Bishop allowed to use? The straight red one, or the diagonal green one?\n**Answer:** The diagonal green one!\n\n### 🟡 Application (Medium)\n\n**Question:** Which enemy piece can the White Bishop capture right now?\n**Answer:** The Black Knight on h7. The Bishop cannot capture the Pawn on e4 because it is on a dark square!\n\n### 🔴 Challenge (Hard)\n\n**Question:** The wizard wants to travel to h2. The pawn on e5 is blocking his long diagonal. How many turns will it take to get to h2?\n**Answer:** Two turns! He must slide up a shorter diagonal first (like to c3 or d4), stop, and then slide down to h2 on his next turn.", "diagram_id": "DGM-107-06", "diagram_url": "assets/DGM-107-06.svg", "position_id": "POS-BISHOP-MOVEMENT-006", "position_version": 1, "position_title": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)", "diagram_alt": "![DGM-107-06: White Bishop on a1 (dark square). Target is h2 (dark square). White pawn on e5.](../../assets/diagrams/TOP-107/DGM-107-06.svg)"}, {"id": "LES-019-S019", "role": "KB_CONTENT", "type": "SHARED", "section_id": "CONTINUE_LEARNING", "section_ordinal": 19, "title": "Continue Learning", "source_trace": "KB-107#19#B1", "parent_prompt_trace": "KB-107#19#B1", "text": "- **Lichess Practice:** [The Pieces - Bishop](https://lichess.org/learn#/2) (Interactive drills for kids)."}, {"id": "LES-019-S020", "role": "KB_CONTENT", "type": "SHARED", "section_id": "RELATED_TOPICS", "section_ordinal": 20, "title": "Related Topics", "source_trace": "KB-107#20#B1", "parent_prompt_trace": "KB-107#20#B1", "text": "- **Prerequisites:** TOP-106 Rook Movement, TOP-011 Bishop (Recognition)\n- **Next Steps:** TOP-108 Knight Movement"}, {"id": "LES-019-S021", "role": "KB_CONTENT", "type": "SHARED", "section_id": "PARENT_CONFIDENCE_CHECK", "section_ordinal": 21, "title": "Parent Confidence Check ✅", "source_trace": "KB-107#21#B1", "parent_prompt_trace": "KB-107#21#B1", "text": "- [ ] Do I understand that Bishops only move diagonally?\n- [ ] Do I understand the concept of color-bound pieces?\n- [ ] Did we practice the \"Color Test Game\"?\n- [ ] Can my child successfully perform a \"Color check\" after moving?"}]}}</script><script id="task-data" type="application/json">{"schema_version": 1, "lesson_id": "LES-019", "tasks": [{"sc
